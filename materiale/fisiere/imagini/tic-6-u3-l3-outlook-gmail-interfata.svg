<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Elementele interfeței unei căsuțe de e-mail în browser (webmail)</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- browser -->
    <rect x="36" y="36" width="604" height="468" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="36" y="36" width="604" height="34" rx="12" fill="#F1E9DF"/>
    <rect x="36" y="58" width="604" height="12" fill="#F1E9DF"/>
    <circle cx="56" cy="53" r="5" fill="#F21F4B"/><circle cx="72" cy="53" r="5" fill="#F29A1F"/><circle cx="88" cy="53" r="5" fill="#14A39A"/>
    <rect x="110" y="43" width="300" height="20" rx="10" fill="#FFFFFF"/>
    <text x="124" y="58" font-size="13" fill="#6B6460">mail.furnizor.ro</text>
    <!-- căutare -->
    <rect x="266" y="80" width="330" height="34" rx="17" fill="#F1E9DF"/>
    <circle cx="288" cy="96" r="7" fill="none" stroke="#171416" stroke-width="2.5"/><path d="M293 101l6 6" stroke="#171416" stroke-width="2.5" stroke-linecap="round"/>
    <text x="308" y="102" font-size="13" fill="#6B6460">Caută în e-mailuri</text>
    <path d="M38 122H638" stroke="#E8DFD3" stroke-width="2"/>

    <!-- bara laterală -->
    <rect x="72" y="134" width="120" height="38" rx="14" fill="#FDE7EC" stroke="#F21F4B" stroke-width="2"/>
    <path d="M88 160l4-12 10-10 6 6-10 10z" fill="#F21F4B"/>
    <text x="116" y="159" font-size="14" font-weight="800">Scrie</text>
    <rect x="66" y="184" width="190" height="30" rx="15" fill="#E2F6FA"/>
    <g font-size="13">
      <text x="80" y="204" font-weight="800">Mesaje primite</text><text x="244" y="204" text-anchor="end" font-weight="800">3</text>
      <text x="80" y="240">Trimise</text>
      <text x="80" y="274">Mesaje nefinalizate</text>
      <text x="80" y="308">Spam</text>
      <text x="80" y="342">Coș de gunoi</text>
      <text x="80" y="390" font-weight="800" fill="#6B6460">Etichete</text><text x="244" y="390" text-anchor="end" font-size="16" font-weight="800" fill="#6B6460">+</text>
      <rect x="80" y="404" width="12" height="12" rx="3" fill="#14A39A"/><text x="100" y="415">Muzică</text>
    </g>
    <path d="M262 122V502" stroke="#E8DFD3" stroke-width="2"/>

    <!-- lista de mesaje -->
    <rect x="280" y="136" width="14" height="14" rx="2" fill="none" stroke="#171416" stroke-width="2"/>
    <path d="M318 150a8 8 0 1 1 6 3" fill="none" stroke="#171416" stroke-width="2.5"/><path d="M314 144l4 6 6-4" fill="none" stroke="#171416" stroke-width="2"/>
    <g font-size="13">
      <rect x="264" y="164" width="374" height="50" fill="#FFF7EE"/>
      <text x="280" y="186" font-weight="800">Prof. de muzică</text><text x="620" y="186" text-anchor="end" font-weight="800">10:24</text>
      <text x="280" y="204" fill="#6B6460">Serbarea de vineri</text>
      <path d="M264 214H638" stroke="#E8DFD3" stroke-width="2"/>
      <text x="280" y="236" font-weight="800">Ana</text><text x="620" y="236" text-anchor="end">ieri</text>
      <text x="280" y="254" fill="#6B6460">Tema la TIC</text>
      <path d="M264 264H638" stroke="#E8DFD3" stroke-width="2"/>
      <text x="280" y="286">Vlad</text><text x="620" y="286" text-anchor="end">12 oct.</text>
      <text x="280" y="304" fill="#6B6460">Proiectul despre apă</text>
      <path d="M264 314H638" stroke="#E8DFD3" stroke-width="2"/>
    </g>

    <!-- numere -->
    <g font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="54" cy="153" r="12" fill="#171416"/><text x="54" y="158">1</text>
      <circle cx="54" cy="199" r="12" fill="#171416"/><text x="54" y="204">2</text>
      <circle cx="54" cy="235" r="12" fill="#171416"/><text x="54" y="240">3</text>
      <circle cx="54" cy="269" r="12" fill="#171416"/><text x="54" y="274">4</text>
      <circle cx="54" cy="303" r="12" fill="#171416"/><text x="54" y="308">5</text>
      <circle cx="54" cy="337" r="12" fill="#171416"/><text x="54" y="342">6</text>
      <circle cx="616" cy="97" r="12" fill="#171416"/><text x="616" y="102">7</text>
      <circle cx="350" cy="143" r="12" fill="#171416"/><text x="350" y="148">8</text>
    </g>

    <!-- legendă -->
    <g font-size="14">
      <text x="664" y="70" font-weight="800"><tspan fill="#C8133A">1</tspan>  Scrie</text><text x="684" y="88" font-size="13" fill="#6B6460">deschide un mesaj nou</text>
      <text x="664" y="120" font-weight="800"><tspan fill="#C8133A">2</tspan>  Mesaje primite</text><text x="684" y="138" font-size="13" fill="#6B6460">Inbox</text>
      <text x="664" y="170" font-weight="800"><tspan fill="#C8133A">3</tspan>  Trimise</text><text x="684" y="188" font-size="13" fill="#6B6460">Sent</text>
      <text x="664" y="220" font-weight="800"><tspan fill="#C8133A">4</tspan>  Mesaje nefinalizate</text><text x="684" y="238" font-size="13" fill="#6B6460">Drafts: ciornele</text>
      <text x="664" y="270" font-weight="800"><tspan fill="#C8133A">5</tspan>  Spam</text><text x="684" y="288" font-size="13" fill="#6B6460">mesaje nesolicitate, nedorite</text>
      <text x="664" y="320" font-weight="800"><tspan fill="#C8133A">6</tspan>  Coș de gunoi</text><text x="684" y="338" font-size="13" fill="#6B6460">mesajele șterse</text>
      <text x="664" y="370" font-weight="800"><tspan fill="#C8133A">7</tspan>  Căutare</text><text x="684" y="388" font-size="13" fill="#6B6460">expeditor, subiect, cuvinte</text>
      <text x="664" y="420" font-weight="800"><tspan fill="#C8133A">8</tspan>  Actualizează</text><text x="684" y="438" font-size="13" fill="#6B6460">verifici dacă ai mesaje noi</text>
    </g>
    <rect x="660" y="458" width="262" height="46" rx="12" fill="#E0F4F2"/>
    <text x="791" y="486" text-anchor="middle" font-size="13"><tspan font-weight="800">Gmail:</tspan> etichete · <tspan font-weight="800">Outlook:</tspan> foldere</text>
  </g>
</svg>
