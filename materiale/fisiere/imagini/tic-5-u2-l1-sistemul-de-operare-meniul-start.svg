<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Meniul Start din Windows 10, cu Accesoriile Windows și butonul Alimentare cu opțiunile Repaus, Închidere și Repornire</title>
  <defs>
    <g id="pw"><path d="M-9 -7a13 13 0 1 0 18 0" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M0 -14v12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- ecran -->
    <rect x="30" y="30" width="490" height="476" rx="14" fill="#E2F6FA" stroke="#171416" stroke-width="4"/>
    <text x="275" y="66" text-anchor="middle" font-size="18" font-weight="800" fill="#0E7F96">Meniul Start</text>
    <rect x="34" y="456" width="482" height="46" rx="10" fill="#171416"/>
    <g fill="#3EC6E0"><rect x="48" y="466" width="12" height="12" rx="1"/><rect x="62" y="466" width="12" height="12" rx="1"/><rect x="48" y="480" width="12" height="12" rx="1"/><rect x="62" y="480" width="12" height="12" rx="1"/></g>
    <rect x="44" y="462" width="34" height="34" rx="6" fill="none" stroke="#FFC83D" stroke-width="3"/>
    <text x="92" y="484" font-size="15" font-weight="700" fill="#FFC83D">← butonul Start</text>
    <rect x="300" y="468" width="22" height="22" rx="4" fill="#F21F4B"/><rect x="330" y="468" width="22" height="22" rx="4" fill="#14A39A"/>
    <text x="500" y="484" text-anchor="end" font-size="14" font-weight="700" fill="#fff">10:45</text>

    <!-- meniu start -->
    <rect x="34" y="84" width="320" height="372" fill="#fff" stroke="#C9C1BA" stroke-width="2"/>
    <rect x="35" y="85" width="50" height="370" fill="#F0E8FA"/>
    <circle cx="60" cy="372" r="11" fill="none" stroke="#7A3FB8" stroke-width="4"/>
    <circle cx="60" cy="372" r="4" fill="#7A3FB8"/>
    <circle cx="60" cy="420" r="20" fill="#FFC83D"/>
    <g transform="translate(60 422)" color="#171416"><use href="#pw"/></g>

    <text x="102" y="118" font-size="15" font-weight="800">Accesorii Windows</text>
    <path d="M300 108l7 7l7-7" stroke="#171416" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="110" y="134" width="22" height="22" rx="4" fill="#F21F4B"/><text x="144" y="151" font-size="15" font-weight="700">Paint</text>
    <rect x="110" y="168" width="22" height="22" rx="4" fill="#3EC6E0"/><text x="144" y="185" font-size="15" font-weight="700">Notepad</text>
    <rect x="110" y="202" width="22" height="22" rx="4" fill="#0E7F96"/><text x="144" y="219" font-size="15" font-weight="700">WordPad</text>
    <path d="M102 246H340" stroke="#E8DFD3" stroke-width="2"/>
    <text x="102" y="276" font-size="15" font-weight="700" fill="#6B6460">alte programe…</text>

    <!-- meniul alimentare -->
    <rect x="96" y="310" width="200" height="132" rx="10" fill="#fff" stroke="#171416" stroke-width="3"/>
    <text x="118" y="342" font-size="15" font-weight="700">Repaus</text>
    <rect x="102" y="356" width="188" height="36" rx="6" fill="#FFF4D6"/>
    <text x="118" y="380" font-size="15" font-weight="800">Închidere</text>
    <text x="118" y="424" font-size="15" font-weight="700">Repornire</text>
    <path d="M82 420H94" stroke="#171416" stroke-width="3"/>

    <!-- legenda -->
    <g transform="translate(572 62)" color="#171416"><use href="#pw"/></g>
    <text x="596" y="70" font-size="19" font-weight="800">Butonul Alimentare (Power)</text>

    <rect x="550" y="96" width="380" height="96" rx="16" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <circle cx="596" cy="144" r="26" fill="#FDE7EC"/>
    <g transform="translate(596 146)" color="#C8133A"><use href="#pw"/></g>
    <text x="636" y="134" font-size="17" font-weight="800">Închidere (Shut down)</text>
    <text x="636" y="158" font-size="14" fill="#6B6460">oprirea calculatorului</text>

    <rect x="550" y="206" width="380" height="96" rx="16" fill="#fff" stroke="#14A39A" stroke-width="3"/>
    <circle cx="596" cy="254" r="26" fill="#E0F4F2"/>
    <path d="M608 246a14 14 0 1 0 2 12" stroke="#0B6F68" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M612 236v12h-12" stroke="#0B6F68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="636" y="244" font-size="17" font-weight="800">Repornire (Restart)</text>
    <text x="636" y="268" font-size="14" fill="#6B6460">repornirea sistemului de operare</text>

    <rect x="550" y="316" width="380" height="96" rx="16" fill="#fff" stroke="#7A3FB8" stroke-width="3"/>
    <circle cx="596" cy="364" r="26" fill="#F0E8FA"/>
    <path d="M604 350a15 15 0 1 0 6 22a12 12 0 0 1-6-22z" fill="#7A3FB8"/>
    <text x="636" y="354" font-size="17" font-weight="800">Repaus (Sleep)</text>
    <text x="636" y="378" font-size="14" fill="#6B6460">consum redus de energie,</text>
    <text x="636" y="396" font-size="14" fill="#6B6460">când pleci pentru puțin timp</text>

    <rect x="550" y="430" width="380" height="76" rx="16" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/>
    <text x="740" y="460" text-anchor="middle" font-size="15" font-weight="800">Accesorii Windows</text>
    <text x="740" y="484" text-anchor="middle" font-size="14">Paint: desen · Notepad, WordPad: texte</text>
  </g>
</svg>
