      <circle cx="742" cy="201" r="12" fill="#F21F4B"/><text x="742" y="206">4</text>
      <circle cx="742" cy="235" r="12" fill="#F21F4B"/><text x="742" y="240">5</text>
      <circle cx="742" cy="269" r="12" fill="#F21F4B"/><text x="742" y="274">6</text>
