<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Cele opt etape ale creării jocului, de la planificare și scenă până la testare și îmbunătățiri</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6460"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
<text x="480" y="44" font-size="24" font-weight="800" text-anchor="middle">Cum se face un joc: opt etape</text><rect x="30" y="80" width="210" height="150" rx="18" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="3"/><circle cx="62" cy="114" r="17" fill="#7A3FB8"/><text x="62" y="119" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="88" y="120" font-size="18" font-weight="800">Planifici</text><text x="48" y="164" font-size="14">scopul, regulile,</text><text x="48" y="186" font-size="14">câștig și pierdere</text><path d="M244 155H256" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><rect x="260" y="80" width="210" height="150" rx="18" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><circle cx="292" cy="114" r="17" fill="#3EC6E0"/><text x="292" y="119" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="318" y="120" font-size="18" font-weight="800">Scena</text><text x="278" y="164" font-size="14">decorul</text><text x="278" y="186" font-size="14">și personajele</text><path d="M474 155H486" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><rect x="490" y="80" width="210" height="150" rx="18" fill="#FFE9D4" stroke="#FF8C1A" stroke-width="3"/><circle cx="522" cy="114" r="17" fill="#FF8C1A"/><text x="522" y="119" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="548" y="120" font-size="18" font-weight="800">Variabile</text><text x="508" y="164" font-size="14">scor și vieți, pentru</text><text x="508" y="186" font-size="14">toate personajele</text><path d="M704 155H716" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><rect x="720" y="80" width="210" height="150" rx="18" fill="#FFF4D6" stroke="#CC9900" stroke-width="3"/><circle cx="752" cy="114" r="17" fill="#CC9900"/><text x="752" y="119" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="778" y="120" font-size="18" font-weight="800">Pornirea</text><text x="738" y="164" font-size="14">scor = 0, vieți = 3,</text><text x="738" y="186" font-size="14">pisoiul la start</text><rect x="720" y="280" width="210" height="150" rx="18" fill="#E3EEFF" stroke="#4C97FF" stroke-width="3"/><circle cx="752" cy="314" r="17" fill="#4C97FF"/><text x="752" y="319" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="778" y="320" font-size="18" font-weight="800">Mișcarea</text><text x="738" y="364" font-size="14">cu săgețile,</text><text x="738" y="386" font-size="14">câte 10 pixeli</text><path d="M716 355H702" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><rect x="490" y="280" width="210" height="150" rx="18" fill="#FFF4D6" stroke="#CF8B17" stroke-width="3"/><circle cx="522" cy="314" r="17" fill="#CF8B17"/><text x="522" y="319" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="548" y="320" font-size="18" font-weight="800">Deciziile</text><text x="508" y="364" font-size="14">stea, crab,</text><text x="508" y="386" font-size="14">câștig și pierdere</text><path d="M486 355H472" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><rect x="260" y="280" width="210" height="150" rx="18" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><circle cx="292" cy="314" r="17" fill="#14A39A"/><text x="292" y="319" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="318" y="320" font-size="18" font-weight="800">Testarea</text><text x="278" y="364" font-size="14">verifici fiecare</text><text x="278" y="386" font-size="14">regulă</text><path d="M256 355H242" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><rect x="30" y="280" width="210" height="150" rx="18" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><circle cx="62" cy="314" r="17" fill="#F21F4B"/><text x="62" y="319" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="88" y="320" font-size="18" font-weight="800">Îmbunătățiri</text><text x="48" y="364" font-size="14">niveluri, bonus,</text><text x="48" y="386" font-size="14">decor de final</text><path d="M845 234V274" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><path d="M400 432C400 486 560 486 560 440" fill="none" stroke="#6B6460" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#ag)"/><text x="480" y="516" font-size="14" font-weight="700" fill="#6B6460" text-anchor="middle">Dacă un test nu merge, cauți greșeala, o corectezi și testezi din nou.</text>
  </g>
</svg>
