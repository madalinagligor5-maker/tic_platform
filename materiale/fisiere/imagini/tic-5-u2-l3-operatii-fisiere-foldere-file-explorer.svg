<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Fereastra File Explorer: structura arborescentă în stânga, conținutul folderului în dreapta, caseta Căutare și meniul Vizualizare</title>
  <defs>
    <g id="fd"><path d="M0 4a3 3 0 0 1 3-3h9l4 4h12a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z" fill="#FFC83D"/></g>
    <g id="fdm"><path d="M0 8a6 6 0 0 1 6-6h22l8 8h30a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6z" fill="#FFC83D"/><path d="M0 20h72v36a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6z" fill="#F5B21F"/></g>
    <g id="doc"><path d="M0 0h42l14 14v54H0z" fill="#fff" stroke="#171416" stroke-width="3" stroke-linejoin="round"/><path d="M10 28h34M10 40h28M10 52h34" stroke="#C9C1BA" stroke-width="4" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- fereastra -->
    <rect x="30" y="24" width="900" height="404" rx="12" fill="#fff" stroke="#171416" stroke-width="3"/>
    <path d="M31.5 60V36a10.5 10.5 0 0 1 10.5-10.5H918a10.5 10.5 0 0 1 10.5 10.5V60z" fill="#E2F6FA"/>
    <use href="#fd" x="48" y="31"/>
    <text x="90" y="50" font-size="15" font-weight="800">Aplic1 – File Explorer</text>
    <path d="M836 43h14" stroke="#171416" stroke-width="3" stroke-linecap="round"/>
    <rect x="864" y="36" width="14" height="14" fill="none" stroke="#171416" stroke-width="2.5"/>
    <path d="M894 37l12 12M906 37l-12 12" stroke="#171416" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M31.5 60H928.5" stroke="#171416" stroke-width="2"/>
    <!-- meniuri -->
    <g font-size="14" font-weight="700">
      <text x="50" y="86">Fișier</text>
      <text x="116" y="86">Acasă</text>
      <text x="184" y="86">Partajare</text>
      <rect x="264" y="68" width="104" height="26" rx="6" fill="#FFF4D6" stroke="#FFC83D" stroke-width="2"/>
      <text x="316" y="86" text-anchor="middle">Vizualizare</text>
    </g>
    <!-- adresa si cautare -->
    <rect x="46" y="102" width="580" height="32" rx="6" fill="#fff" stroke="#C9C1BA" stroke-width="2"/>
    <text x="60" y="124" font-size="14" font-weight="700">Acest PC  ›  C:  ›  Lucru  ›  Aplic1</text>
    <rect x="642" y="102" width="272" height="32" rx="6" fill="#fff" stroke="#3EC6E0" stroke-width="3"/>
    <circle cx="662" cy="116" r="7" fill="none" stroke="#0E7F96" stroke-width="3"/>
    <path d="M667 121l6 6" stroke="#0E7F96" stroke-width="3" stroke-linecap="round"/>
    <text x="682" y="124" font-size="14" fill="#6B6460">Căutare în Aplic1</text>
    <!-- panou stanga -->
    <rect x="42" y="144" width="248" height="274" rx="6" fill="#FFF7EE"/>
    <g font-size="15" font-weight="700">
      <text x="54" y="176" fill="#6B6460">›</text><text x="72" y="176">Acces rapid</text>
      <text x="54" y="208" fill="#6B6460">⌄</text><text x="72" y="208">Acest PC</text>
      <text x="74" y="240" fill="#6B6460">⌄</text><use href="#fd" x="90" y="226"/><text x="128" y="240">C:</text>
      <text x="94" y="272" fill="#6B6460">⌄</text><use href="#fd" x="110" y="258"/><text x="148" y="272">Lucru</text>
      <rect x="126" y="286" width="150" height="28" rx="5" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="2"/>
      <use href="#fd" x="134" y="290"/><text x="172" y="305">Aplic1</text>
      <use href="#fd" x="134" y="322"/><text x="172" y="337">Aplic2</text>
      <text x="74" y="374" fill="#6B6460">›</text><use href="#fd" x="90" y="360"/><text x="128" y="374">E: (stickul)</text>
    </g>
    <!-- panou dreapta -->
    <use href="#doc" x="340" y="166"/>
    <rect x="320" y="158" width="96" height="120" rx="8" fill="#3EC6E0" fill-opacity="0.18" stroke="#3EC6E0" stroke-width="2"/>
    <text x="368" y="262" text-anchor="middle" font-size="14" font-weight="700">test1.txt</text>
    <use href="#doc" x="460" y="166"/>
    <text x="488" y="262" text-anchor="middle" font-size="14" font-weight="700">test2.txt</text>
    <use href="#fdm" x="572" y="170"/>
    <text x="608" y="262" text-anchor="middle" font-size="14" font-weight="700">Proiect</text>
    <text x="620" y="394" text-anchor="middle" font-size="14" fill="#6B6460">un clic: selectezi · dublu clic: deschizi</text>

    <!-- buline -->
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#fff">
      <circle cx="270" cy="166" r="14" fill="#171416"/><text x="270" y="171">1</text>
      <circle cx="900" cy="166" r="14" fill="#171416"/><text x="900" y="171">2</text>
      <circle cx="900" cy="96" r="14" fill="#171416"/><text x="900" y="101">3</text>
      <circle cx="388" cy="81" r="14" fill="#171416"/><text x="388" y="86">4</text>
      <circle cx="58" cy="346" r="14" fill="#171416"/><text x="58" y="351">5</text>
    </g>

    <!-- legenda -->
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#fff">
      <circle cx="54" cy="474" r="14" fill="#171416"/><text x="54" y="479">1</text>
      <circle cx="234" cy="474" r="14" fill="#171416"/><text x="234" y="479">2</text>
      <circle cx="414" cy="474" r="14" fill="#171416"/><text x="414" y="479">3</text>
      <circle cx="594" cy="474" r="14" fill="#171416"/><text x="594" y="479">4</text>
      <circle cx="774" cy="474" r="14" fill="#171416"/><text x="774" y="479">5</text>
    </g>
    <g font-size="14" font-weight="700">
      <text x="76" y="468">structura</text><text x="76" y="488">arborescentă</text>
      <text x="256" y="468">conținutul</text><text x="256" y="488">folderului ales</text>
      <text x="436" y="468">caseta</text><text x="436" y="488">Căutare</text>
      <text x="616" y="468">meniul</text><text x="616" y="488">Vizualizare</text>
      <text x="796" y="468">› expandare:</text><text x="796" y="488">arată subfolderele</text>
    </g>
  </g>
</svg>
