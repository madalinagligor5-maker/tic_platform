<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Cele patru mișcări ale unui obiect 3D în Paint 3D: rotiri și apropiere sau depărtare de pânză</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <g id="cub">
      <path d="M-45-25L-25-45H45L25-25Z" fill="#E0F4F2" stroke="#0B6F68" stroke-width="3" stroke-linejoin="round"/>
      <path d="M25-25L45-45V25L25 45Z" fill="#14A39A" stroke="#0B6F68" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-45" y="-25" width="70" height="70" fill="#FFFFFF" stroke="#0B6F68" stroke-width="3"/>
    </g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="54" text-anchor="middle" font-size="22" font-weight="800">Cele patru mișcări ale unui obiect 3D</text>

    <rect x="40" y="80" width="200" height="320" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="265" y="80" width="200" height="320" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="490" y="80" width="200" height="320" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="715" y="80" width="200" height="320" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="70" cy="108" r="15" fill="#171416"/><text x="70" y="113">1</text>
      <circle cx="295" cy="108" r="15" fill="#171416"/><text x="295" y="113">2</text>
      <circle cx="520" cy="108" r="15" fill="#171416"/><text x="520" y="113">3</text>
      <circle cx="745" cy="108" r="15" fill="#171416"/><text x="745" y="113">4</text>
    </g>

    <!-- 1 rotire în jurul centrului -->
    <use href="#cub" transform="translate(140 220)"/>
    <path d="M86 176A72 72 0 1 1 82 262" fill="none" stroke="#F21F4B" stroke-width="4" marker-end="url(#sag)"/>
    <text x="140" y="340" text-anchor="middle" font-size="16" font-weight="800">rotire stânga/dreapta</text>
    <text x="140" y="362" text-anchor="middle" font-size="14" fill="#6B6460">în jurul centrului</text>

    <!-- 2 axa orizontală -->
    <path d="M285 220H445" stroke="#6B6460" stroke-width="2" stroke-dasharray="6 5"/>
    <use href="#cub" transform="translate(365 220)"/>
    <path d="M430 178A14 42 0 1 1 424 261" fill="none" stroke="#F21F4B" stroke-width="4" marker-end="url(#sag)"/>
    <text x="365" y="340" text-anchor="middle" font-size="16" font-weight="800">rotire în jurul</text>
    <text x="365" y="362" text-anchor="middle" font-size="14" fill="#6B6460">axei orizontale</text>

    <!-- 3 axa verticală -->
    <path d="M590 136V306" stroke="#6B6460" stroke-width="2" stroke-dasharray="6 5"/>
    <use href="#cub" transform="translate(590 230)"/>
    <path d="M548 160A44 13 0 1 0 632 162" fill="none" stroke="#F21F4B" stroke-width="4" marker-end="url(#sag)"/>
    <text x="590" y="340" text-anchor="middle" font-size="16" font-weight="800">rotire în jurul</text>
    <text x="590" y="362" text-anchor="middle" font-size="14" fill="#6B6460">axei verticale</text>

    <!-- 4 apropiere / depărtare -->
    <path d="M800 140H880L860 280H780Z" fill="#F1E9DF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="862" y="160" text-anchor="middle" font-size="13" fill="#6B6460">pânza</text>
    <use href="#cub" transform="translate(790 230)"/>
    <path d="M836 300L882 254" stroke="#F21F4B" stroke-width="4" marker-start="url(#sag)" marker-end="url(#sag)"/>
    <text x="815" y="340" text-anchor="middle" font-size="16" font-weight="800">apropiere/depărtare</text>
    <text x="815" y="362" text-anchor="middle" font-size="14" fill="#6B6460">față de pânză</text>

    <rect x="40" y="430" width="875" height="76" rx="16" fill="#E2F6FA"/>
    <text x="478" y="462" text-anchor="middle" font-size="15"><tspan font-weight="800">Mărimea</tspan> se schimbă trăgând de colțurile obiectului.</text>
    <text x="478" y="486" text-anchor="middle" font-size="15"><tspan font-weight="800">Vizualizare 3D</tspan> îți arată obiectul din toate părțile.</text>
  </g>
</svg>
