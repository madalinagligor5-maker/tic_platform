<text x="480" y="44" font-size="24" font-weight="800" text-anchor="middle">Mesajele leagă scripturile între ele</text><text x="30" y="82" font-size="16" font-weight="800" fill="#3373CC">1. Pisoiul se mișcă</text><path d="M30 110C55 88 100 88 125 110H400.73211669921875Q404.73211669921875 110 404.73211669921875 114V148Q404.73211669921875 152 400.73211669921875 152H78l-8 8h-16l-8 -8H34Q30 152 30 148Z" fill="#FFBF00" stroke="#CC9900" stroke-width="1.5"/><text x="40" y="138" font-size="15" font-weight="700" fill="#fff">când tasta</text><rect x="128.15554809570312" y="120" width="159.30587768554688" height="26" rx="5" fill="#CC9900"/><text x="137.15554809570312" y="138" font-size="15" font-weight="700" fill="#fff">săgeată dreapta</text><path d="M269.46142578125 130h10l-5 6z" fill="#fff"/><text x="293.46142578125" y="138" font-size="15" font-weight="700" fill="#fff">este apăsată</text><path d="M30 156Q30 152 34 152H46l8 8h16l8 -8H192.5796661376953Q196.5796661376953 152 196.5796661376953 156V188Q196.5796661376953 192 192.5796661376953 192H78l-8 8h-16l-8 -8H34Q30 192 30 188Z" fill="#4C97FF" stroke="#3373CC" stroke-width="1.5"/><text x="40" y="177" font-size="15" font-weight="700" fill="#fff">modifică x cu</text><rect x="151.58572387695312" y="159" width="32.99394226074219" height="26" rx="13" fill="#fff" stroke="#3373CC" stroke-width="1"/><text x="168.08269500732422" y="177" font-size="14" font-weight="700" fill="#575E75" text-anchor="middle">10</text><path d="M30 196Q30 192 34 192H46l8 8h16l8 -8H263.1962127685547Q267.1962127685547 192 267.1962127685547 196V228Q267.1962127685547 232 263.1962127685547 232H78l-8 8h-16l-8 -8H34Q30 232 30 228Z" fill="#FFBF00" stroke="#CC9900" stroke-width="1.5"/><text x="40" y="217" font-size="15" font-weight="700" fill="#fff">trimite mesajul</text><rect x="165.580810546875" y="199" width="89.61540222167969" height="26" rx="5" fill="#CC9900"/><text x="174.580810546875" y="217" font-size="15" font-weight="700" fill="#fff">verifică</text><path d="