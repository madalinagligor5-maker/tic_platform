" fill="#2E8EB8"/><text x="632.6853485107422" y="227" font-size="15" font-weight="700" fill="#fff">Crab</text><path d="M674.0305938720703 219h10l-5 6z" fill="#fff"/><text x="698.0305938720703" y="227" font-size="15" font-weight="700" fill="#fff">?</text><text x="735.8656616210938" y="227" font-size="14" font-weight="700">→ –1 viață, la start</text><text x="506" y="265" font-size="14" font-weight="800" fill="#CF8B17">dacă</text><path d="M548 260l18 -18h110.00030517578125l18 18l-18 18h-110.00030517578125z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><rect x="568" y="246" width="57.01524353027344" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="580" y="265" font-size="15" font-weight="700" fill="#fff">scor</text><text x="631.0152435302734" y="265" font-size="15" font-weight="700" fill="#fff">=</text><rect x="646.0003051757812" y="247" width="28" height="26" rx="13" fill="#fff" stroke="#389438" stroke-width="1"/><text x="660.0003051757812" y="265" font-size="14" font-weight="700" fill="#575E75" text-anchor="middle">5</text><text x="704.0003051757812" y="265" font-size="14" font-weight="700">→ Ai câștigat!</text><text x="506" y="303" font-size="14" font-weight="800" fill="#CF8B17">dacă</text><path d="M548 298l18 -18h110.97529602050781l18 18l-18 18h-110.97529602050781z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><rect x="568" y="284" width="57.990234375" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="580" y="303" font-size="15" font-weight="700" fill="#fff">vieți</text><text x="631.990234375" y="303" font-size="15" font-weight="700" fill="#fff">&lt;</text><rect x="646.9752960205078" y="285" width="28" height="26" rx="13" fill="#fff" stroke="#389438" stroke-width="1"/><text x="660.9752960205078" y="303" font-size="14" font-weight="700" fill="#575E75" text-anchor="middle">1</text><text x="704.9752960205078" y="303" font-size="14" font-weight="700">→ Joc terminat!</text><text x="506" y="341" 