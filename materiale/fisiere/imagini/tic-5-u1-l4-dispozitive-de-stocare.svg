<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Unitățile de măsură pentru stocare, de la bit la terabyte, și capacitățile unor dispozitive</title>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C8133A"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E7F96"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Unitățile de măsură pentru stocare</text>
    <text x="40" y="86" font-size="14" font-weight="700" fill="#C8133A">spre unități mai mari: împărțim</text>
    <text x="920" y="86" text-anchor="end" font-size="14" font-weight="700" fill="#0E7F96">spre unități mai mici: înmulțim</text>

    <!-- cutii -->
    <g text-anchor="middle">
      <rect x="37" y="140" width="106" height="80" rx="12" fill="#F1E9DF" stroke="#6B6460" stroke-width="3"/>
      <text x="90" y="178" font-size="26" font-weight="800">b</text><text x="90" y="204" font-size="13">bit: 0 sau 1</text>
      <rect x="193" y="140" width="106" height="80" rx="12" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
      <text x="246" y="178" font-size="26" font-weight="800">B</text><text x="246" y="204" font-size="13">byte (octet)</text>
      <rect x="349" y="140" width="106" height="80" rx="12" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
      <text x="402" y="178" font-size="26" font-weight="800">KB</text><text x="402" y="204" font-size="13">kilobyte</text>
      <rect x="505" y="140" width="106" height="80" rx="12" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
      <text x="558" y="178" font-size="26" font-weight="800">MB</text><text x="558" y="204" font-size="13">megabyte</text>
      <rect x="661" y="140" width="106" height="80" rx="12" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
      <text x="714" y="178" font-size="26" font-weight="800">GB</text><text x="714" y="204" font-size="13">gigabyte</text>
      <rect x="817" y="140" width="106" height="80" rx="12" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
      <text x="870" y="178" font-size="26" font-weight="800">TB</text><text x="870" y="204" font-size="13">terabyte</text>
    </g>
    <!-- arce de sus (împărțire) -->
    <g fill="none" stroke="#C8133A" stroke-width="3">
      <path d="M96 136Q168 96 236 134" marker-end="url(#r)"/>
      <path d="M252 136Q324 96 392 134" marker-end="url(#r)"/>
      <path d="M408 136Q480 96 548 134" marker-end="url(#r)"/>
      <path d="M564 136Q636 96 704 134" marker-end="url(#r)"/>
      <path d="M720 136Q792 96 860 134" marker-end="url(#r)"/>
    </g>
    <g font-size="14" font-weight="800" fill="#C8133A" text-anchor="middle">
      <text x="168" y="108">: 8</text><text x="324" y="108">: 1024</text><text x="480" y="108">: 1024</text><text x="636" y="108">: 1024</text><text x="792" y="108">: 1024</text>
    </g>
    <!-- arce de jos (înmulțire) -->
    <g fill="none" stroke="#0E7F96" stroke-width="3">
      <path d="M240 224Q168 264 100 226" marker-end="url(#b)"/>
      <path d="M396 224Q324 264 256 226" marker-end="url(#b)"/>
      <path d="M552 224Q480 264 412 226" marker-end="url(#b)"/>
      <path d="M708 224Q636 264 568 226" marker-end="url(#b)"/>
      <path d="M864 224Q792 264 724 226" marker-end="url(#b)"/>
    </g>
    <g font-size="14" font-weight="800" fill="#0E7F96" text-anchor="middle">
      <text x="168" y="266">× 8</text><text x="324" y="266">× 1024</text><text x="480" y="266">× 1024</text><text x="636" y="266">× 1024</text><text x="792" y="266">× 1024</text>
    </g>

    <!-- exemple -->
    <rect x="40" y="300" width="430" height="200" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="60" y="332" font-size="17" font-weight="800">Exemple</text>
    <text x="60" y="366" font-size="15">3 072 MB : 1024 = <tspan font-weight="800">3 GB</tspan></text>
    <text x="60" y="396" font-size="15">2 GB = 2 × 1024 MB = <tspan font-weight="800">2 048 MB</tspan></text>
    <text x="60" y="426" font-size="15">8 biți = <tspan font-weight="800">1 byte</tspan> (o literă)</text>
    <text x="60" y="470" font-size="14" fill="#C8133A" font-weight="700">Atenție: 1 km = 1000 m, dar 1 KB = 1024 B</text>

    <!-- capacități -->
    <rect x="490" y="300" width="430" height="200" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="510" y="332" font-size="17" font-weight="800">Capacități obișnuite</text>
    <g font-size="14" text-anchor="middle">
      <circle cx="550" cy="386" r="28" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><circle cx="550" cy="386" r="6" fill="#FFF7EE" stroke="#3EC6E0" stroke-width="2"/>
      <text x="550" y="436" font-weight="800">CD</text><text x="550" y="458">700 MB</text>
      <circle cx="650" cy="386" r="28" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><circle cx="650" cy="386" r="6" fill="#FFF7EE" stroke="#3EC6E0" stroke-width="2"/>
      <text x="650" y="436" font-weight="800">DVD</text><text x="650" y="458">4,7 GB</text>
      <circle cx="750" cy="386" r="28" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><circle cx="750" cy="386" r="6" fill="#FFF7EE" stroke="#3EC6E0" stroke-width="2"/>
      <text x="750" y="436" font-weight="800">Blu-ray</text><text x="750" y="458">25 GB</text>
      <rect x="826" y="360" width="56" height="52" rx="6" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><circle cx="854" cy="386" r="14" fill="none" stroke="#14A39A" stroke-width="3"/>
      <text x="854" y="436" font-weight="800">HDD</text><text x="854" y="458">până la 8 TB</text>
    </g>
  </g>
</svg>
