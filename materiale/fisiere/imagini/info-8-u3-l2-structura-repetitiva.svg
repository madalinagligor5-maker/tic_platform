<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Schemele logice ale structurilor repetitive while, do … while și for</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Cele trei structuri repetitive</text>

    <!-- while -->
    <rect x="30" y="68" width="290" height="442" rx="18" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="175" y="102" text-anchor="middle" font-size="20" font-weight="800" fill="#0E7F96" font-family="JetBrains Mono, Consolas, monospace">while</text>
    <path d="M175 116 V142" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <polygon points="95,190 175,150 255,190 175,230" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/>
    <text x="175" y="195" text-anchor="middle" font-size="15" font-weight="700">condiție</text>
    <path d="M175 230 V272" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <text x="190" y="257" font-size="14" font-weight="800" fill="#0B6F68">da</text>
    <rect x="105" y="278" width="140" height="50" rx="12" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="175" y="308" text-anchor="middle" font-size="15" font-weight="700">instrucțiuni</text>
    <path d="M105 303 H68 V190 H89" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <path d="M255 190 H285 V408" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <text x="270" y="178" text-anchor="middle" font-size="14" font-weight="800" fill="#C8133A">nu</text>
    <rect x="182" y="414" width="122" height="40" rx="20" fill="#F1E9DF"/>
    <text x="243" y="439" text-anchor="middle" font-size="14" font-weight="700">după buclă</text>

    <!-- do while -->
    <rect x="335" y="68" width="290" height="442" rx="18" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="480" y="102" text-anchor="middle" font-size="20" font-weight="800" fill="#0E7F96" font-family="JetBrains Mono, Consolas, monospace">do … while</text>
    <path d="M480 116 V140" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <rect x="410" y="146" width="140" height="50" rx="12" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="480" y="176" text-anchor="middle" font-size="15" font-weight="700">instrucțiuni</text>
    <path d="M480 196 V238" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <polygon points="400,284 480,244 560,284 480,324" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/>
    <text x="480" y="289" text-anchor="middle" font-size="15" font-weight="700">condiție</text>
    <path d="M400 284 H368 V171 H404" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <text x="384" y="272" text-anchor="middle" font-size="14" font-weight="800" fill="#0B6F68">da</text>
    <path d="M480 324 V408" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <text x="494" y="372" font-size="14" font-weight="800" fill="#C8133A">nu</text>
    <rect x="419" y="414" width="122" height="40" rx="20" fill="#F1E9DF"/>
    <text x="480" y="439" text-anchor="middle" font-size="14" font-weight="700">după buclă</text>

    <!-- for -->
    <rect x="640" y="68" width="290" height="442" rx="18" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="785" y="102" text-anchor="middle" font-size="20" font-weight="800" fill="#0E7F96" font-family="JetBrains Mono, Consolas, monospace">for</text>
    <rect x="725" y="120" width="120" height="40" rx="12" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="785" y="146" text-anchor="middle" font-size="15" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">i = 1</text>
    <path d="M785 160 V188" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <polygon points="705,232 785,194 865,232 785,270" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/>
    <text x="785" y="237" text-anchor="middle" font-size="15" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">i &lt;= n</text>
    <path d="M785 270 V296" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <text x="800" y="290" font-size="14" font-weight="800" fill="#0B6F68">da</text>
    <rect x="715" y="302" width="140" height="46" rx="12" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="785" y="330" text-anchor="middle" font-size="15" font-weight="700">instrucțiuni</text>
    <path d="M785 348 V366" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <rect x="735" y="372" width="100" height="38" rx="12" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="785" y="397" text-anchor="middle" font-size="15" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">i++</text>
    <path d="M735 391 H674 V232 H699" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <path d="M865 232 H898 V426" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <text x="882" y="220" text-anchor="middle" font-size="14" font-weight="800" fill="#C8133A">nu</text>
    <rect x="800" y="432" width="114" height="36" rx="18" fill="#F1E9DF"/>
    <text x="857" y="455" text-anchor="middle" font-size="14" font-weight="700">după buclă</text>
  </g>
  <g font-family="Montserrat, Arial, sans-serif" font-size="14" fill="#6B6460" text-anchor="middle">
    <text x="175" y="490">verifică înainte · poate de 0 ori</text>
    <text x="480" y="490">verifică după · cel puțin o dată</text>
    <text x="785" y="496">număr cunoscut de pași</text>
  </g>
</svg>
