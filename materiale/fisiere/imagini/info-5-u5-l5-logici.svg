<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Operatorii logici ca întrerupătoare: la „și” becul se aprinde doar dacă ambele sunt închise, la „sau” ajunge unul</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="800">„și”, „sau”, „nu” ca întrerupătoare</text>
    <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6B6460">întrerupător închis = Adevărat (A), deschis = Fals (F); becul aprins = rezultat Adevărat</text>

    <!-- ȘI: serie -->
    <rect x="40" y="90" width="430" height="310" rx="18" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <text x="255" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0E7F96">P și Q</text>
    <g stroke="#171416" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M90 190H170M230 190H290M350 190H410V250M410 290V330H90V264M90 248V190"/>
    </g>
    <!-- baterie -->
    <path d="M70 248H110" stroke="#171416" stroke-width="4"/>
    <path d="M80 264H100" stroke="#171416" stroke-width="8"/>
    <!-- P închis -->
    <circle cx="170" cy="190" r="6" fill="#14A39A"/><circle cx="230" cy="190" r="6" fill="#14A39A"/>
    <path d="M170 190H230" stroke="#14A39A" stroke-width="5" stroke-linecap="round"/>
    <!-- Q deschis -->
    <circle cx="290" cy="190" r="6" fill="#C8133A"/><circle cx="350" cy="190" r="6" fill="#C8133A"/>
    <path d="M290 190L342 160" stroke="#C8133A" stroke-width="5" stroke-linecap="round"/>
    <!-- bec stins -->
    <circle cx="410" cy="270" r="20" fill="#E8DFD3" stroke="#6B6460" stroke-width="3"/>
    <text x="200" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#0B6F68">P · A</text>
    <text x="320" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#C8133A">Q · F</text>
    <text x="255" y="360" text-anchor="middle" font-size="16">becul rămâne <tspan font-weight="800">stins</tspan></text>
    <text x="255" y="384" text-anchor="middle" font-size="16">A și F = <tspan font-weight="800" fill="#C8133A">Fals</tspan></text>

    <!-- SAU: paralel -->
    <rect x="490" y="90" width="430" height="310" rx="18" fill="#FFFFFF" stroke="#7A3FB8" stroke-width="3"/>
    <text x="705" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#7A3FB8">P sau Q</text>
    <g stroke="#171416" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M540 248V170H660M720 170H800H860V250M860 290V330H540V264"/>
      <path d="M620 170V240H660M720 240H800V170"/>
    </g>
    <path d="M520 248H560" stroke="#171416" stroke-width="4"/>
    <path d="M530 264H550" stroke="#171416" stroke-width="8"/>
    <!-- P închis -->
    <circle cx="660" cy="170" r="6" fill="#14A39A"/><circle cx="720" cy="170" r="6" fill="#14A39A"/>
    <path d="M660 170H720" stroke="#14A39A" stroke-width="5" stroke-linecap="round"/>
    <!-- Q deschis -->
    <circle cx="660" cy="240" r="6" fill="#C8133A"/><circle cx="720" cy="240" r="6" fill="#C8133A"/>
    <path d="M660 240L712 210" stroke="#C8133A" stroke-width="5" stroke-linecap="round"/>
    <!-- bec aprins -->
    <g stroke="#FFC83D" stroke-width="3" stroke-linecap="round">
      <path d="M860 236V228M888 244L894 238M832 244L826 238M894 270H902M818 270H826"/>
    </g>
    <circle cx="860" cy="270" r="20" fill="#FFC83D" stroke="#C88A00" stroke-width="3"/>
    <text x="690" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#0B6F68">P · A</text>
    <text x="690" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#C8133A">Q · F</text>
    <text x="705" y="360" text-anchor="middle" font-size="16">becul se <tspan font-weight="800">aprinde</tspan></text>
    <text x="705" y="384" text-anchor="middle" font-size="16">A sau F = <tspan font-weight="800" fill="#0B6F68">Adevărat</tspan></text>

    <!-- NU -->
    <rect x="40" y="418" width="880" height="96" rx="18" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/>
    <text x="64" y="452" font-size="20" font-weight="800">nu P</text>
    <text x="64" y="482" font-size="15">întoarce valoarea pe dos:</text>
    <text x="64" y="502" font-size="15">nu A = F, nu F = A</text>
    <text x="420" y="452" font-size="15" font-weight="800">Reguli pentru negație:</text>
    <text x="420" y="478" font-size="15">nu (a &lt; b) = a &gt;= b</text>
    <text x="680" y="478" font-size="15">nu (a = b) = a &lt;&gt; b</text>
    <text x="420" y="502" font-size="15">nu (P sau Q) = nu P și nu Q</text>
  </g>
</svg>
