<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Media a trei note: datele de intrare, data de manevră și data de ieșire, cu cele trei întrebări care le identifică</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Media a trei note: ce fel de date folosim?</text>

    <!-- întrebări -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="40" y="72" width="260" height="58" rx="29" fill="#E2F6FA"/>
      <text x="170" y="97">De ce am nevoie</text>
      <text x="170" y="117">ca să încep?</text>
      <rect x="350" y="72" width="260" height="58" rx="29" fill="#FFF4D6"/>
      <text x="480" y="97">Ce calculez</text>
      <text x="480" y="117">„pe ciornă”?</text>
      <rect x="660" y="72" width="260" height="58" rx="29" fill="#E0F4F2"/>
      <text x="790" y="97">Ce trebuie</text>
      <text x="790" y="117">să obțin la final?</text>
    </g>

    <!-- intrare -->
    <rect x="40" y="150" width="260" height="270" rx="18" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <text x="170" y="184" text-anchor="middle" font-size="19" font-weight="800" fill="#0E7F96">Date de intrare</text>
    <g>
      <rect x="64" y="204" width="212" height="54" rx="10" fill="#E2F6FA"/>
      <text x="82" y="237" font-size="16" font-weight="700">nota1</text>
      <text x="252" y="239" text-anchor="end" font-size="24" font-weight="800">9</text>
      <rect x="64" y="268" width="212" height="54" rx="10" fill="#E2F6FA"/>
      <text x="82" y="301" font-size="16" font-weight="700">nota2</text>
      <text x="252" y="303" text-anchor="end" font-size="24" font-weight="800">8</text>
      <rect x="64" y="332" width="212" height="54" rx="10" fill="#E2F6FA"/>
      <text x="82" y="365" font-size="16" font-weight="700">nota3</text>
      <text x="252" y="367" text-anchor="end" font-size="24" font-weight="800">10</text>
    </g>

    <!-- manevră -->
    <rect x="350" y="150" width="260" height="270" rx="18" fill="#FFFFFF" stroke="#FFC83D" stroke-width="3"/>
    <text x="480" y="184" text-anchor="middle" font-size="19" font-weight="800" fill="#9A6B00">Dată de manevră</text>
    <!-- foaie de ciornă -->
    <rect x="384" y="204" width="192" height="182" rx="6" fill="#FFF4D6"/>
    <g stroke="#F2D58A" stroke-width="1.5">
      <path d="M384 244H576M384 284H576M384 324H576M384 364H576"/>
    </g>
    <text x="480" y="236" text-anchor="middle" font-size="16" font-weight="700">suma notelor</text>
    <text x="480" y="276" text-anchor="middle" font-size="18">9 + 8 + 10</text>
    <text x="480" y="320" text-anchor="middle" font-size="28" font-weight="800">= 27</text>
    <text x="480" y="358" text-anchor="middle" font-size="14" fill="#6B6460">ne ajută, dar nu e rezultatul</text>

    <!-- ieșire -->
    <rect x="660" y="150" width="260" height="270" rx="18" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
    <text x="790" y="184" text-anchor="middle" font-size="19" font-weight="800" fill="#0B6F68">Dată de ieșire</text>
    <text x="790" y="236" text-anchor="middle" font-size="16" font-weight="700">media</text>
    <text x="790" y="266" text-anchor="middle" font-size="18">27 : 3</text>
    <circle cx="790" cy="326" r="44" fill="#14A39A"/>
    <text x="790" y="340" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">9</text>

    <!-- săgeți -->
    <g stroke="#171416" stroke-width="4" fill="none">
      <path d="M304 285H342" marker-end="url(#a)"/>
      <path d="M614 285H652" marker-end="url(#a)"/>
    </g>

    <!-- roluri -->
    <rect x="40" y="440" width="880" height="72" rx="14" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <g font-size="15" text-anchor="middle">
      <text x="170" y="470" font-weight="800" fill="#0E7F96">pornesc prelucrarea</text>
      <text x="170" y="492" fill="#6B6460">fără ele nu putem începe</text>
      <text x="480" y="470" font-weight="800" fill="#9A6B00">păstrează rezultate pe drum</text>
      <text x="480" y="492" fill="#6B6460">sunt temporare</text>
      <text x="790" y="470" font-weight="800" fill="#0B6F68">răspund la cerință</text>
      <text x="790" y="492" fill="#6B6460">rezultatul problemei</text>
    </g>
  </g>
</svg>
