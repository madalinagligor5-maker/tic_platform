x="12" fill="#fff" stroke="#14A39A" stroke-width="2.5"/><text x="795" y="176" font-size="15" font-weight="800" fill="#0B6F68" text-anchor="middle">Bravo! Ești tare!</text><rect x="676" y="200" width="238" height="40" rx="12" fill="#fff" stroke="#F21F4B" stroke-width="2.5"/><text x="795" y="226" font-size="15" font-weight="800" fill="#C8133A" text-anchor="middle">Fii mai atent!</text><text x="676" y="262" font-size="14" fill="#6B6460">mesajul afișat</text><rect x="676" y="278" width="95.4517822265625" height="30" rx="6" fill="#fff" stroke="#C9C3BC" stroke-width="1.5"/><text x="684" y="298" font-size="14" font-weight="700">prod</text><rect x="726.4258575439453" y="282" width="35.02592468261719" height="22" rx="6" fill="#FF8C1A"/><text x="743.9388198852539" y="298" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">48</text><text x="676" y="326" font-size="14" fill="#6B6460">arătat când jucătorul greșește</text><rect x="676" y="340" width="112.67179870605469" height="30" rx="6" fill="#fff" stroke="#C9C3BC" stroke-width="1.5"/><text x="684" y="360" font-size="14" font-weight="700">rezultat</text><rect x="748.6717987060547" y="344" width="30" height="22" rx="6" fill="#FF8C1A"/><text x="763.6717987060547" y="360" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="676" y="388" font-size="14" fill="#6B6460">scorul</text><path d="M304 238H338" fill="none" stroke="#171416" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M619 238H653" fill="none" stroke="#171416" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="30" y="424" width="900" height="88" rx="14" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/><text x="50" y="454" font-size="15" font-weight="800">prod este și dată de ieșire:</text><text x="50" y="478" font-size="14">programul îl folosește ca să verifice răspunsul, apoi îl arată 3 secunde</text><text x="50" y="498" font-size="14">când jucătorul greșește (de exemplu 6 × 8 = 