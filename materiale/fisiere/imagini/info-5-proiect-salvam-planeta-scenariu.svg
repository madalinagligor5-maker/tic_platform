<text x="480" y="44" font-size="24" font-weight="800" text-anchor="middle">Scenariul poveștii, scenă cu scenă</text><rect x="30" y="70" width="212" height="236" rx="16" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><text x="46" y="98" font-size="17" font-weight="800" fill="#C8133A">1. Problema</text><rect x="44" y="112" width="184" height="120" rx="10" fill="#E2F6FA"/><circle cx="136" cy="172" r="34" fill="#3EC6E0" stroke="#171416" stroke-width="2.5"/><path d="M115.6 161.8q10.2 -17 23.799999999999997 -6.800000000000001q3.4000000000000004 17 -10.2 20.4z M139.4 178.8q17 -3.4000000000000004 20.4 10.2q-6.800000000000001 13.600000000000001 -20.4 10.2z" fill="#14A39A"/><path d="M86 162a52 52 0 0 1 100 0" fill="none" stroke="#FFC83D" stroke-width="6" stroke-dasharray="14 8"/><text x="46" y="258" font-size="14" font-weight="700">Stratul de ozon</text><text x="46" y="278" font-size="14" font-weight="700">se subțiază.</text><path d="M244 172H256" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="258" y="70" width="212" height="236" rx="16" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><text x="274" y="98" font-size="17" font-weight="800" fill="#C8133A">2. Problema</text><rect x="272" y="112" width="184" height="120" rx="10" fill="#E2F6FA"/><path d="M304 198h120" stroke="#0E7F96" stroke-width="4"/><path d="M324 196l14 -40h40l16 40z" fill="#fff" stroke="#0E7F96" stroke-width="3"/><path d="M394 206q6 8 12 0M314 206q6 8 12 0" stroke="#3EC6E0" stroke-width="3" fill="none"/><text x="274" y="258" font-size="14" font-weight="700">Calota glaciară</text><text x="274" y="278" font-size="14" font-weight="700">se topește.</text><path d="M472 172H484" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="486" y="70" width="212" height="236" rx="16" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><text x="502" y="98" font-size="17" font-weight="800" fill="#0B6F68">3. Soluții</text><rect x="500" y="112" width="184" height="120" rx="10" fill="#E2F6FA"/><path d="M625.8 184.3A36 36 0 0 1 585.7 207.5" fill="none" stroke="#14A39A" stroke-width="7" marker-end="url(#a)"/><path d="M564.4 195.1A36 36 0 0 1 564.4 148.9" fill="none" stroke="#14A39A" stroke-width="7" marker-end="url(#a)"/><path d="M585.7 136.5A36 36 0 0 1 625.8 159.7" fill="none" stroke="#14A39A" stroke-width="7" marker-end="url(#a)"/><text x="502" y="258" font-size="14" font-weight="700">Reciclăm, economisim</text><text x="502" y="278" font-size="14" font-weight="700">energia, protejăm natura.</text><path d="M700 172H712" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="714" y="70" width="212" height="236" rx="16" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><text x="730" y="98" font-size="17" font-weight="800" fill="#7A3FB8">4. Quiz</text><rect x="728" y="112" width="184" height="120" rx="10" fill="#E2F6FA"/><rect x="774" y="138" width="92" height="64" rx="12" fill="#fff" stroke="#7A3FB8" stroke-width="3"/><text x="820" y="184" font-size="40" font-weight="800" fill="#7A3FB8" text-anchor="middle">?</text><text x="730" y="258" font-size="14" font-weight="700">Verificați ce au</text><text x="730" y="278" font-size="14" font-weight="700">înțeles colegii.</text><text x="30" y="342" font-size="16" font-weight="800">Blocuri pe care le puteți folosi:</text><path d="M30 374C55 352 100 352 125 374H322.2065734863281Q326.2065734863281 374 326.2065734863281 378V412Q326.2065734863281 416 322.2065734863281 416H78l-8 8h-16l-8 -8H34Q30 416 30 412Z" fill="#FFBF00" stroke="#CC9900" stroke-width="1.5"/><text x="40" y="402" font-size="15" font-weight="700" fill="#fff">când tasta</text><rect x="128.15554809570312" y="384" width="80.78033447265625" height="26" rx="5" fill="#CC9900"/><text x="137.15554809570312" y="402" font-size="15" font-weight="700" fill="#fff">spațiu</text><path d="M190.93588256835938 394h10l-5 6z" fill="#fff"/><text x="214.93588256835938" y="402" font-size="15" font-weight="700" fill="#fff">este apăsată</text><path d="M344.2065734863281 378Q344.2065734863281 374 348.2065734863281 374H360.2065734863281l8 8h16l8 -8H658.5446014404297Q662.5446014404297 374 662.5446014404297 378V410Q662.5446014404297 414 658.5446014404297 414H392.2065734863281l-8 8h-16l-8 -8H348.2065734863281Q344.2065734863281 414 344.2065734863281 410Z" fill="#9966FF" stroke="#774DCB" stroke-width="1.5"/><text x="354.2065734863281" y="399" font-size="15" font-weight="700" fill="#fff">spune</text><rect x="408.71690368652344" y="381" width="67.7418212890625" height="26" rx="13" fill="#fff" stroke="#774DCB" stroke-width="1"/><text x="442.5878143310547" y="399" font-size="14" font-weight="700" fill="#575E75" text-anchor="middle">Ajutor!</text><text x="482.45872497558594" y="399" font-size="15" font-weight="700" fill="#fff">timp de</text><rect x="549.6741333007812" y="381" width="28" height="26" rx="13" fill="#fff" stroke="#774DCB" stroke-width="1"/><text x="563.6741333007812" y="399" font-size="14" font-weight="700" fill="#575E75" text-anchor="middle">2</text><text x="583.6741333007812" y="399" font-size="15" font-weight="700" fill="#fff">secunde</text><path d="M30 454Q30 450 34 450H46l8 8h16l8 -8H295.29644775390625Q299.29644775390625 450 299.29644775390625 454V486Q299.29644775390625 490 295.29644775390625 490H78l-8 8h-16l-8 -8H34Q30 490 30 486Z" fill="#9966FF" stroke="#774DCB" stroke-width="1.5"/><text x="40" y="475" font-size="15" font-weight="700" fill="#fff">schimbă decorul cu</text><rect x="200.36607360839844" y="457" width="86.93037414550781" height="26" rx="5" fill="#774DCB"/><text x="209.36607360839844" y="475" font-size="15" font-weight="700" fill="#fff">gheață</text><path d="M269.29644775390625 467h10l-5 6z" fill="#fff"/><path d="M317.29644775390625 454Q317.29644775390625 450 321.29644775390625 450H333.29644775390625l8 8h16l8 -8H543.7276153564453Q547.7276153564453 450 547.7276153564453 454V486Q547.7276153564453 490 543.7276153564453 490