    <text x="906" y="372" text-anchor="end" font-size="15" font-weight="800" fill="#C8133A">28 de pași</text>

    <rect x="30" y="400" width="900" height="166" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="54" y="432" font-size="17" font-weight="800" fill="#0B6F68">Metoda 2: calculezi direct termenul 7 · i</text>
    <g text-anchor="middle">
      <text x="98" y="474" font-size="14" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">i = 1</text><rect x="60" y="484" width="76" height="42" rx="10" fill="#14A39A"/><text x="98" y="512" font-size="18" font-weight="800" fill="#FFFFFF">7</text>
      <text x="194" y="474" font-size="14" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">i = 2</text><rect x="156" y="484" width="76" height="42" rx="10" fill="#14A39A"/><text x="194" y="512" font-size="18" font-weight="800" fill="#FFFFFF">14</text>
      <text x="290" y="474" font-size="14" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">i = 3</text><rect x="252" y="484" width="76" height="42" rx="10" fill="#14A39A"/><text x="290" y="512" font-size="18" font-weight="800" fill="#FFFFFF">21</text>
      <text x="386" y="474" font-size="14" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">i = 4</text><rect x="348" y="484" width="76" height="42" rx="10" fill="#14A39A"/><text x="386" y="512" font-size="18" font-weight="800" fill="#FFFFFF">28</text>
