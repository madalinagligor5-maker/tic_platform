      <rect x="720" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="734" y="340" fill="#6B6460" font-weight="400">23</text>
      <rect x="750" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="764" y="340" fill="#6B6460" font-weight="400">24</text>
      <rect x="780" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="794" y="340" fill="#6B6460" font-weight="400">25</text>
      <rect x="810" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="824" y="340" fill="#6B6460" font-weight="400">26</text>
      <rect x="840" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="854" y="340" fill="#6B6460" font-weight="400">27</text>
      <rect x="870" y="318" width="28" height="34" rx="5" fill="#14A39A" stroke="#0B6F68" stroke-width="2"/><text x="884" y="340" fill="#FFFFFF" font-weight="800">28</text>
