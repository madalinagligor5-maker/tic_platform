    <text x="906" y="512" text-anchor="end" font-size="15" font-weight="800" fill="#0B6F68">doar 4 pași</text>
    <text x="480" y="552" text-anchor="middle" font-size="14" fill="#6B6460">Când știi formula termenului, sari direct la valorile bune.</text>
  </g>
