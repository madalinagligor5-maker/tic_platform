    <text x="480" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#C8133A">6 este termenul de pe poziția 3</text>
    <g text-anchor="middle" font-size="26" font-weight="800">
      <rect x="223" y="98" width="90" height="62" rx="12" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="268" y="139">2</text>
      <rect x="329" y="98" width="90" height="62" rx="12" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="374" y="139">4</text>
      <rect x="435" y="98" width="90" height="62" rx="12" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><text x="480" y="139">6</text>
      <rect x="541" y="98" width="90" height="62" rx="12" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="586" y="139">8</text>
      <rect x="647" y="98" width="90" height="62" rx="12" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="692" y="139">10</text>
    </g>
    <g text-anchor="middle" font-size="14" fill="#6B6460">
      <text x="268" y="182">poziția 1</text><text x="374" y="182">poziția 2</text><text x="480" y="182">poziția 3</text><text x="586" y="182">poziția 4</text><text x="692" y="182">poziția 5</text>
    </g>
    <text x="196" y="125" text-anchor="end" font-size="16" font-weight="800" fill="#0E7F96">termen</text>
    <text x="196" y="145" text-anchor="end" font-size="13" fill="#6B6460">(element)</text>
    <path d="M200 129 H217" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <path d="M223 196 V204 H737 V196" stroke="#171416" stroke-width="2" fill="none"/>
    <text x="480" y="226" text-anchor="middle" font-size="15" font-weight="700">lungimea șirului: 5 termeni</text>

