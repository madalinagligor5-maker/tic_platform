      <rect x="270" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="284" y="340" fill="#6B6460" font-weight="400">8</text>
      <rect x="300" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="314" y="340" fill="#6B6460" font-weight="400">9</text>
      <rect x="330" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="344" y="340" fill="#6B6460" font-weight="400">10</text>
      <rect x="360" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="374" y="340" fill="#6B6460" font-weight="400">11</text>
      <rect x="390" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="404" y="340" fill="#6B6460" font-weight="400">12</text>
      <rect x="420" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="434" y="340" fill="#6B6460" font-weight="400">13</text>
      <rect x="450" y="318" width="28" height="34" rx="5" fill="#14A39A" stroke="#0B6F68" stroke-width="2"/><text x="464" y="340" fill="#FFFFFF" font-weight="800">14</text>
      <rect x="480" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="494" y="340" fill="#6B6460" font-weight="400">15</text>
      <rect x="510" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="524" y="340" fill="#6B6460" font-weight="400">16</text>
      <rect x="540" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="554" y="340" fill="#6B6460" font-weight="400">17</text>
      <rect x="570" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="584" y="340" fill="#6B6460" font-weight="400">18</text>
      <rect x="600" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="614" y="340" fill="#6B6460" font-weight="400">19</text>
      <rect x="630" y="318" width="28" height="34" rx="5" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="644" y="340" fill="#6B6460" font-weight="400">20</text>
      <rect x="660" y="318" width="28" height="34" rx="5" fill="#14A39A" stroke="#0B6F68" stroke-width="2"/><text x="674" y="340" fill="#FFFFFF" font-weight="800">21</text>
