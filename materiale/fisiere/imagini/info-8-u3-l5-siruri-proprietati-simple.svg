    <text x="54" y="282" font-size="17" font-weight="800" fill="#0B6F68">Metoda 1: parcurgi toate numerele și le alegi pe cele bune</text>
    <text x="54" y="304" font-size="14" fill="#6B6460">primii 4 multipli ai lui 7: verifici i % 7 == 0 pentru i de la 1 la 28</text>
    <g text-anchor="middle" font-size="13">
