<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Modelul RGB: din roșu, verde și albastru, fiecare de la 0 la 255, se obțin toate culorile; exemple de culori și pașii pentru Editare culori în Paint</title>
  <defs>
    <clipPath id="cR"><circle cx="180" cy="200" r="80"/></clipPath>
    <clipPath id="cG"><circle cx="270" cy="200" r="80"/></clipPath>
    <clipPath id="cRG"><circle cx="270" cy="200" r="80" clip-path="url(#cR)"/></clipPath>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Culorile RGB: Roșu, Verde, Albastru</text>

    <!-- cercuri -->
    <rect x="40" y="76" width="410" height="300" rx="20" fill="#171416"/>
    <circle cx="180" cy="200" r="80" fill="#FF0000"/>
    <circle cx="270" cy="200" r="80" fill="#00FF00"/>
    <circle cx="225" cy="276" r="80" fill="#0000FF"/>
    <circle cx="270" cy="200" r="80" fill="#FFFF00" clip-path="url(#cR)"/>
    <circle cx="225" cy="276" r="80" fill="#FF00FF" clip-path="url(#cR)"/>
    <circle cx="225" cy="276" r="80" fill="#00FFFF" clip-path="url(#cG)"/>
    <circle cx="225" cy="276" r="80" fill="#FFFFFF" clip-path="url(#cRG)"/>
    <g font-size="16" font-weight="800" fill="#FFFFFF">
      <text x="80" y="110">R</text>
      <text x="396" y="110">G</text>
      <text x="320" y="352">B</text>
    </g>
    <text x="245" y="400" text-anchor="middle" font-size="14" fill="#6B6460">Toate trei la maximum (255) dau alb.</text>

    <!-- exemple -->
    <rect x="470" y="76" width="450" height="300" rx="20" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="15" font-weight="800" fill="#6B6460">
      <text x="560" y="108">Culoarea</text>
      <text x="720" y="108" text-anchor="middle">R</text>
      <text x="790" y="108" text-anchor="middle">G</text>
      <text x="860" y="108" text-anchor="middle">B</text>
    </g>
    <path d="M490 120H900" stroke="#E8DFD3" stroke-width="2"/>
    <g font-size="15">
      <rect x="494" y="130" width="50" height="30" rx="6" fill="#FF0000"/>
      <text x="560" y="151" font-weight="700">roșu</text>
      <text x="720" y="151" text-anchor="middle">255</text><text x="790" y="151" text-anchor="middle">0</text><text x="860" y="151" text-anchor="middle">0</text>

      <rect x="494" y="170" width="50" height="30" rx="6" fill="#00FF00"/>
      <text x="560" y="191" font-weight="700">verde</text>
      <text x="720" y="191" text-anchor="middle">0</text><text x="790" y="191" text-anchor="middle">255</text><text x="860" y="191" text-anchor="middle">0</text>

      <rect x="494" y="210" width="50" height="30" rx="6" fill="#0000FF"/>
      <text x="560" y="231" font-weight="700">albastru</text>
      <text x="720" y="231" text-anchor="middle">0</text><text x="790" y="231" text-anchor="middle">0</text><text x="860" y="231" text-anchor="middle">255</text>

      <rect x="494" y="250" width="50" height="30" rx="6" fill="#FFFF00" stroke="#E8DFD3" stroke-width="2"/>
      <text x="560" y="271" font-weight="700">galben</text>
      <text x="720" y="271" text-anchor="middle">255</text><text x="790" y="271" text-anchor="middle">255</text><text x="860" y="271" text-anchor="middle">0</text>

      <rect x="494" y="290" width="50" height="30" rx="6" fill="#FFFFFF" stroke="#6B6460" stroke-width="2"/>
      <text x="560" y="311" font-weight="700">alb</text>
      <text x="720" y="311" text-anchor="middle">255</text><text x="790" y="311" text-anchor="middle">255</text><text x="860" y="311" text-anchor="middle">255</text>

      <rect x="494" y="330" width="50" height="30" rx="6" fill="#000000"/>
      <text x="560" y="351" font-weight="700">negru</text>
      <text x="720" y="351" text-anchor="middle">0</text><text x="790" y="351" text-anchor="middle">0</text><text x="860" y="351" text-anchor="middle">0</text>
    </g>

    <!-- pasi editare culori -->
    <rect x="40" y="420" width="880" height="94" rx="20" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="3"/>
    <text x="64" y="452" font-size="17" font-weight="800" fill="#7A3FB8">O culoare nouă în Paint</text>
    <g font-size="14" font-weight="700">
      <rect x="64" y="466" width="196" height="34" rx="10" fill="#FFFFFF"/><text x="162" y="488" text-anchor="middle">Pornire → Culori</text>
      <text x="270" y="488" fill="#7A3FB8">→</text>
      <rect x="290" y="466" width="150" height="34" rx="10" fill="#FFFFFF"/><text x="365" y="488" text-anchor="middle">Editare culori</text>
      <text x="450" y="488" fill="#7A3FB8">→</text>
      <rect x="470" y="466" width="150" height="34" rx="10" fill="#FFFFFF"/><text x="545" y="488" text-anchor="middle">scrii R, G, B</text>
      <text x="630" y="488" fill="#7A3FB8">→</text>
      <rect x="650" y="430" width="250" height="70" rx="10" fill="#FFFFFF"/>
      <text x="775" y="460" text-anchor="middle">Adăugare la culori</text>
      <text x="775" y="482" text-anchor="middle">particularizate</text>
    </g>
  </g>
</svg>
