<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">for în for: bucla exterioară i dă rândurile, iar bucla interioară j desenează i steluțe pe fiecare rând</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="52" text-anchor="middle" font-size="24" font-weight="800">for în for: un triunghi de steluțe</text>

    <!-- cod -->
    <rect x="40" y="90" width="370" height="250" rx="16" fill="#171416"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#FFF7EE">
      <text x="60" y="128"><tspan fill="#F29A1F" font-weight="700">for (int i = 1; i &lt;= 4; i++)</tspan></text>
      <text x="60" y="158">{</text>
      <text x="98" y="188"><tspan fill="#3EC6E0" font-weight="700">for (int j = 1; j &lt;= i; j++)</tspan></text>
      <text x="137" y="218">cout &lt;&lt; "*";</text>
      <text x="98" y="248">cout &lt;&lt; endl;</text>
      <text x="60" y="278">}</text>
    </g>
    <text x="60" y="314" font-size="13" fill="#E8DFD3">endl trece la rândul următor</text>

    <!-- grilă -->
    <g font-size="14" font-weight="800" fill="#0E7F96" text-anchor="middle">
      <text x="596" y="112">j = 1</text><text x="658" y="112">j = 2</text><text x="720" y="112">j = 3</text><text x="782" y="112">j = 4</text>
    </g>
    <g font-size="17" font-weight="800" fill="#F29A1F">
      <text x="460" y="157">i = 1</text><text x="460" y="219">i = 2</text><text x="460" y="281">i = 3</text><text x="460" y="343">i = 4</text>
    </g>
    <g fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3">
      <rect x="572" y="126" width="48" height="48" rx="10"/>
      <rect x="572" y="188" width="48" height="48" rx="10"/><rect x="634" y="188" width="48" height="48" rx="10"/>
      <rect x="572" y="250" width="48" height="48" rx="10"/><rect x="634" y="250" width="48" height="48" rx="10"/><rect x="696" y="250" width="48" height="48" rx="10"/>
      <rect x="572" y="312" width="48" height="48" rx="10"/><rect x="634" y="312" width="48" height="48" rx="10"/><rect x="696" y="312" width="48" height="48" rx="10"/><rect x="758" y="312" width="48" height="48" rx="10"/>
    </g>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="30" font-weight="800" fill="#0E7F96" text-anchor="middle">
      <text x="596" y="164">*</text>
      <text x="596" y="226">*</text><text x="658" y="226">*</text>
      <text x="596" y="288">*</text><text x="658" y="288">*</text><text x="720" y="288">*</text>
      <text x="596" y="350">*</text><text x="658" y="350">*</text><text x="720" y="350">*</text><text x="782" y="350">*</text>
    </g>
    <g font-size="14" fill="#6B6460">
      <text x="840" y="155">1 stea</text><text x="840" y="217">2 stele</text><text x="840" y="279">3 stele</text><text x="840" y="341">4 stele</text>
    </g>

    <rect x="40" y="396" width="880" height="110" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="62" y="420" width="16" height="16" rx="4" fill="#F29A1F"/>
    <text x="90" y="434" font-size="15"><tspan font-weight="800">bucla exterioară (i)</tspan>: câte un rând la fiecare pas</text>
    <rect x="62" y="452" width="16" height="16" rx="4" fill="#3EC6E0"/>
    <text x="90" y="466" font-size="15"><tspan font-weight="800">bucla interioară (j)</tspan>: se execută complet la fiecare pas al lui i</text>
    <text x="90" y="494" font-size="14" fill="#6B6460">În total se afișează 1 + 2 + 3 + 4 = 10 steluțe.</text>
  </g>
</svg>
