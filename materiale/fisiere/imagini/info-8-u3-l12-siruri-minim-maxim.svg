<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Aflarea maximului și a minimului pentru punctajele 72 85 64 91 88 91</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="800">Fiecare element se compară cu „campionul” de până acum</text>
    <text x="40" y="200" font-size="16" font-weight="800">punctaje</text>
    <path d="M240 300 H860" stroke="#171416" stroke-width="2"/>
    <rect x="252" y="156" width="56" height="144" rx="6" fill="#3EC6E0"/><text x="280" y="148" text-anchor="middle" font-size="16" font-weight="800">72</text><text x="280" y="320" text-anchor="middle" font-size="13" fill="#6B6460">conc. 1</text>
    <rect x="352" y="130" width="56" height="170" rx="6" fill="#3EC6E0"/><text x="380" y="122" text-anchor="middle" font-size="16" font-weight="800">85</text><text x="380" y="320" text-anchor="middle" font-size="13" fill="#6B6460">conc. 2</text>
    <rect x="452" y="172" width="56" height="128" rx="6" fill="#F21F4B"/><text x="480" y="164" text-anchor="middle" font-size="16" font-weight="800">64</text><text x="480" y="320" text-anchor="middle" font-size="13" fill="#6B6460">conc. 3</text>
    <rect x="552" y="118" width="56" height="182" rx="6" fill="#14A39A"/><text x="580" y="110" text-anchor="middle" font-size="16" font-weight="800">91</text><text x="580" y="320" text-anchor="middle" font-size="13" fill="#6B6460">conc. 4</text>
    <rect x="652" y="124" width="56" height="176" rx="6" fill="#3EC6E0"/><text x="680" y="116" text-anchor="middle" font-size="16" font-weight="800">88</text><text x="680" y="320" text-anchor="middle" font-size="13" fill="#6B6460">conc. 5</text>
    <rect x="752" y="118" width="56" height="182" rx="6" fill="#3EC6E0"/><text x="780" y="110" text-anchor="middle" font-size="16" font-weight="800">91</text><text x="780" y="320" text-anchor="middle" font-size="13" fill="#6B6460">conc. 6</text>
    <text x="40" y="366" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">maxim</text>
    <rect x="250" y="342" width="60" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="280" y="366" text-anchor="middle" font-size="16" font-weight="800">72</text>
    <rect x="350" y="342" width="60" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="380" y="366" text-anchor="middle" font-size="16" font-weight="800">85</text>
    <rect x="450" y="342" width="60" height="36" rx="10" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="480" y="366" text-anchor="middle" font-size="16" fill="#6B6460">85</text>
    <rect x="550" y="342" width="60" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="580" y="366" text-anchor="middle" font-size="16" font-weight="800">91</text>
    <rect x="650" y="342" width="60" height="36" rx="10" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="680" y="366" text-anchor="middle" font-size="16" fill="#6B6460">91</text>
    <rect x="750" y="342" width="60" height="36" rx="10" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="780" y="366" text-anchor="middle" font-size="16" fill="#6B6460">91</text>
    <text x="40" y="418" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">minim</text>
    <rect x="250" y="394" width="60" height="36" rx="10" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><text x="280" y="418" text-anchor="middle" font-size="16" font-weight="800">72</text>
    <rect x="350" y="394" width="60" height="36" rx="10" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="380" y="418" text-anchor="middle" font-size="16" fill="#6B6460">72</text>
    <rect x="450" y="394" width="60" height="36" rx="10" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><text x="480" y="418" text-anchor="middle" font-size="16" font-weight="800">64</text>
    <rect x="550" y="394" width="60" height="36" rx="10" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="580" y="418" text-anchor="middle" font-size="16" fill="#6B6460">64</text>
    <rect x="650" y="394" width="60" height="36" rx="10" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="680" y="418" text-anchor="middle" font-size="16" fill="#6B6460">64</text>
    <rect x="750" y="394" width="60" height="36" rx="10" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/><text x="780" y="418" text-anchor="middle" font-size="16" fill="#6B6460">64</text>
    
    <rect x="30" y="444" width="900" height="70" rx="12" fill="#F1E9DF"/>
    <text x="50" y="472" font-size="14" font-family="JetBrains Mono, Consolas, monospace">maxim = minim = x;</text>
    <text x="250" y="472" font-size="14">pornești cu primul element (72), nu cu 0</text>
    <text x="50" y="500" font-size="14" font-family="JetBrains Mono, Consolas, monospace">if (x &gt; maxim)</text>
    <text x="250" y="500" font-size="14">campion nou · al doilea 91 nu e mai mare: pozMax rămâne 4 · 91 − 64 = 27</text>
  </g>
</svg>
