<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Tipuri de dispozitive de stocare: HDD magnetic, SSD, stick și carduri pe semiconductori, discuri optice citite cu laser</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Dispozitive de stocare permanentă</text>

    <g fill="#fff" stroke-width="3">
      <rect x="30" y="70" width="172" height="370" rx="16" stroke="#F21F4B"/>
      <rect x="212" y="70" width="172" height="370" rx="16" stroke="#3EC6E0"/>
      <rect x="394" y="70" width="172" height="370" rx="16" stroke="#3EC6E0"/>
      <rect x="576" y="70" width="172" height="370" rx="16" stroke="#3EC6E0"/>
      <rect x="758" y="70" width="172" height="370" rx="16" stroke="#7A3FB8"/>
    </g>

    <!-- HDD -->
    <rect x="62" y="90" width="108" height="100" rx="10" fill="#6B6460"/>
    <circle cx="108" cy="140" r="36" fill="#E8DFD3"/>
    <circle cx="108" cy="140" r="22" fill="none" stroke="#C9C1BA" stroke-width="2"/>
    <circle cx="108" cy="140" r="7" fill="#6B6460"/>
    <path d="M158 104L120 146" stroke="#FFC83D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="158" cy="104" r="7" fill="#FFC83D"/>
    <path d="M84 110a40 40 0 0 1 22-10" stroke="#F21F4B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- SSD -->
    <rect x="240" y="104" width="116" height="74" rx="8" fill="#171416"/>
    <rect x="254" y="118" width="26" height="22" rx="3" fill="#3EC6E0"/><rect x="286" y="118" width="26" height="22" rx="3" fill="#3EC6E0"/><rect x="318" y="118" width="26" height="22" rx="3" fill="#3EC6E0"/>
    <rect x="254" y="146" width="56" height="18" rx="3" fill="#E2F6FA"/>
    <text x="330" y="162" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">SSD</text>
    <!-- stick -->
    <rect x="450" y="104" width="44" height="76" rx="10" fill="#0E7F96"/>
    <rect x="458" y="80" width="28" height="26" rx="3" fill="#fff" stroke="#6B6460" stroke-width="3"/>
    <rect x="464" y="86" width="6" height="6" fill="#6B6460"/><rect x="474" y="86" width="6" height="6" fill="#6B6460"/>
    <circle cx="472" cy="160" r="6" fill="#E2F6FA"/>
    <!-- carduri -->
    <path d="M610 96h44l14 14v74h-58z" fill="#3EC6E0" stroke="#0E7F96" stroke-width="3" stroke-linejoin="round"/>
    <path d="M620 98v18M630 98v18M640 98v18M650 98v18" stroke="#fff" stroke-width="4"/>
    <text x="638" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">SD</text>
    <path d="M686 124h26l6 6v42h-32z" fill="#FFC83D" stroke="#C8933A" stroke-width="2" stroke-linejoin="round"/>
    <!-- disc optic -->
    <circle cx="844" cy="138" r="46" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="3"/>
    <circle cx="844" cy="138" r="30" fill="none" stroke="#B08AD9" stroke-width="2"/>
    <circle cx="844" cy="138" r="10" fill="#FFF7EE" stroke="#7A3FB8" stroke-width="3"/>
    <path d="M800 196L830 160" stroke="#F21F4B" stroke-width="4" stroke-linecap="round"/>
    <rect x="788" y="192" width="22" height="10" rx="3" fill="#F21F4B"/>

    <g text-anchor="middle" font-size="18" font-weight="800">
      <text x="116" y="236">HDD</text>
      <text x="298" y="236">SSD</text>
      <text x="480" y="236">Stickul</text>
      <text x="662" y="236">Cardurile</text>
      <text x="844" y="236">Discurile</text>
    </g>
    <g text-anchor="middle" font-size="14" fill="#6B6460">
      <text x="116" y="256">„discul dur”</text>
      <text x="298" y="256">Solid-State Drive</text>
      <text x="480" y="256">de memorie</text>
      <text x="662" y="256">de memorie</text>
      <text x="844" y="256">optice</text>
    </g>
    <g text-anchor="middle" font-size="14" font-weight="800">
      <rect x="50" y="270" width="132" height="28" rx="14" fill="#FDE7EC"/><text x="116" y="289" fill="#C8133A">magnetic</text>
      <rect x="222" y="270" width="152" height="28" rx="14" fill="#E2F6FA"/><text x="298" y="289" fill="#0E7F96">semiconductori</text>
      <rect x="404" y="270" width="152" height="28" rx="14" fill="#E2F6FA"/><text x="480" y="289" fill="#0E7F96">semiconductori</text>
      <rect x="586" y="270" width="152" height="28" rx="14" fill="#E2F6FA"/><text x="662" y="289" fill="#0E7F96">semiconductori</text>
      <rect x="778" y="270" width="132" height="28" rx="14" fill="#F0E8FA"/><text x="844" y="289" fill="#7A3FB8">optic (laser)</text>
    </g>
    <g text-anchor="middle" font-size="14" font-weight="700">
      <text x="116" y="330">discuri care</text><text x="116" y="350">se rotesc repede</text><text x="116" y="378">intern</text><text x="116" y="398">sau extern</text>
      <text x="298" y="330">fără piese</text><text x="298" y="350">în mișcare</text><text x="298" y="378">mai rapid și</text><text x="298" y="398">mai rezistent</text>
      <text x="480" y="330">se conectează</text><text x="480" y="350">la portul USB</text><text x="480" y="378">pentru copii</text><text x="480" y="398">de siguranță</text>
      <text x="662" y="330">SD, mini SD,</text><text x="662" y="350">micro SD</text><text x="662" y="378">în telefoane și</text><text x="662" y="398">aparate foto</text>
      <text x="844" y="330">CD, DVD,</text><text x="844" y="350">Blu-ray</text><text x="844" y="378">scrise și citite</text><text x="844" y="398">cu o rază laser</text>
    </g>

    <rect x="30" y="456" width="900" height="56" rx="16" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="480" y="490" text-anchor="middle" font-size="16" font-weight="800">Diferă prin capacitate, timp de acces și viteză de transfer.</text>
  </g>
</svg>
