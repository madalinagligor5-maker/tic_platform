</g><text x="555" y="274" font-size="15" font-weight="700" text-anchor="middle">costumul 3</text><text x="330" y="330" font-size="15" font-weight="700" fill="#774DCB" text-anchor="middle">Fila Costume: ipostazele aceluiași personaj</text><rect x="680" y="80" width="250" height="210" rx="14" fill="#fff" stroke="#9966FF" stroke-width="3"/><text x="696" y="110" font-size="16" font-weight="800" fill="#774DCB">Animația</text><text x="696" y="134" font-size="14">Costumele se schimbă</text><text x="696" y="158" font-size="14">repede, unul după altul.</text><text x="696" y="182" font-size="14">Ochiul vede o mișcare:</text><text x="696" y="206" font-size="14">RoboTIC merge!</text><path d="M700 224Q700 220 704 220H716l8 8h16l8 -8H860.4409790039062Q864.4409790039062 220 864.4409790039062 224V256Q864.4409790039062 260 860.4409790039062 260H748l-8 8h-16l-8 -8H704Q700 260 700 256Z" fill="#9966FF" stroke="#774DCB" stroke-width="1.5"/><text x="710" y="245" font-size="15" font-weight="700" fill="#fff">costumul următor</text><text x="40" y="380" font-size="17" font-weight="800">Un personaj nou îl poți:</text><rect x="40" y="398" width="210" height="76" rx="14" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="145" y="430" font-size="16" font-weight="800" fill="#0E7F96" text-anchor="middle">încărca</text><text x="145" y="454" font-size="14" text-anchor="middle">de pe calculator</text><rect x="265" y="398" width="210" height="76" rx="14" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="370" y="430" font-size="16" font-weight="800" fill="#0E7F96" text-anchor="middle">alege Surpriză</text><text x="370" y="454" font-size="14" text-anchor="middle">la întâmplare</text><rect x="490" y="398" width="210" height="76" rx="14" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="595" y="430" font-size="16" font-weight="800" fill="#0E7F96" text-anchor="middle">desena</text><text x="595" y="454" font-size="14" text-anchor="middle">în editorul Scratch</text><rect x="715" y="398" width="210" height="76" rx="14" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="820" y="430" font-size="16" font-weight="800" fill="#0E7F96" text-anchor="middle">alege</text><text x="820" y="454" font-size="14" text-anchor="middle">din bibliotecă</text><text x="480" y="510" font-size="14" fill="#6B6460" text-anchor="middle">Decorurile se gestionează la fel ca personajele.</text>
