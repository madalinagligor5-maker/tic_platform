<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Descărcarea (download) aduce un fișier de pe internet pe calculatorul tău; încărcarea (upload) trimite un fișier de pe calculatorul tău către alt calculator</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14A39A"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A3FB8"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Descărcare și încărcare</text>

    <!-- calculatorul tau -->
    <rect x="60" y="150" width="220" height="160" rx="14" fill="#FFFFFF" stroke="#171416" stroke-width="4"/>
    <rect x="76" y="166" width="188" height="128" rx="6" fill="#E2F6FA"/>
    <path d="M170 310v30M120 346h100" stroke="#171416" stroke-width="5" stroke-linecap="round"/>
    <text x="170" y="384" text-anchor="middle" font-size="18" font-weight="800">Calculatorul tău</text>
    <!-- folder pe ecran -->
    <path d="M136 206h24l8 8h36v46h-68z" fill="#FFC83D"/>
    <text x="170" y="282" text-anchor="middle" font-size="14" font-weight="700">Descărcări</text>

    <!-- internet / alt calculator -->
    <path d="M700 230a50 50 0 0 1 96-18a40 40 0 0 1 64 34a34 34 0 0 1-6 66h-150a42 42 0 0 1-4-82z" fill="#E2F6FA" stroke="#0E7F96" stroke-width="4" stroke-linejoin="round"/>
    <rect x="740" y="236" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#0E7F96" stroke-width="3"/>
    <path d="M760 254h40M760 266h30M760 278h36" stroke="#0E7F96" stroke-width="3" stroke-linecap="round"/>
    <text x="780" y="356" text-anchor="middle" font-size="18" font-weight="800">Internet</text>
    <text x="780" y="380" text-anchor="middle" font-size="15">alt calculator, la distanță</text>

    <!-- download -->
    <path d="M680 200C580 150 420 150 310 200" fill="none" stroke="#14A39A" stroke-width="8" stroke-linecap="round" marker-end="url(#g)"/>
    <rect x="390" y="104" width="200" height="40" rx="20" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="490" y="130" text-anchor="middle" font-size="17" font-weight="800" fill="#0B6F68">Descărcare</text>
    <text x="490" y="88" text-anchor="middle" font-size="15" fill="#0B6F68" font-weight="700">download</text>

    <!-- upload -->
    <path d="M310 300C420 350 580 350 680 300" fill="none" stroke="#7A3FB8" stroke-width="8" stroke-linecap="round" marker-end="url(#v)"/>
    <rect x="390" y="352" width="200" height="40" rx="20" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="3"/>
    <text x="490" y="378" text-anchor="middle" font-size="17" font-weight="800" fill="#7A3FB8">Încărcare</text>
    <text x="490" y="414" text-anchor="middle" font-size="15" fill="#7A3FB8" font-weight="700">upload</text>

    <!-- explicatii -->
    <rect x="40" y="436" width="430" height="78" rx="16" fill="#E0F4F2"/>
    <text x="60" y="466" font-size="15" font-weight="800" fill="#0B6F68">Descărcare</text>
    <text x="60" y="490" font-size="14">salvezi pe calculatorul tău un fișier de pe internet</text>
    <rect x="490" y="436" width="430" height="78" rx="16" fill="#F0E8FA"/>
    <text x="510" y="466" font-size="15" font-weight="800" fill="#7A3FB8">Încărcare</text>
    <text x="510" y="490" font-size="14">trimiți un fișier de-al tău către alt calculator</text>
  </g>
</svg>
