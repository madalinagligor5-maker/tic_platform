<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Numele unui fișier: numele propriu-zis, punctul și extensia; caracterele interzise și exemple de nume corecte și greșite</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Din ce este format numele unui fișier</text>

    <rect x="170" y="72" width="350" height="84" rx="16" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <text x="345" y="128" text-anchor="middle" font-size="40" font-weight="800">tema_mea</text>
    <circle cx="552" cy="134" r="10" fill="#F21F4B"/>
    <rect x="584" y="72" width="206" height="84" rx="16" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/>
    <text x="687" y="128" text-anchor="middle" font-size="40" font-weight="800">txt</text>

    <path d="M180 170v10h330v-10M345 180v10" stroke="#0E7F96" stroke-width="3" fill="none"/>
    <text x="345" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#0E7F96">numele propriu-zis</text>
    <text x="345" y="236" text-anchor="middle" font-size="14" fill="#6B6460">cel mult 255 de caractere</text>
    <path d="M552 150v40" stroke="#F21F4B" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="552" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#C8133A">punct</text>
    <path d="M594 170v10h186v-10M687 180v10" stroke="#C8933A" stroke-width="3" fill="none"/>
    <text x="707" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#8A6510">extensia</text>
    <text x="707" y="236" text-anchor="middle" font-size="14" fill="#6B6460">arată tipul: .txt = text</text>

    <rect x="30" y="262" width="900" height="110" rx="16" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <text x="54" y="296" font-size="17" font-weight="800" fill="#C8133A">Numele nu poate conține caracterele:</text>
    <g font-size="26" font-weight="800" text-anchor="middle">
      <rect x="54" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="78" y="344">\</text>
      <rect x="112" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="136" y="344">/</text>
      <rect x="170" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="194" y="344">:</text>
      <rect x="228" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="252" y="346">*</text>
      <rect x="286" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="310" y="344">?</text>
      <rect x="344" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="368" y="348">&quot;</text>
      <rect x="402" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="426" y="344">&lt;</text>
      <rect x="460" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="484" y="344">&gt;</text>
      <rect x="518" y="310" width="48" height="48" rx="10" fill="#FDE7EC"/><text x="542" y="344">|</text>
    </g>
    <text x="600" y="330" font-size="15" font-weight="700">La fel și numele</text>
    <text x="600" y="352" font-size="15" font-weight="700">unui folder.</text>

    <rect x="30" y="392" width="440" height="118" rx="16" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <circle cx="70" cy="432" r="18" fill="#14A39A"/>
    <path d="M61 432l6 7l12-13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="440" font-size="18" font-weight="800" fill="#0B6F68">CORECT</text>
    <text x="54" y="478" font-size="19" font-weight="800">Tema_TIC_hardware.txt</text>
    <text x="54" y="500" font-size="14" fill="#6B6460">nume sugestiv, fără caractere interzise</text>

    <rect x="490" y="392" width="440" height="118" rx="16" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <circle cx="530" cy="432" r="18" fill="#F21F4B"/>
    <path d="M523 425l14 14M537 425l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="560" y="440" font-size="18" font-weight="800" fill="#C8133A">GREȘIT</text>
    <text x="514" y="478" font-size="19" font-weight="800">tema?.txt</text>
    <text x="514" y="500" font-size="14" fill="#6B6460">conține semnul „?”, care este interzis</text>
  </g>
</svg>
