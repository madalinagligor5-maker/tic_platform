<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Harta unității Internet: servicii, navigare pe web, căutare, siguranță și drepturi de autor</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Unitatea 3 pe o singură pagină</text>

    <!-- legaturi -->
    <g stroke="#6B6460" stroke-width="4" stroke-linecap="round">
      <path d="M410 300H290M550 300H670M480 230V192M480 370V410"/>
    </g>

    <!-- centru -->
    <circle cx="480" cy="300" r="70" fill="#E2F6FA" stroke="#0E7F96" stroke-width="4"/>
    <ellipse cx="480" cy="300" rx="28" ry="70" fill="none" stroke="#3EC6E0" stroke-width="2"/>
    <rect x="416" y="278" width="128" height="46" rx="12" fill="#FFFFFF"/>
    <text x="480" y="300" text-anchor="middle" font-size="18" font-weight="800" fill="#0E7F96">Internetul</text>
    <text x="480" y="318" text-anchor="middle" font-size="14">rețea de rețele</text>

    <!-- servicii (stanga) -->
    <rect x="40" y="72" width="250" height="322" rx="20" fill="#FFFFFF" stroke="#F21F4B" stroke-width="3"/>
    <text x="62" y="108" font-size="18" font-weight="800" fill="#C8133A">Servicii</text>
    <g font-size="15">
      <text x="62" y="146" font-weight="800">E-mail</text>
      <text x="62" y="166">mesaje electronice</text>
      <text x="62" y="200" font-weight="800">WWW</text>
      <text x="62" y="220">documente legate</text>
      <text x="62" y="254" font-weight="800">FTP</text>
      <text x="62" y="274">transfer de fișiere</text>
      <text x="62" y="308" font-weight="800">Telnet</text>
      <text x="62" y="328">calculator la distanță</text>
      <text x="62" y="362" font-weight="800">IRC</text>
      <text x="62" y="382">mesaje în timp real</text>
    </g>

    <!-- navigare (dreapta) -->
    <rect x="670" y="72" width="250" height="322" rx="20" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <text x="692" y="108" font-size="18" font-weight="800" fill="#0E7F96">Navigare pe web</text>
    <g font-size="15">
      <text x="692" y="146" font-weight="800">browser</text>
      <text x="692" y="166">deschide paginile</text>
      <text x="692" y="200" font-weight="800">URL</text>
      <text x="692" y="220">adresa unei pagini</text>
      <text x="692" y="254" font-weight="800">hiperlink</text>
      <text x="692" y="274">legătură spre alt document</text>
      <text x="692" y="308" font-weight="800">site web</text>
      <text x="692" y="328">colecție de pagini</text>
      <text x="692" y="362" font-weight="800">https://</text>
      <text x="692" y="382">legătură criptată, lăcățel</text>
    </g>

    <!-- cautare (sus) -->
    <rect x="310" y="72" width="340" height="120" rx="20" fill="#FFFFFF" stroke="#FFC83D" stroke-width="3"/>
    <text x="330" y="104" font-size="18" font-weight="800">Căutare</text>
    <text x="330" y="130" font-size="15">motor de căutare + cuvinte-cheie</text>
    <text x="330" y="154" font-size="15"><tspan font-weight="800">-</tspan> elimină · <tspan font-weight="800">„ ”</tspan> exact · <tspan font-weight="800">*</tspan> orice</text>
    <text x="330" y="178" font-size="15">descărcare ↓ · încărcare ↑</text>

    <!-- siguranta + drepturi (jos) -->
    <rect x="40" y="410" width="880" height="104" rx="20" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
    <text x="64" y="442" font-size="18" font-weight="800" fill="#0B6F68">Siguranță</text>
    <text x="64" y="468" font-size="15">antivirus · parole secrete și complexe</text>
    <text x="64" y="492" font-size="15">fără date personale · ceri ajutorul unui adult</text>
    <path d="M480 426V498" stroke="#E8DFD3" stroke-width="3"/>
    <text x="504" y="442" font-size="18" font-weight="800" fill="#7A3FB8">Drepturi de autor</text>
    <text x="504" y="468" font-size="15">fără acordul autorului = ilegal · fără plagiat</text>
    <text x="504" y="492" font-size="15">licențe: ©, CC, domeniul public · Bibliografie</text>
  </g>
</svg>
