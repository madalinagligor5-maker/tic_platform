<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Bitul poate fi 0 sau 1; 8 biți formează un byte, cât ocupă o literă; 1 KB are 1024 de bytes, nu 1000</title>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- bitul -->
    <rect x="30" y="30" width="290" height="270" rx="18" fill="#fff" stroke="#3EC6E0" stroke-width="3"/>
    <text x="175" y="70" text-anchor="middle" font-size="22" font-weight="800" fill="#0E7F96">Bitul (b)</text>
    <text x="175" y="94" text-anchor="middle" font-size="14" fill="#6B6460">cea mai mică unitate de informație</text>
    <circle cx="105" cy="160" r="34" fill="#E8DFD3"/>
    <path d="M93 194h24v14h-24z" fill="#6B6460"/>
    <circle cx="245" cy="160" r="34" fill="#FFC83D"/>
    <path d="M233 194h24v14h-24z" fill="#6B6460"/>
    <path d="M245 112v-10M285 124l8-7M205 124l-8-7M297 160h10M193 160h-10" stroke="#FFC83D" stroke-width="4" stroke-linecap="round"/>
    <rect x="75" y="226" width="60" height="52" rx="10" fill="#171416"/>
    <text x="105" y="263" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">0</text>
    <text x="175" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#6B6460">sau</text>
    <rect x="215" y="226" width="60" height="52" rx="10" fill="#171416"/>
    <text x="245" y="263" text-anchor="middle" font-size="30" font-weight="800" fill="#FFC83D">1</text>

    <!-- byte -->
    <rect x="340" y="30" width="590" height="270" rx="18" fill="#fff" stroke="#14A39A" stroke-width="3"/>
    <text x="635" y="70" text-anchor="middle" font-size="22" font-weight="800" fill="#0B6F68">8 biți = 1 byte (B) = 1 octet</text>
    <g font-size="26" font-weight="800" text-anchor="middle">
      <rect x="372" y="98" width="48" height="56" rx="8" fill="#E0F4F2"/><text x="396" y="136">0</text>
      <rect x="426" y="98" width="48" height="56" rx="8" fill="#14A39A"/><text x="450" y="136" fill="#fff">1</text>
      <rect x="480" y="98" width="48" height="56" rx="8" fill="#E0F4F2"/><text x="504" y="136">0</text>
      <rect x="534" y="98" width="48" height="56" rx="8" fill="#E0F4F2"/><text x="558" y="136">0</text>
      <rect x="588" y="98" width="48" height="56" rx="8" fill="#E0F4F2"/><text x="612" y="136">0</text>
      <rect x="642" y="98" width="48" height="56" rx="8" fill="#E0F4F2"/><text x="666" y="136">0</text>
      <rect x="696" y="98" width="48" height="56" rx="8" fill="#E0F4F2"/><text x="720" y="136">0</text>
      <rect x="750" y="98" width="48" height="56" rx="8" fill="#14A39A"/><text x="774" y="136" fill="#fff">1</text>
    </g>
    <path d="M374 170v12h422v-12M585 182v14" stroke="#0B6F68" stroke-width="3" fill="none"/>
    <text x="585" y="218" text-anchor="middle" font-size="16" font-weight="800">1 byte</text>
    <path d="M810 126H842" stroke="#171416" stroke-width="3" marker-end="url(#s)"/>
    <rect x="852" y="94" width="62" height="64" rx="10" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/>
    <text x="883" y="140" text-anchor="middle" font-size="36" font-weight="800">A</text>
    <text x="635" y="256" text-anchor="middle" font-size="15" font-weight="700">O literă ocupă 1 byte. De exemplu, litera A</text>
    <text x="635" y="278" text-anchor="middle" font-size="15" font-weight="700">se memorează ca 01000001.</text>

    <!-- 1000 vs 1024 -->
    <rect x="30" y="320" width="900" height="190" rx="18" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/>
    <circle cx="80" cy="366" r="20" fill="#FFC83D"/>
    <text x="80" y="374" text-anchor="middle" font-size="24" font-weight="800">!</text>
    <text x="112" y="374" font-size="20" font-weight="800">Atenție la multiplii byte-ului</text>
    <rect x="60" y="400" width="380" height="84" rx="14" fill="#fff"/>
    <text x="250" y="436" text-anchor="middle" font-size="24" font-weight="800">1 km = 1000 m</text>
    <text x="250" y="464" text-anchor="middle" font-size="14" fill="#6B6460">în viața de zi cu zi: ori 1000</text>
    <rect x="520" y="400" width="380" height="84" rx="14" fill="#fff" stroke="#14A39A" stroke-width="3"/>
    <text x="710" y="436" text-anchor="middle" font-size="24" font-weight="800" fill="#0B6F68">1 KB = 1024 B</text>
    <text x="710" y="464" text-anchor="middle" font-size="14" fill="#6B6460">în calculator: ori 1024 (2 la puterea a 10-a)</text>
    <text x="480" y="452" text-anchor="middle" font-size="30" font-weight="800" fill="#C8133A">≠</text>
  </g>
</svg>
