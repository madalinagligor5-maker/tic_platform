<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Trei pași pentru lucrul cu stickul de memorie: îl introduci, copiezi fișierele și îl scoți în siguranță</title>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <g id="stick"><rect x="0" y="22" width="34" height="58" rx="8" fill="#0E7F96"/><rect x="6" y="0" width="22" height="24" rx="3" fill="#fff" stroke="#6B6460" stroke-width="3"/><rect x="11" y="6" width="4" height="5" fill="#6B6460"/><rect x="19" y="6" width="4" height="5" fill="#6B6460"/></g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <g fill="#fff" stroke-width="3">
      <rect x="30" y="30" width="280" height="370" rx="18" stroke="#3EC6E0"/>
      <rect x="340" y="30" width="280" height="370" rx="18" stroke="#14A39A"/>
      <rect x="650" y="30" width="280" height="370" rx="18" stroke="#7A3FB8"/>
    </g>
    <g font-size="17" font-weight="800" text-anchor="middle" fill="#fff">
      <circle cx="170" cy="66" r="20" fill="#0E7F96"/><text x="170" y="72">1</text>
      <circle cx="480" cy="66" r="20" fill="#0B6F68"/><text x="480" y="72">2</text>
      <circle cx="790" cy="66" r="20" fill="#7A3FB8"/><text x="790" y="72">3</text>
    </g>

    <!-- pas 1 -->
    <rect x="60" y="130" width="150" height="100" rx="8" fill="#E2F6FA" stroke="#171416" stroke-width="3"/>
    <path d="M48 238h174l-8 12H56z" fill="#171416"/>
    <g transform="translate(270 178) rotate(90)"><use href="#stick"/></g>
    <rect x="80" y="150" width="80" height="34" rx="6" fill="#fff" stroke="#0E7F96" stroke-width="2"/>
    <text x="120" y="173" text-anchor="middle" font-size="15" font-weight="800" fill="#0E7F96">E:</text>
    <text x="170" y="292" text-anchor="middle" font-size="16" font-weight="800">Introduci stickul</text>
    <text x="170" y="314" text-anchor="middle" font-size="16" font-weight="800">în portul USB.</text>
    <text x="170" y="346" text-anchor="middle" font-size="14" fill="#6B6460">În File Explorer apare</text>
    <text x="170" y="366" text-anchor="middle" font-size="14" fill="#6B6460">o unitate nouă, de ex. E:</text>

    <!-- pas 2 -->
    <path d="M378 120h34l12 12v46h-46z" fill="#fff" stroke="#171416" stroke-width="3" stroke-linejoin="round"/>
    <path d="M386 144h28M386 156h22M386 168h28" stroke="#C9C1BA" stroke-width="3" stroke-linecap="round"/>
    <path d="M436 150H520" stroke="#171416" stroke-width="3" marker-end="url(#s)"/>
    <g transform="translate(540 112)"><use href="#stick"/></g>
    <g font-size="15" font-weight="800" text-anchor="middle">
      <rect x="370" y="208" width="96" height="36" rx="8" fill="#fff" stroke="#171416" stroke-width="3"/><text x="418" y="232">Ctrl + C</text>
      <text x="480" y="232" fill="#6B6460">→</text>
      <rect x="494" y="208" width="96" height="36" rx="8" fill="#fff" stroke="#171416" stroke-width="3"/><text x="542" y="232">Ctrl + V</text>
    </g>
    <text x="480" y="292" text-anchor="middle" font-size="16" font-weight="800">Copiezi fișierele</text>
    <text x="480" y="314" text-anchor="middle" font-size="16" font-weight="800">pe stick (în E:).</text>
    <text x="480" y="346" text-anchor="middle" font-size="14" fill="#6B6460">Tras pe altă unitate de disc,</text>
    <text x="480" y="366" text-anchor="middle" font-size="14" fill="#6B6460">fișierul se copiază, nu se mută.</text>

    <!-- pas 3 -->
    <rect x="680" y="120" width="220" height="40" rx="6" fill="#171416"/>
    <rect x="808" y="126" width="30" height="28" rx="5" fill="#FFC83D"/>
    <rect x="818" y="130" width="10" height="12" rx="2" fill="#171416"/>
    <path d="M814 146h18" stroke="#171416" stroke-width="3"/>
    <text x="886" y="146" text-anchor="end" font-size="14" font-weight="700" fill="#fff">10:45</text>
    <path d="M823 166v20" stroke="#7A3FB8" stroke-width="3" stroke-dasharray="4 4"/>
    <rect x="716" y="190" width="148" height="56" rx="8" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="2"/>
    <text x="790" y="213" text-anchor="middle" font-size="14" font-weight="700">Eliminare în</text>
    <text x="790" y="233" text-anchor="middle" font-size="14" font-weight="700">siguranță</text>
    <text x="790" y="292" text-anchor="middle" font-size="16" font-weight="800">Abia apoi scoți</text>
    <text x="790" y="314" text-anchor="middle" font-size="16" font-weight="800">stickul.</text>
    <text x="790" y="346" text-anchor="middle" font-size="14" fill="#6B6460">Așa nu se strică fișierele</text>
    <text x="790" y="366" text-anchor="middle" font-size="14" fill="#6B6460">care încă se scriu.</text>

    <!-- avertisment -->
    <rect x="30" y="420" width="900" height="90" rx="18" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <circle cx="80" cy="465" r="22" fill="#F21F4B"/>
    <text x="80" y="474" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">!</text>
    <text x="120" y="458" font-size="17" font-weight="800" fill="#C8133A">Un fișier șters de pe stick NU ajunge în Coșul de reciclare:</text>
    <text x="120" y="484" font-size="16" font-weight="700">este șters definitiv. Verifică de două ori înainte să apeși Delete!</text>
  </g>
</svg>
