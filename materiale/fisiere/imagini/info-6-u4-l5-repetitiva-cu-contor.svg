<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Schema structurii „pentru” la suma lui Gauss și construirea sumei 1 + 2 + 3 + 4 = 10, pas cu pas</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="40" y="54" font-size="20" font-weight="800">pentru i ← 1, n execută S ← S + i</text>

    <!-- schema -->
    <rect x="120" y="80" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <text x="210" y="108" text-anchor="middle" font-size="16" font-weight="700">S ← 0,  i ← 1</text>
    <path d="M210 124V146" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <path d="M210 154L300 200L210 246L120 200Z" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3" stroke-linejoin="round"/>
    <text x="210" y="206" text-anchor="middle" font-size="17" font-weight="800">i ≤ n ?</text>
    <path d="M210 246V272" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <text x="222" y="266" font-size="14" font-weight="800" fill="#0B6F68">Adevărat</text>
    <rect x="130" y="280" width="160" height="44" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="210" y="308" text-anchor="middle" font-size="16" font-weight="700">S ← S + i</text>
    <path d="M210 324V342" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <rect x="130" y="350" width="160" height="44" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <text x="210" y="378" text-anchor="middle" font-size="16" font-weight="700">i ← i + 1</text>
    <path d="M210 394V420H60V200H112" fill="none" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <path d="M300 200H400V442" fill="none" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <text x="318" y="190" font-size="14" font-weight="800" fill="#C8133A">Fals</text>
    <rect x="330" y="450" width="140" height="44" rx="22" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <text x="400" y="477" text-anchor="middle" font-size="16" font-weight="800">scrie S</text>
    <text x="60" y="456" font-size="13" fill="#6B6460">contorul i crește cu pasul 1;</text>
    <text x="60" y="474" font-size="13" fill="#6B6460">secvența se repetă de n ori,</text>
    <text x="60" y="492" font-size="13" fill="#6B6460">pentru i = 1, 2, …, n</text>

    <!-- suma lui Gauss -->
    <path d="M500 76V510" stroke="#E8DFD3" stroke-width="3"/>
    <text x="710" y="100" text-anchor="middle" font-size="22" font-weight="800">n = 4:  1 + 2 + 3 + 4 = 10</text>
    <text x="710" y="126" text-anchor="middle" font-size="14" fill="#6B6460">la fiecare pas adunăm valoarea contorului i</text>
    <g stroke="#FFFFFF" stroke-width="3">
      <rect x="560" y="344" width="40" height="36" rx="6" fill="#F21F4B"/>
      <rect x="640" y="344" width="40" height="36" rx="6" fill="#F21F4B"/>
      <rect x="640" y="308" width="40" height="36" rx="6" fill="#F29A1F"/>
      <rect x="720" y="344" width="40" height="36" rx="6" fill="#F21F4B"/>
      <rect x="720" y="308" width="40" height="36" rx="6" fill="#F29A1F"/>
      <rect x="720" y="272" width="40" height="36" rx="6" fill="#3EC6E0"/>
      <rect x="800" y="344" width="40" height="36" rx="6" fill="#F21F4B"/>
      <rect x="800" y="308" width="40" height="36" rx="6" fill="#F29A1F"/>
      <rect x="800" y="272" width="40" height="36" rx="6" fill="#3EC6E0"/>
      <rect x="800" y="236" width="40" height="36" rx="6" fill="#14A39A"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="580" y="332" font-weight="800">S = 1</text>
      <text x="660" y="296" font-weight="800">S = 3</text>
      <text x="740" y="260" font-weight="800">S = 6</text>
      <text x="820" y="224" font-weight="800" fill="#C8133A">S = 10</text>
      <text x="580" y="404">i = 1</text>
      <text x="660" y="404">i = 2</text>
      <text x="740" y="404">i = 3</text>
      <text x="820" y="404">i = 4</text>
      <text x="580" y="424" font-size="13" fill="#6B6460">+1</text>
      <text x="660" y="424" font-size="13" fill="#6B6460">+2</text>
      <text x="740" y="424" font-size="13" fill="#6B6460">+3</text>
      <text x="820" y="424" font-size="13" fill="#6B6460">+4</text>
    </g>
    <path d="M540 380H860" stroke="#171416" stroke-width="3"/>
    <rect x="530" y="446" width="360" height="56" rx="14" fill="#FFF0DB"/>
    <text x="546" y="469" font-size="14"><tspan font-weight="800">În Scratch:</tspan> repetă (n)</text>
    <text x="546" y="490" font-size="14">modifică S cu i, modifică i cu 1</text>
  </g>
</svg>
