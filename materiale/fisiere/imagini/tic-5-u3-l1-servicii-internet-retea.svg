<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">O rețea de calculatoare din laboratorul școlii: calculatoarele interconectate folosesc împreună imprimanta, fișierele și legătura la internet</title>
  <defs>
    <g id="pc">
      <rect x="0" y="0" width="70" height="50" rx="6" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
      <rect x="8" y="8" width="54" height="34" rx="3" fill="#E2F6FA"/>
      <path d="M35 50v12M20 64h30" stroke="#171416" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">O rețea de calculatoare în laboratorul școlii</text>

    <!-- zona retelei -->
    <rect x="40" y="76" width="560" height="420" rx="20" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>

    <!-- cabluri -->
    <g stroke="#14A39A" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M135 186V290H290"/>
      <path d="M135 394V310H290"/>
      <path d="M505 186V290H350"/>
      <path d="M505 394V310H350"/>
      <path d="M320 270V180"/>
      <path d="M320 330V400"/>
    </g>

    <!-- calculatoare -->
    <use href="#pc" x="100" y="110"/>
    <use href="#pc" x="470" y="110"/>
    <use href="#pc" x="100" y="400"/>
    <use href="#pc" x="470" y="400"/>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="135" y="100">Calculatorul 1</text>
      <text x="505" y="100">Calculatorul 2</text>
      <text x="135" y="488">Calculatorul 3</text>
      <text x="505" y="488">Calculatorul 4</text>
    </g>

    <!-- nod central -->
    <rect x="280" y="270" width="80" height="60" rx="12" fill="#14A39A"/>
    <circle cx="300" cy="300" r="5" fill="#FFFFFF"/><circle cx="320" cy="300" r="5" fill="#FFFFFF"/><circle cx="340" cy="300" r="5" fill="#FFFFFF"/>
    <text x="368" y="262" font-size="14" font-weight="700" fill="#0B6F68">legătura</text>

    <!-- imprimanta -->
    <rect x="276" y="128" width="88" height="44" rx="8" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="3"/>
    <rect x="292" y="110" width="56" height="20" rx="3" fill="#FFFFFF" stroke="#7A3FB8" stroke-width="3"/>
    <rect x="292" y="160" width="56" height="12" fill="#FFFFFF" stroke="#7A3FB8" stroke-width="2"/>
    <text x="376" y="146" font-size="14" font-weight="700" fill="#7A3FB8">imprimanta</text><text x="376" y="166" font-size="14" font-weight="700" fill="#7A3FB8">comună</text>

    <!-- internet -->
    <circle cx="320" cy="430" r="30" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/>
    <ellipse cx="320" cy="430" rx="13" ry="30" fill="none" stroke="#0E7F96" stroke-width="2"/>
    <path d="M290 430h60" stroke="#0E7F96" stroke-width="2"/>
    <text x="320" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7F96">spre internet</text>

    <!-- explicatii -->
    <rect x="630" y="76" width="290" height="420" rx="20" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="652" y="116" font-size="18" font-weight="800" fill="#0B6F68">Rețeaua de calculatoare</text>
    <text x="652" y="146" font-size="15">un grup de calculatoare</text>
    <text x="652" y="168" font-size="15"><tspan font-weight="800">interconectate</tspan>, care își</text>
    <text x="652" y="190" font-size="15">folosesc împreună <tspan font-weight="800">resursele</tspan>.</text>

    <text x="652" y="236" font-size="16" font-weight="800">Ce folosesc împreună?</text>
    <g font-size="15">
      <circle cx="664" cy="266" r="12" fill="#7A3FB8"/><text x="664" y="271" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">1</text>
      <text x="686" y="271">o imprimantă</text>
      <circle cx="664" cy="306" r="12" fill="#14A39A"/><text x="664" y="311" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">2</text>
      <text x="686" y="311">fișiere și foldere</text>
      <circle cx="664" cy="346" r="12" fill="#0E7F96"/><text x="664" y="351" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">3</text>
      <text x="686" y="351">legătura la internet</text>
    </g>
    <rect x="652" y="384" width="246" height="92" rx="14" fill="#FFFFFF"/>
    <text x="668" y="412" font-size="15" font-weight="800">Internetul</text>
    <text x="668" y="434" font-size="14">leagă între ele multe rețele</text>
    <text x="668" y="456" font-size="14">ca aceasta, prin <tspan font-weight="800">TCP/IP</tspan>.</text>
  </g>
</svg>
