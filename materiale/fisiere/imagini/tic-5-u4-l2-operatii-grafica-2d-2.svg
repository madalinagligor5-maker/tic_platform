<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">La ce folosesc Culoarea 1 (prim-plan) și Culoarea 2 (fundal) în Paint</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Culoarea 1 și Culoarea 2</text>

    <!-- culorile -->
    <rect x="30" y="76" width="280" height="424" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="56" y="104" width="64" height="64" rx="8" fill="#F21F4B" stroke="#171416" stroke-width="3"/>
    <text x="136" y="128" font-size="16" font-weight="800">Culoarea 1</text>
    <text x="136" y="150" font-size="14">prim-plan</text>
    <text x="56" y="196" font-size="13" fill="#6B6460">linii, contururi, text,</text>
    <text x="56" y="214" font-size="13" fill="#6B6460">creion, pensule, găleata cu vopsea</text>
    <rect x="56" y="250" width="64" height="64" rx="8" fill="#3EC6E0" stroke="#171416" stroke-width="3"/>
    <text x="136" y="274" font-size="16" font-weight="800">Culoarea 2</text>
    <text x="136" y="296" font-size="14">fundal</text>
    <text x="56" y="342" font-size="13" fill="#6B6460">umplerea formelor,</text>
    <text x="56" y="360" font-size="13" fill="#6B6460">urma radierei</text>
    <rect x="50" y="392" width="240" height="88" rx="12" fill="#F1E9DF"/>
    <text x="66" y="420" font-size="13" font-weight="800">Culori noi: Editare culori</text>
    <text x="66" y="442" font-size="13">Roșu, Verde, Albastru (RGB),</text>
    <text x="66" y="462" font-size="13">fiecare de la 0 la 255</text>

    <!-- formă -->
    <rect x="330" y="76" width="600" height="132" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="360" y="100" width="140" height="84" rx="16" fill="#3EC6E0" stroke="#F21F4B" stroke-width="7"/>
    <text x="530" y="118" font-size="16" font-weight="800">Forme</text>
    <text x="530" y="146" font-size="14"><tspan font-weight="800" fill="#C8133A">conturul</tspan> are Culoarea 1</text>
    <text x="530" y="172" font-size="14"><tspan font-weight="800" fill="#0E7F96">umplerea</tspan> are Culoarea 2</text>
    <text x="530" y="196" font-size="13" fill="#6B6460">cu Shift: pătrat, cerc, linie dreaptă</text>

    <!-- creion / text -->
    <rect x="330" y="222" width="600" height="132" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <path d="M362 300c20-40 40 30 60-10s40 30 60-10" fill="none" stroke="#F21F4B" stroke-width="5" stroke-linecap="round"/>
    <text x="430" y="340" text-anchor="middle" font-size="22" font-weight="800" fill="#F21F4B">Abc</text>
    <text x="530" y="264" font-size="16" font-weight="800">Creion, pensule, text</text>
    <text x="530" y="292" font-size="14">desenează cu <tspan font-weight="800" fill="#C8133A">Culoarea 1</tspan></text>
    <text x="530" y="318" font-size="13" fill="#6B6460">fundalul textului are Culoarea 2</text>
    <text x="530" y="336" font-size="13" fill="#6B6460">doar dacă alegi „Opac”</text>

    <!-- radieră -->
    <rect x="330" y="368" width="600" height="132" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="360" y="396" width="140" height="78" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <path d="M372 410l116 50M372 460l116-50" stroke="#F21F4B" stroke-width="6" stroke-linecap="round"/>
    <rect x="418" y="400" width="26" height="70" fill="#3EC6E0"/>
    <rect x="420" y="380" width="22" height="18" rx="3" fill="#FDE7EC" stroke="#171416" stroke-width="2.5"/>
    <text x="530" y="410" font-size="16" font-weight="800">Radiera</text>
    <text x="530" y="438" font-size="14">șterge, iar urma are <tspan font-weight="800" fill="#0E7F96">Culoarea 2</tspan></text>
    <text x="530" y="462" font-size="13" fill="#6B6460">(de obicei albă, ca foaia)</text>
  </g>
</svg>
