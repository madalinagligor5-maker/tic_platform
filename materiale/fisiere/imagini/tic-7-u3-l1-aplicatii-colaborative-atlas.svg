<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">Lucrăm împreună în siguranță</title><desc id="desc">Partajează. Acordă doar permisiunile necesare.. Cititor pentru consultare; editor pentru lucru. Colaborează. Folosește comentarii pentru feedback clar.. Indici paragraful și propui o corectură. Verifică. Consultă istoricul pentru a urmări modificările.. Identifici o versiune anterioară utilă.</desc><rect width="1080" height="640" rx="24" fill="#FFF7EE"/><g font-family="Arial, sans-serif"><text x="42" y="42" fill="#6B6460" font-size="14" letter-spacing="3">EDUDIGI / ATLAS VIZUAL / 18</text><text x="42" y="89" fill="#171416" font-size="32" font-weight="700"><tspan x="42" dy="0">Lucrăm împreună în siguranță</tspan></text><path d="M42 120H1038" stroke="#E8DFD3"/><rect x="42" y="150" width="316" height="438" rx="18" fill="#FDE7EC"/><circle cx="90" cy="202" r="25" fill="#C8133A"/><text x="90" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><path d="M326 202h42m-8-7 8 7-8 7" stroke="#C8133A" stroke-width="2" fill="none"/><text x="66" y="270" fill="#C8133A" font-size="25" font-weight="700"><tspan x="66" dy="0">Partajează</tspan></text><text x="66" y="337" fill="#171416" font-size="21" font-weight="400"><tspan x="66" dy="0">Acordă doar permisiunile</tspan><tspan x="66" dy="29.4">necesare.</tspan></text><path d="M66 438h268" stroke="#C8133A" opacity=".3"/><text x="66" y="466" font-size="13" fill="#C8133A" letter-spacing="2">ÎN PRACTICĂ</text><text x="66" y="498" fill="#171416" font-size="19" font-weight="400"><tspan x="66" dy="0">Cititor pentru consultare;</tspan><tspan x="66" dy="26.599999999999998">editor pentru lucru.</tspan></text><rect x="382" y="150" width="316" height="438" rx="18" fill="#E2F6FA"/><circle cx="430" cy="202" r="25" fill="#0E7F96"/><text x="430" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><path d="M666 202h42m-8-7 8 7-8 7" stroke="#0E7F96" stroke-width="2" fill="none"/><text x="406" y="270" fill="#0E7F96" font-size="25" font-weight="700"><tspan x="406" dy="0">Colaborează</tspan></text><text x="406" y="337" fill="#171416" font-size="21" font-weight="400"><tspan x="406" dy="0">Folosește comentarii</tspan><tspan x="406" dy="29.4">pentru feedback clar.</tspan></text><path d="M406 438h268" stroke="#0E7F96" opacity=".3"/><text x="406" y="466" font-size="13" fill="#0E7F96" letter-spacing="2">ÎN PRACTICĂ</text><text x="406" y="498" fill="#171416" font-size="19" font-weight="400"><tspan x="406" dy="0">Indici paragraful și propui</tspan><tspan x="406" dy="26.599999999999998">o corectură.</tspan></text><rect x="722" y="150" width="316" height="438" rx="18" fill="#E0F4F2"/><circle cx="770" cy="202" r="25" fill="#0B6F68"/><text x="770" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="746" y="270" fill="#0B6F68" font-size="25" font-weight="700"><tspan x="746" dy="0">Verifică</tspan></text><text x="746" y="337" fill="#171416" font-size="21" font-weight="400"><tspan x="746" dy="0">Consultă istoricul pentru</tspan><tspan x="746" dy="29.4">a urmări modificările.</tspan></text><path d="M746 438h268" stroke="#0B6F68" opacity=".3"/><text x="746" y="466" font-size="13" fill="#0B6F68" letter-spacing="2">ÎN PRACTICĂ</text><text x="746" y="498" fill="#171416" font-size="19" font-weight="400"><tspan x="746" dy="0">Identifici o versiune</tspan><tspan x="746" dy="26.599999999999998">anterioară utilă.</tspan></text><text x="42" y="620" fill="#6B6460" font-size="14">Observă. Înțelege. Aplică.</text></g></svg>