<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Robotul pe grilă: drumul pentru comenzile 1 1 2 2 2 3 și codificarea direcției</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <marker id="sagv" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B6F68"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="260" y="50" text-anchor="middle" font-size="20" font-weight="800">Comenzile robotului, un șir de valori</text>
    <text x="260" y="76" text-anchor="middle" font-size="14" fill="#6B6460">1 = nord · 2 = est · 3 = sud · 4 = vest</text>
    <!-- comenzi -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">
      <rect x="108" y="96" width="44" height="36" rx="8" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="130" y="120">1</text>
      <rect x="160" y="96" width="44" height="36" rx="8" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="182" y="120">1</text>
      <rect x="212" y="96" width="44" height="36" rx="8" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="234" y="120">2</text>
      <rect x="264" y="96" width="44" height="36" rx="8" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="286" y="120">2</text>
      <rect x="316" y="96" width="44" height="36" rx="8" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="338" y="120">2</text>
      <rect x="368" y="96" width="44" height="36" rx="8" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><text x="390" y="120">3</text>
    </g>
    <g font-size="13" fill="#6B6460" text-anchor="middle">
      <text x="130" y="150">N</text><text x="182" y="150">N</text><text x="234" y="150">E</text><text x="286" y="150">E</text><text x="338" y="150">E</text><text x="390" y="150">S</text>
    </g>

    <!-- grila -->
    <g stroke="#E8DFD3" stroke-width="2">
      <path d="M100 194 V450 M164 194 V450 M228 194 V450 M292 194 V450 M356 194 V450 M420 194 V450"/>
      <path d="M100 194 H420 M100 258 H420 M100 322 H420 M100 386 H420 M100 450 H420"/>
    </g>
    <path d="M100 450 H440" stroke="#171416" stroke-width="2" fill="none" marker-end="url(#sag)"/>
    <path d="M100 450 V176" stroke="#171416" stroke-width="2" fill="none" marker-end="url(#sag)"/>
    <text x="448" y="455" font-size="15" font-weight="800">x</text>
    <text x="95" y="172" text-anchor="end" font-size="15" font-weight="800">y</text>
    <g font-size="13" fill="#6B6460" text-anchor="middle">
      <text x="100" y="472">0</text><text x="164" y="472">1</text><text x="228" y="472">2</text><text x="292" y="472">3</text><text x="356" y="472">4</text><text x="420" y="472">5</text>
    </g>
    <g font-size="13" fill="#6B6460" text-anchor="end">
      <text x="88" y="391">1</text><text x="88" y="327">2</text><text x="88" y="263">3</text>
    </g>
    <!-- drum -->
    <g stroke="#14A39A" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#sagv)">
      <path d="M100 450 V392"/><path d="M100 386 V328"/><path d="M100 322 H158"/><path d="M164 322 H222"/><path d="M228 322 H286"/><path d="M292 322 V380"/>
    </g>
    <circle cx="100" cy="450" r="9" fill="#14A39A"/>
    <text x="110" y="436" font-size="13" font-weight="700" fill="#0B6F68">start (0, 0)</text>
    <circle cx="292" cy="386" r="11" fill="#F21F4B"/>
    <text x="308" y="391" font-size="15" font-weight="800" fill="#C8133A">final (3, 1)</text>
    <text x="260" y="504" text-anchor="middle" font-size="14" fill="#6B6460">Pași spre nord: 2 · poziția finală: (3, 1)</text>

    <!-- direcție -->
    <rect x="520" y="74" width="410" height="436" rx="18" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="725" y="108" text-anchor="middle" font-size="18" font-weight="800" fill="#0B6F68">Direcția: variabila dir</text>
    <circle cx="725" cy="248" r="56" fill="#F1E9DF"/>
    <path d="M725 248 V172" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <path d="M725 248 H801" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <path d="M725 248 V324" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <path d="M725 248 H649" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <circle cx="725" cy="248" r="7" fill="#171416"/>
    <text x="725" y="146" text-anchor="middle" font-size="15" font-weight="800">0 · nord</text>
    <text x="725" y="162" text-anchor="middle" font-size="13" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">y++</text>
    <text x="812" y="246" font-size="15" font-weight="800">1 · est</text>
    <text x="812" y="264" font-size="13" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">x++</text>
    <text x="725" y="346" text-anchor="middle" font-size="15" font-weight="800">2 · sud</text>
    <text x="725" y="362" text-anchor="middle" font-size="13" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">y--</text>
    <text x="638" y="246" text-anchor="end" font-size="15" font-weight="800">3 · vest</text>
    <text x="638" y="264" text-anchor="end" font-size="13" fill="#6B6460" font-family="JetBrains Mono, Consolas, monospace">x--</text>
    <rect x="545" y="392" width="360" height="94" rx="12" fill="#E2F6FA"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="15">
      <text x="563" y="424">dreapta: dir = (dir + 1) % 4</text>
      <text x="563" y="456">stânga:  dir = (dir + 3) % 4</text>
    </g>
    <text x="725" y="478" text-anchor="middle" font-size="13" fill="#0E7F96">după vest (3) urmează din nou nord (0)</text>
  </g>
</svg>
