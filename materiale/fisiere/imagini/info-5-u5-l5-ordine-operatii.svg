<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Ordinea operațiilor și evaluarea pas cu pas a expresiei ((b - a) + 2) / 2 pentru a = 10 și b = 30</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6460"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Evaluarea unei expresii, pas cu pas</text>

    <!-- scara priorităților -->
    <text x="180" y="94" text-anchor="middle" font-size="17" font-weight="800">Ce calculăm întâi?</text>
    <rect x="40" y="114" width="280" height="96" rx="14" fill="#F21F4B"/>
    <text x="64" y="152" font-size="26" font-weight="800" fill="#fff">1</text>
    <text x="96" y="150" font-size="17" font-weight="800" fill="#fff">parantezele</text>
    <text x="96" y="174" font-size="14" fill="#fff">din interior spre</text>
    <text x="96" y="192" font-size="14" fill="#fff">exterior</text>
    <rect x="40" y="222" width="280" height="80" rx="14" fill="#FFC83D"/>
    <text x="64" y="270" font-size="26" font-weight="800">2</text>
    <text x="96" y="258" font-size="17" font-weight="800" word-spacing="10">* / %</text>
    <text x="96" y="282" font-size="14">înmulțire, cât, rest</text>
    <rect x="40" y="314" width="280" height="80" rx="14" fill="#3EC6E0"/>
    <text x="64" y="362" font-size="26" font-weight="800" fill="#fff">3</text>
    <text x="96" y="350" font-size="17" font-weight="800" fill="#fff" word-spacing="10">+ -</text>
    <text x="96" y="374" font-size="14" fill="#fff">adunare, scădere</text>
    <rect x="40" y="410" width="280" height="96" rx="14" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="180" y="440" text-anchor="middle" font-size="15" font-weight="700">Exemplu:</text>
    <text x="180" y="466" text-anchor="middle" font-size="16">(10 + 2) / 2</text>
    <text x="180" y="490" text-anchor="middle" font-size="16">= 12 / 2 = <tspan font-weight="800">6</tspan></text>

    <!-- evaluarea -->
    <rect x="350" y="72" width="570" height="434" rx="18" fill="#FFFFFF" stroke="#7A3FB8" stroke-width="3"/>
    <text x="635" y="104" text-anchor="middle" font-size="17" font-weight="800" fill="#7A3FB8">a = 10, b = 30</text>

    <g font-size="20" font-weight="800">
      <rect x="374" y="122" width="250" height="50" rx="10" fill="#F0E8FA"/>
      <text x="499" y="154" text-anchor="middle">((b - a) + 2) / 2</text>
      <rect x="374" y="196" width="250" height="50" rx="10" fill="#F0E8FA"/>
      <text x="499" y="228" text-anchor="middle">((30 - 10) + 2) / 2</text>
      <rect x="374" y="270" width="250" height="50" rx="10" fill="#FDE7EC"/>
      <text x="499" y="302" text-anchor="middle">(20 + 2) / 2</text>
      <rect x="374" y="344" width="250" height="50" rx="10" fill="#FDE7EC"/>
      <text x="499" y="376" text-anchor="middle">22 / 2</text>
      <rect x="374" y="418" width="250" height="60" rx="10" fill="#14A39A"/>
      <text x="499" y="457" text-anchor="middle" font-size="28" fill="#fff">11</text>
    </g>
    <g stroke="#6B6460" stroke-width="2.5" fill="none">
      <path d="M499 174V192" marker-end="url(#a)"/>
      <path d="M499 248V266" marker-end="url(#a)"/>
      <path d="M499 322V340" marker-end="url(#a)"/>
      <path d="M499 396V414" marker-end="url(#a)"/>
    </g>
    <g font-size="15">
      <text x="644" y="153" fill="#6B6460">expresia dată</text>
      <text x="644" y="219">înlocuim variabilele</text>
      <text x="644" y="239" fill="#6B6460">cu valorile lor</text>
      <text x="644" y="293"><tspan font-weight="800" fill="#C8133A">①</tspan> paranteza</text>
      <text x="644" y="313" fill="#6B6460">din interior: 30 - 10</text>
      <text x="644" y="367"><tspan font-weight="800" fill="#C8133A">①</tspan> paranteza</text>
      <text x="644" y="387" fill="#6B6460">exterioară: 20 + 2</text>
      <text x="644" y="444"><tspan font-weight="800" fill="#9A6B00">②</tspan> împărțirea</text>
      <text x="644" y="464" fill="#6B6460">întreagă: 22 / 2</text>
    </g>
  </g>
</svg>
