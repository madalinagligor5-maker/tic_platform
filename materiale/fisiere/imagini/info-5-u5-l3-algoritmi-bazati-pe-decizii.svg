<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t">
  <title id="t">Schema structurii alternative pentru traversarea străzii la semafor</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="560" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Dacă… Atunci… Altfel: traversarea străzii</text>

    <!-- start -->
    <rect x="340" y="70" width="120" height="32" rx="16" fill="#171416"/>
    <text x="400" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#FFF7EE">Start</text>
    <rect x="270" y="122" width="260" height="42" rx="10" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <text x="400" y="149" text-anchor="middle" font-size="15">Ajung la marginea străzii.</text>

    <!-- decizie -->
    <path d="M400 186L560 260L400 334L240 260Z" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="255" text-anchor="middle" font-size="15" font-weight="800">Semaforul pietonilor</text>
    <text x="400" y="276" text-anchor="middle" font-size="15" font-weight="800">este roșu?</text>

    <!-- ramuri -->
    <rect x="70" y="362" width="160" height="44" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="150" y="390" text-anchor="middle" font-size="16" font-weight="800" fill="#0B6F68">Aștept.</text>
    <rect x="570" y="362" width="160" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="650" y="390" text-anchor="middle" font-size="16" font-weight="800">Traversez.</text>
    <text x="196" y="248" font-size="16" font-weight="800" fill="#0B6F68">Da</text>
    <text x="578" y="248" font-size="16" font-weight="800" fill="#171416">Nu</text>

    <!-- stop -->
    <rect x="340" y="480" width="120" height="32" rx="16" fill="#171416"/>
    <text x="400" y="501" text-anchor="middle" font-size="15" font-weight="800" fill="#FFF7EE">Stop</text>

    <g stroke="#171416" stroke-width="3" fill="none">
      <path d="M400 102V118" marker-end="url(#a)"/>
      <path d="M400 164V182" marker-end="url(#a)"/>
      <path d="M240 260H150V358" stroke="#14A39A" marker-end="url(#a)"/>
      <path d="M560 260H650V358" stroke="#F29A1F" marker-end="url(#a)"/>
      <path d="M150 406V448H400M650 406V448H400"/>
      <path d="M400 448V476" marker-end="url(#a)"/>
    </g>

    <!-- explicații -->
    <rect x="760" y="110" width="172" height="86" rx="12" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <text x="776" y="136" font-size="15" font-weight="800" fill="#0E7F96">Condiția</text>
    <text x="776" y="158" font-size="13">o întrebare cu</text>
    <text x="776" y="178" font-size="13">răspunsul Da sau Nu</text>
    <rect x="760" y="214" width="172" height="86" rx="12" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
    <text x="776" y="240" font-size="15" font-weight="800" fill="#0B6F68">Atunci (Da)</text>
    <text x="776" y="262" font-size="13">se execută dacă</text>
    <text x="776" y="282" font-size="13">condiția e îndeplinită</text>
    <rect x="760" y="318" width="172" height="106" rx="12" fill="#FFFFFF" stroke="#F29A1F" stroke-width="3"/>
    <text x="776" y="344" font-size="15" font-weight="800">Altfel (Nu)</text>
    <text x="776" y="366" font-size="13">se execută dacă</text>
    <text x="776" y="386" font-size="13">condiția nu este</text>
    <text x="776" y="406" font-size="13">îndeplinită</text>
  </g>
</svg>
