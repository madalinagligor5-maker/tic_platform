<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Ordinea contează: îmbrăcatul în ordinea corectă comparat cu pantofii puși înaintea șosetelor</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="50" text-anchor="middle" font-size="24" font-weight="800">Într-un algoritm secvențial, ordinea contează!</text>

    <!-- panou corect -->
    <rect x="40" y="82" width="500" height="350" rx="18" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <circle cx="76" cy="116" r="16" fill="#14A39A"/>
    <path d="M68 116L74 122L85 110" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="123" font-size="20" font-weight="800" fill="#0B6F68">Corect</text>

    <g font-size="15" font-weight="800" text-anchor="middle">
      <circle cx="104" cy="166" r="15" fill="#0B6F68"/><text x="104" y="171" fill="#fff">1</text>
      <circle cx="220" cy="166" r="15" fill="#0B6F68"/><text x="220" y="171" fill="#fff">2</text>
      <circle cx="336" cy="166" r="15" fill="#0B6F68"/><text x="336" y="171" fill="#fff">3</text>
      <circle cx="452" cy="166" r="15" fill="#0B6F68"/><text x="452" y="171" fill="#fff">4</text>
    </g>
    <g stroke="#fff" stroke-width="0">
      <rect x="62" y="186" width="84" height="84" rx="12" fill="#fff"/>
      <rect x="178" y="186" width="84" height="84" rx="12" fill="#fff"/>
      <rect x="294" y="186" width="84" height="84" rx="12" fill="#fff"/>
      <rect x="410" y="186" width="84" height="84" rx="12" fill="#fff"/>
    </g>
    <!-- tricou -->
    <path d="M74 206L92 196H116L134 206L126 222L120 219V258H88V219L82 222Z" fill="#3EC6E0"/>
    <!-- șosetă -->
    <path d="M210 196H230V236L244 244Q250 256 238 260H216Q210 260 210 252Z" fill="#FFC83D"/>
    <!-- pantaloni -->
    <path d="M312 196H360L364 262H342L336 220L330 262H308Z" fill="#7A3FB8"/>
    <!-- pantof -->
    <path d="M424 244Q424 228 438 228H450Q452 242 466 244L478 248Q486 252 484 262H424Z" fill="#171416"/>

    <g font-size="15" text-anchor="middle">
      <text x="104" y="296">tricoul</text>
      <text x="220" y="296">șosetele</text>
      <text x="336" y="296">pantalonii</text>
      <text x="452" y="296">pantofii</text>
    </g>
    <g stroke="#171416" stroke-width="3" fill="none">
      <path d="M148 228H174" marker-end="url(#a)"/>
      <path d="M264 228H290" marker-end="url(#a)"/>
      <path d="M380 228H406" marker-end="url(#a)"/>
    </g>
    <rect x="62" y="330" width="456" height="78" rx="12" fill="#fff"/>
    <text x="290" y="362" text-anchor="middle" font-size="16" font-weight="700">Fiecare pas se face o singură dată,</text>
    <text x="290" y="386" text-anchor="middle" font-size="16" font-weight="700">după cel dinaintea lui.</text>

    <!-- panou greșit -->
    <rect x="560" y="82" width="360" height="350" rx="18" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <circle cx="596" cy="116" r="16" fill="#F21F4B"/>
    <path d="M589 109L603 123M603 109L589 123" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="622" y="123" font-size="20" font-weight="800" fill="#C8133A">Greșit</text>

    <text x="590" y="166" font-size="16"><tspan font-weight="800">1.</tspan> întâi pantofii…</text>
    <text x="590" y="192" font-size="16"><tspan font-weight="800">2.</tspan> apoi șosetele?!</text>

    <!-- șosetă care nu mai încape -->
    <path d="M760 214H780V250L794 258Q800 270 788 274H766Q760 274 760 266Z" fill="#FFC83D" transform="rotate(-18 776 244)"/>
    <path d="M760 286Q752 300 748 314" stroke="#C8133A" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
    <circle cx="830" cy="232" r="18" fill="#F21F4B"/>
    <text x="830" y="240" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">!</text>
    <!-- pantof mare -->
    <path d="M660 360Q660 324 690 324H714Q718 352 748 356L790 364Q806 370 804 392H660Z" fill="#171416"/>
    <rect x="660" y="392" width="146" height="8" rx="4" fill="#6B6460"/>

    <!-- definiție -->
    <rect x="40" y="452" width="880" height="62" rx="14" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <text x="480" y="481" text-anchor="middle" font-size="16"><tspan font-weight="800" fill="#0E7F96">Algoritm secvențial:</tspan> pașii se execută liniar, unul după altul,</text>
    <text x="480" y="503" text-anchor="middle" font-size="16">în ordinea în care apar, de la început până la sfârșit.</text>
  </g>
</svg>
