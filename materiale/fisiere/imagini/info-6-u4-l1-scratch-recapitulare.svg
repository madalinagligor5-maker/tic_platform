<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t">
  <title id="t">Interfața Scratch: categorii, paleta de blocuri, zona de program cu scriptul pinguinului, scena, zona Personaje și zona Decoruri</title>
  <rect width="960" height="600" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- fereastra -->
    <rect x="30" y="30" width="900" height="540" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="30" y="30" width="900" height="42" rx="16" fill="#0E7F96"/>
    <rect x="30" y="56" width="900" height="16" fill="#0E7F96"/>
    <text x="50" y="57" font-size="14" font-weight="700" fill="#FFFFFF">Fișier   Editare</text>
    <rect x="190" y="39" width="190" height="24" rx="6" fill="#E2F6FA"/>
    <text x="285" y="56" text-anchor="middle" font-size="13" fill="#0E7F96">Pinguin la Polul Sud</text>
    <rect x="790" y="39" width="120" height="24" rx="12" fill="#F29A1F"/>
    <text x="850" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Partajează</text>

    <!-- file -->
    <rect x="40" y="80" width="66" height="26" rx="6" fill="#E2F6FA" stroke="#0E7F96" stroke-width="2"/>
    <text x="73" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#0E7F96">Cod</text>
    <text x="150" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6460">Costume</text>
    <text x="238" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6460">Sunete</text>
    <path d="M32 110H704" stroke="#E8DFD3" stroke-width="2"/>

    <!-- steag verde și stop -->
    <path d="M722 82v22" stroke="#171416" stroke-width="3" stroke-linecap="round"/>
    <path d="M723 83h18l-5 6 5 6h-18z" fill="#14A39A"/>
    <circle cx="764" cy="94" r="10" fill="#F21F4B"/>
    <rect x="759" y="89" width="10" height="10" fill="#FFFFFF"/>

    <!-- categorii -->
    <rect x="40" y="168" width="100" height="54" rx="8" fill="#E2F6FA"/>
    <g font-size="13" text-anchor="middle">
      <circle cx="90" cy="130" r="10" fill="#3EC6E0"/><text x="90" y="157">Mișcare</text>
      <circle cx="90" cy="184" r="10" fill="#0E7F96"/><text x="90" y="211" font-weight="700">Aspect</text>
      <circle cx="90" cy="238" r="10" fill="#F21F4B"/><text x="90" y="265">Sunet</text>
      <circle cx="90" cy="292" r="10" fill="#F29A1F"/><text x="90" y="319">Evenimente</text>
      <circle cx="90" cy="346" r="9" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="90" y="373">Control</text>
      <circle cx="90" cy="400" r="9" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="90" y="427">Detectare</text>
      <circle cx="90" cy="454" r="10" fill="#14A39A"/><text x="90" y="481">Operatori</text>
      <circle cx="90" cy="508" r="9" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><text x="90" y="535">Variabile</text>
    </g>
    <path d="M142 112V566" stroke="#E8DFD3" stroke-width="2"/>

    <!-- paleta de blocuri (Aspect) -->
    <text x="150" y="136" font-size="14" font-weight="800" fill="#0E7F96">Aspect</text>
    <g font-size="13" fill="#FFFFFF">
      <rect x="150" y="150" width="132" height="32" rx="6" fill="#0E7F96"/><text x="160" y="171">spune Salut!</text>
      <rect x="150" y="192" width="132" height="32" rx="6" fill="#0E7F96"/><text x="160" y="213">costumul următor</text>
      <rect x="150" y="234" width="132" height="32" rx="6" fill="#0E7F96"/><text x="160" y="255">arată</text>
      <rect x="150" y="276" width="132" height="32" rx="6" fill="#0E7F96"/><text x="160" y="297">ascunde</text>
    </g>
    <rect x="148" y="520" width="136" height="28" rx="14" fill="#171416"/>
    <text x="216" y="539" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Paleta de blocuri</text>
    <path d="M290 112V566" stroke="#E8DFD3" stroke-width="2"/>

    <!-- zona de program -->
    <rect x="292" y="112" width="410" height="456" fill="#FFF7EE"/>
    <path d="M300 200V160Q340 132 380 160H552a8 8 0 0 1 8 8V192a8 8 0 0 1-8 8Z" fill="#F29A1F"/>
    <text x="312" y="186" font-size="13" fill="#FFFFFF">când se dă clic pe acest personaj</text>
    <rect x="300" y="200" width="392" height="44" rx="8" fill="#0E7F96"/>
    <text x="312" y="227" font-size="13" fill="#FFFFFF">schimbă costumul la</text>
    <rect x="462" y="207" width="220" height="30" rx="15" fill="#14A39A"/>
    <text x="474" y="227" font-size="13" fill="#FFFFFF">alege aleator între</text>
    <rect x="603" y="212" width="24" height="20" rx="10" fill="#FFFFFF"/>
    <text x="615" y="227" text-anchor="middle" font-size="13">1</text>
    <text x="633" y="227" font-size="13" fill="#FFFFFF">și</text>
    <rect x="650" y="212" width="24" height="20" rx="10" fill="#FFFFFF"/>
    <text x="662" y="227" text-anchor="middle" font-size="13">4</text>
    <!-- etichete pentru blocuri -->
    <path d="M330 250v22M560 250v22" stroke="#6B6460" stroke-width="2"/>
    <text x="330" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0E7F96">din Aspect</text>
    <text x="560" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0B6F68">din Operatori</text>
    <text x="574" y="170" font-size="13" font-weight="700" fill="#C8133A">← din</text>
    <text x="574" y="188" font-size="13" font-weight="700" fill="#C8133A">Evenimente</text>
    <text x="300" y="340" font-size="14" fill="#6B6460">La fiecare clic, articolul primește</text>
    <text x="300" y="360" font-size="14" fill="#6B6460">un costum ales la întâmplare (1–4).</text>
    <rect x="300" y="430" width="140" height="28" rx="14" fill="#171416"/>
    <text x="370" y="449" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Zona de program</text>
    <rect x="292" y="482" width="410" height="86" fill="#F1E9DF"/>
    <text x="306" y="512" font-size="14" font-weight="800">Rucsacul</text>
    <text x="306" y="534" font-size="13" fill="#6B6460">păstrezi scripturi și personaje</text>
    <text x="306" y="552" font-size="13" fill="#6B6460">pentru alte proiecte</text>
    <path d="M704 112V566" stroke="#E8DFD3" stroke-width="2"/>

    <!-- scena -->
    <rect x="712" y="116" width="208" height="156" rx="6" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <path d="M730 262q86-36 172 0z" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <ellipse cx="816" cy="214" rx="22" ry="32" fill="#171416"/>
    <ellipse cx="816" cy="222" rx="14" ry="22" fill="#FFFFFF"/>
    <circle cx="816" cy="174" r="16" fill="#171416"/>
    <circle cx="810" cy="172" r="3" fill="#FFFFFF"/><circle cx="822" cy="172" r="3" fill="#FFFFFF"/>
    <path d="M811 180h10l-5 6z" fill="#F29A1F"/>
    <path d="M800 168q16-22 32 0z" fill="#F21F4B"/>
    <rect x="800" y="188" width="32" height="7" rx="3" fill="#F29A1F"/>
    <ellipse cx="808" cy="246" rx="8" ry="4" fill="#F29A1F"/><ellipse cx="824" cy="246" rx="8" ry="4" fill="#F29A1F"/>
    <rect x="720" y="124" width="62" height="24" rx="12" fill="#171416"/>
    <text x="751" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Scena</text>

    <!-- zona personaje -->
    <rect x="712" y="284" width="130" height="276" rx="8" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="777" y="304" text-anchor="middle" font-size="13" font-weight="800">Personaje</text>
    <g font-size="13" text-anchor="middle">
      <rect x="718" y="316" width="56" height="48" rx="6" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/>
      <ellipse cx="746" cy="342" rx="11" ry="16" fill="#171416"/><ellipse cx="746" cy="346" rx="6" ry="10" fill="#FFFFFF"/>
      <text x="746" y="380">Pinguin</text>
      <rect x="780" y="316" width="56" height="48" rx="6" fill="#F1E9DF"/>
      <path d="M796 326h24l6 30h-36z" fill="#3EC6E0"/>
      <text x="808" y="380">haina1</text>
      <rect x="718" y="392" width="56" height="48" rx="6" fill="#F1E9DF"/>
      <path d="M730 428q16-30 32 0z" fill="#F21F4B"/>
      <text x="746" y="456">fes1</text>
      <rect x="780" y="392" width="56" height="48" rx="6" fill="#F1E9DF"/>
      <rect x="790" y="410" width="36" height="10" rx="5" fill="#F29A1F"/><rect x="814" y="414" width="9" height="20" rx="3" fill="#F29A1F"/>
      <text x="808" y="456">fular1</text>
      <rect x="718" y="468" width="56" height="48" rx="6" fill="#F1E9DF"/>
      <path d="M736 506v-18a10 10 0 0 1 20 0v18z" fill="#14A39A"/><circle cx="734" cy="494" r="5" fill="#14A39A"/>
      <text x="746" y="532">manusi1</text>
    </g>

    <!-- zona decoruri -->
    <rect x="850" y="284" width="70" height="276" rx="8" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="885" y="304" text-anchor="middle" font-size="13" font-weight="800">Decor</text>
    <rect x="860" y="316" width="50" height="40" rx="6" fill="#E2F6FA"/>
    <path d="M864 352q21-14 42 0z" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="2"/>
    <text x="885" y="374" text-anchor="middle" font-size="13" fill="#6B6460">fundal</text>
  </g>
</svg>
