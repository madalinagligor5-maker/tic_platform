<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Ce găsim în unitatea centrală: microprocesorul, placa de bază, memoria RAM, plăcile de extensie, sursa, unitatea optică, HDD-ul sau SSD-ul</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="255" y="48" text-anchor="middle" font-size="22" font-weight="800">În interiorul unității centrale</text>

    <!-- carcasa -->
    <rect x="40" y="70" width="430" height="440" rx="18" fill="#fff" stroke="#171416" stroke-width="5"/>
    <!-- sursa 5 -->
    <rect x="66" y="94" width="160" height="78" rx="8" fill="#6B6460"/>
    <circle cx="112" cy="133" r="26" fill="#8A827D" stroke="#fff" stroke-width="3"/>
    <path d="M112 109v48M88 133h48M95 116l34 34M129 116l-34 34" stroke="#fff" stroke-width="2"/>
    <rect x="160" y="112" width="50" height="40" rx="4" fill="#8A827D"/>
    <!-- unitate optica 6 -->
    <rect x="300" y="94" width="146" height="40" rx="6" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <path d="M316 116h80" stroke="#0E7F96" stroke-width="4" stroke-linecap="round"/>
    <circle cx="424" cy="114" r="5" fill="#0E7F96"/>
    <!-- HDD 7 -->
    <rect x="300" y="146" width="146" height="66" rx="6" fill="#0E7F96"/>
    <circle cx="350" cy="179" r="24" fill="#E2F6FA"/>
    <circle cx="350" cy="179" r="5" fill="#0E7F96"/>
    <path d="M410 160l-46 18" stroke="#FFC83D" stroke-width="4" stroke-linecap="round"/>
    <!-- placa de baza 2 -->
    <rect x="66" y="196" width="220" height="290" rx="8" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <path d="M80 240h30M80 256h20M260 470v-30M244 470v-20" stroke="#14A39A" stroke-width="3" stroke-linecap="round"/>
    <!-- procesor 1 -->
    <rect x="114" y="226" width="70" height="70" rx="6" fill="#171416"/>
    <rect x="130" y="242" width="38" height="38" rx="4" fill="#FFC83D"/>
    <g stroke="#171416" stroke-width="3"><path d="M124 222v-6M138 222v-6M152 222v-6M166 222v-6M180 222v-6"/><path d="M124 300v6M138 300v6M152 300v6M166 300v6M180 300v6"/></g>
    <!-- RAM 3 -->
    <rect x="214" y="218" width="12" height="110" rx="3" fill="#7A3FB8"/>
    <rect x="234" y="218" width="12" height="110" rx="3" fill="#7A3FB8"/>
    <rect x="254" y="218" width="12" height="110" rx="3" fill="#B08AD9"/>
    <!-- placi extensie 4 -->
    <rect x="86" y="370" width="190" height="24" rx="4" fill="#F21F4B"/>
    <rect x="86" y="410" width="150" height="20" rx="4" fill="#FFC83D"/>
    <path d="M100 382h40" stroke="#FDE7EC" stroke-width="4" stroke-linecap="round"/>
    <!-- cabluri -->
    <path d="M226 160c40 0 50 40 60 60" stroke="#6B6460" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M300 200c-20 0-10 40-14 60" stroke="#6B6460" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- bulinele -->
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#fff">
      <circle cx="198" cy="262" r="14" fill="#171416"/><text x="198" y="267">1</text>
      <circle cx="96" cy="300" r="14" fill="#171416"/><text x="96" y="305">2</text>
      <circle cx="240" cy="346" r="14" fill="#171416"/><text x="240" y="351">3</text>
      <circle cx="256" cy="420" r="14" fill="#171416"/><text x="256" y="425">4</text>
      <circle cx="244" cy="96" r="14" fill="#171416"/><text x="244" y="101">5</text>
      <circle cx="456" cy="90" r="14" fill="#171416"/><text x="456" y="95">6</text>
      <circle cx="456" cy="226" r="14" fill="#171416"/><text x="456" y="231">7</text>
    </g>

    <!-- legenda -->
    <rect x="500" y="40" width="430" height="470" rx="18" fill="#fff" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#fff">
      <circle cx="532" cy="92" r="14" fill="#171416"/><text x="532" y="97">1</text>
      <circle cx="532" cy="156" r="14" fill="#171416"/><text x="532" y="161">2</text>
      <circle cx="532" cy="220" r="14" fill="#171416"/><text x="532" y="225">3</text>
      <circle cx="532" cy="284" r="14" fill="#171416"/><text x="532" y="289">4</text>
      <circle cx="532" cy="348" r="14" fill="#171416"/><text x="532" y="353">5</text>
      <circle cx="532" cy="412" r="14" fill="#171416"/><text x="532" y="417">6</text>
      <circle cx="532" cy="476" r="14" fill="#171416"/><text x="532" y="481">7</text>
    </g>
    <g font-size="16" font-weight="800">
      <text x="558" y="90">Microprocesorul</text>
      <text x="558" y="154">Placa de bază</text>
      <text x="558" y="218">Memoria RAM</text>
      <text x="558" y="282">Plăcile de extensie</text>
      <text x="558" y="346">Sursa de alimentare</text>
      <text x="558" y="410">Unitatea optică</text>
      <text x="558" y="474">HDD și/sau SSD</text>
    </g>
    <g font-size="14" fill="#6B6460">
      <text x="558" y="110">„creierul”: face calculele, controlează tot</text>
      <text x="558" y="174">pe ea se conectează toate componentele</text>
      <text x="558" y="238">memoria de lucru: păstrează temporar</text>
      <text x="558" y="302">placa video, de sunet, de rețea, tuner TV</text>
      <text x="558" y="366">dă energia electrică necesară</text>
      <text x="558" y="430">citește și scrie CD, DVD, Blu-ray</text>
      <text x="558" y="494">memoria permanentă: păstrează datele</text>
    </g>
  </g>
</svg>
