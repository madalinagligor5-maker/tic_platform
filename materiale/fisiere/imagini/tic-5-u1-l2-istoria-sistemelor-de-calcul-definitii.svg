<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Sistemul de calcul este format din hardware și software; sistemul de comunicații transmite informația între puncte</title>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- sistem de calcul -->
    <rect x="30" y="30" width="540" height="480" rx="20" fill="#fff" stroke="#3EC6E0" stroke-width="3"/>
    <text x="300" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="#0E7F96">Sistemul de calcul</text>

    <rect x="60" y="100" width="210" height="190" rx="16" fill="#E2F6FA"/>
    <text x="165" y="132" text-anchor="middle" font-size="20" font-weight="800">HARDWARE</text>
    <text x="165" y="154" text-anchor="middle" font-size="14" fill="#6B6460">partea fizică</text>
    <rect x="105" y="172" width="80" height="56" rx="6" fill="#fff" stroke="#171416" stroke-width="3"/>
    <path d="M145 228v12M125 242h40" stroke="#171416" stroke-width="4" stroke-linecap="round"/>
    <rect x="198" y="168" width="34" height="78" rx="6" fill="#171416"/>
    <circle cx="215" cy="230" r="6" fill="none" stroke="#3EC6E0" stroke-width="3"/>
    <rect x="96" y="254" width="100" height="16" rx="4" fill="#fff" stroke="#171416" stroke-width="2"/>

    <text x="300" y="210" text-anchor="middle" font-size="40" font-weight="800" fill="#0E7F96">+</text>

    <rect x="330" y="100" width="210" height="190" rx="16" fill="#F0E8FA"/>
    <text x="435" y="132" text-anchor="middle" font-size="20" font-weight="800">SOFTWARE</text>
    <text x="435" y="154" text-anchor="middle" font-size="14" fill="#6B6460">partea logică</text>
    <rect x="370" y="164" width="130" height="70" rx="8" fill="#fff" stroke="#7A3FB8" stroke-width="3"/>
    <path d="M370 182h130" stroke="#7A3FB8" stroke-width="3"/>
    <circle cx="384" cy="173" r="3.5" fill="#7A3FB8"/><circle cx="396" cy="173" r="3.5" fill="#7A3FB8"/>
    <rect x="384" y="192" width="30" height="32" rx="4" fill="#7A3FB8"/>
    <rect x="424" y="192" width="30" height="32" rx="4" fill="#FFC83D"/>
    <rect x="464" y="192" width="24" height="32" rx="4" fill="#3EC6E0"/>
    <text x="435" y="256" text-anchor="middle" font-size="14" font-weight="700">sistemul de operare</text>
    <text x="435" y="276" text-anchor="middle" font-size="14" font-weight="700">și programele</text>

    <path d="M300 300V336" stroke="#171416" stroke-width="3" marker-end="url(#s)"/>
    <text x="300" y="370" text-anchor="middle" font-size="16" font-weight="800">Cu el putem lucra cu informații:</text>
    <g font-size="15" font-weight="800" text-anchor="middle">
      <rect x="52" y="392" width="112" height="44" rx="22" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="2"/><text x="108" y="420">preia</text>
      <rect x="176" y="392" width="112" height="44" rx="22" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="2"/><text x="232" y="420">stochează</text>
      <rect x="300" y="392" width="124" height="44" rx="22" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="2"/><text x="362" y="420">prelucrează</text>
      <rect x="436" y="392" width="112" height="44" rx="22" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="2"/><text x="492" y="420">transmite</text>
    </g>
    <text x="300" y="476" text-anchor="middle" font-size="14" fill="#6B6460">Exemple: calculatorul, laptopul, tableta, telefonul inteligent.</text>

    <!-- sistem de comunicatii -->
    <rect x="590" y="30" width="340" height="480" rx="20" fill="#fff" stroke="#14A39A" stroke-width="3"/>
    <text x="760" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#0B6F68">Sistemul</text>
    <text x="760" y="92" text-anchor="middle" font-size="22" font-weight="800" fill="#0B6F68">de comunicații</text>

    <rect x="626" y="140" width="50" height="86" rx="10" fill="#171416"/>
    <rect x="632" y="150" width="38" height="62" rx="3" fill="#E0F4F2"/>
    <text x="651" y="250" text-anchor="middle" font-size="15" font-weight="800">punctul A</text>

    <rect x="832" y="150" width="72" height="50" rx="6" fill="#fff" stroke="#171416" stroke-width="3"/>
    <path d="M822 208h92" stroke="#171416" stroke-width="6" stroke-linecap="round"/>
    <text x="868" y="250" text-anchor="middle" font-size="15" font-weight="800">punctul B</text>

    <rect x="724" y="320" width="76" height="58" rx="8" fill="#fff" stroke="#171416" stroke-width="3"/>
    <rect x="732" y="328" width="60" height="42" rx="3" fill="#E0F4F2"/>
    <text x="762" y="404" text-anchor="middle" font-size="15" font-weight="800">punctul C</text>

    <path d="M690 180H812" stroke="#14A39A" stroke-width="3" stroke-dasharray="7 6" marker-start="url(#s)" marker-end="url(#s)"/>
    <path d="M664 264L730 316" stroke="#14A39A" stroke-width="3" stroke-dasharray="7 6" marker-start="url(#s)" marker-end="url(#s)"/>
    <path d="M872 264L800 316" stroke="#14A39A" stroke-width="3" stroke-dasharray="7 6" marker-start="url(#s)" marker-end="url(#s)"/>
    <rect x="734" y="166" width="34" height="24" rx="3" fill="#FFC83D"/>
    <path d="M734 166l17 13l17-13" stroke="#171416" stroke-width="2" fill="none"/>

    <text x="760" y="446" text-anchor="middle" font-size="15" font-weight="700">transmite informația între</text>
    <text x="760" y="468" text-anchor="middle" font-size="15" font-weight="700">două sau mai multe puncte</text>
  </g>
</svg>
