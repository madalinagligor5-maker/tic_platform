<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Structura unui e-mail bine scris: subiect, adresare, cuprins, încheiere, semnătură și atașament cu nume sugestiv</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <rect x="40" y="36" width="540" height="468" rx="14" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <!-- bare colorate -->
    <rect x="52" y="54" width="6" height="40" rx="3" fill="#0E7F96"/>
    <rect x="52" y="122" width="6" height="30" rx="3" fill="#F21F4B"/>
    <rect x="52" y="168" width="6" height="128" rx="3" fill="#14A39A"/>
    <rect x="52" y="312" width="6" height="30" rx="3" fill="#F29A1F"/>
    <rect x="52" y="352" width="6" height="30" rx="3" fill="#C8133A"/>
    <rect x="52" y="404" width="6" height="40" rx="3" fill="#0B6F68"/>
    <g font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="560" cy="74" r="11" fill="#0E7F96"/><text x="560" y="79">1</text>
      <circle cx="560" cy="137" r="11" fill="#F21F4B"/><text x="560" y="142">2</text>
      <circle cx="560" cy="232" r="11" fill="#14A39A"/><text x="560" y="237">3</text>
      <circle cx="560" cy="327" r="11" fill="#F29A1F"/><text x="560" y="332">4</text>
      <circle cx="560" cy="367" r="11" fill="#C8133A"/><text x="560" y="372">5</text>
      <circle cx="560" cy="424" r="11" fill="#0B6F68"/><text x="560" y="429">6</text>
    </g>
    <g font-size="14">
      <text x="72" y="80"><tspan font-weight="800" fill="#6B6460">Subiect:</tspan> Tema la TIC – prezentarea despre apă</text>
      <path d="M42 106H578" stroke="#E8DFD3" stroke-width="2"/>
      <text x="72" y="142">Bună ziua, doamna profesoară,</text>
      <text x="72" y="186">Vă trimit atașată prezentarea mea despre</text>
      <text x="72" y="206">circuitul apei în natură, pentru tema de</text>
      <text x="72" y="226">săptămâna aceasta.</text>
      <text x="72" y="262">Am folosit imagini de pe pixabay.com și am</text>
      <text x="72" y="282">trecut sursele în ultimul diapozitiv.</text>
      <text x="72" y="332">Vă mulțumesc!</text>
      <text x="72" y="372" font-weight="800">Andrei Ionescu, clasa a VI-a B</text>
    </g>
    <rect x="72" y="404" width="290" height="40" rx="8" fill="#FFF0DB" stroke="#F29A1F" stroke-width="2"/>
    <path d="M90 414v16a5 5 0 0 0 10 0v-18a3 3 0 0 0-6 0v16" fill="none" stroke="#171416" stroke-width="2" stroke-linecap="round"/>
    <text x="110" y="429" font-size="13">Prezentare_apa_Andrei_6B.pptx</text>
    <rect x="384" y="456" width="180" height="36" rx="18" fill="#14A39A"/>
    <text x="474" y="479" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">Recitește, apoi Trimite</text>

    <!-- legendă -->
    <text x="610" y="62" font-size="20" font-weight="800">Un e-mail politicos</text>
    <g font-size="14">
      <text x="610" y="100" font-weight="800" fill="#0E7F96">1  Subiect clar</text>
      <text x="630" y="118" font-size="13" fill="#6B6460">în câteva cuvinte</text>
      <text x="610" y="150" font-weight="800" fill="#F21F4B">2  Formulă de adresare</text>
      <text x="630" y="168" font-size="13" fill="#6B6460">potrivită destinatarului</text>
      <text x="610" y="200" font-weight="800" fill="#0B6F68">3  Cuprins scurt</text>
      <text x="630" y="218" font-size="13" fill="#6B6460">în paragrafe, cu diacritice</text>
      <text x="610" y="250" font-weight="800" fill="#F29A1F">4  Încheiere</text>
      <text x="630" y="268" font-size="13" fill="#6B6460">în ton cu adresarea</text>
      <text x="610" y="300" font-weight="800" fill="#C8133A">5  Semnătură</text>
      <text x="630" y="318" font-size="13" fill="#6B6460">obligatoriu numele tău</text>
      <text x="610" y="350" font-weight="800" fill="#0B6F68">6  Atașament cu nume sugestiv</text>
      <text x="630" y="368" font-size="13" fill="#6B6460">sub 10 MB în total</text>
    </g>
    <rect x="606" y="392" width="314" height="112" rx="14" fill="#FDE7EC"/>
    <text x="624" y="420" font-size="15" font-weight="800" fill="#C8133A">De evitat</text>
    <text x="624" y="444" font-size="13">MAJUSCULE peste tot (par strigăte)</text>
    <text x="624" y="464" font-size="13">greșeli, prescurtări, limbaj urât</text>
    <text x="624" y="484" font-size="13">prea multe culori în text</text>
  </g>
</svg>
