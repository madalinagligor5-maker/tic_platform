" fill="#fff" stroke="#C9C3BC" stroke-width="1.5"/><text x="748" y="350" font-size="14" font-weight="700">rezultat</text><rect x="812.6717987060547" y="334" width="30" height="22" rx="6" fill="#FF8C1A"/><text x="827.6717987060547" y="350" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="805" y="400" font-size="15" font-weight="800" fill="#0B6F68" text-anchor="middle">1 + 1 = 2</text><rect x="30" y="440" width="900" height="72" rx="14" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/><text x="50" y="470" font-size="15" font-weight="800">Un răspuns greșit nu schimbă scorul.</text><text x="50" y="494" font-size="14">Blocul „modifică” este doar în ramura „atunci”, deci se execută numai când prod = răspuns.</text>
  </g>
</svg>
