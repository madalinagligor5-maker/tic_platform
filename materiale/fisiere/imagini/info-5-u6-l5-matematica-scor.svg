<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Scorul pe trei runde: pornește de la 0, crește cu 1 la fiecare răspuns corect și rămâne la fel la un răspuns greșit</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6460"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
<text x="480" y="44" font-size="24" font-weight="800" text-anchor="middle">Cum crește scorul: variabila rezultat</text><path d="M30 84C55 62 100 62 125 84H215.4859619140625Q219.4859619140625 84 219.4859619140625 88V122Q219.4859619140625 126 215.4859619140625 126H78l-8 8h-16l-8 -8H34Q30 126 30 122Z" fill="#FFBF00" stroke="#CC9900" stroke-width="1.5"/><text x="40" y="112" font-size="15" font-weight="700" fill="#fff">când se dă clic pe</text><path d="M188.4859619140625 117V98" stroke="#45993D" stroke-width="2.5" stroke-linecap="round"/><path d="M189.4859619140625 98c5-3 9 3 15 0v10c-6 3-10-3-15 0z" fill="#4CBF56" stroke="#45993D" stroke-width="1.5"/><path d="M30 130Q30 126 34 126H46l8 8h16l8 -8H260.08592224121094Q264.08592224121094 126 264.08592224121094 130V162Q264.08592224121094 166 260.08592224121094 166H78l-8 8h-16l-8 -8H34Q30 166 30 162Z" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="40" y="151" font-size="15" font-weight="700" fill="#fff">setează</text><rect x="105.59541320800781" y="133" width="92.72041320800781" height="26" rx="5" fill="#DB6E00"/><text x="114.59541320800781" y="151" font-size="15" font-weight="700" fill="#fff">rezultat</text><path d="M180.31582641601562 143h10l-5 6z" fill="#fff"/><text x="204.31582641601562" y="151" font-size="15" font-weight="700" fill="#fff">la</text><rect x="224.08592224121094" y="133" width="28" height="26" rx="13" fill="#fff" stroke="#DB6E00" stroke-width="1"/><text x="238.08592224121094" y="151" font-size="14" font-weight="700" fill="#575E75" text-anchor="middle">0</text><text x="330" y="118" font-size="15" font-weight="700" fill="#6B6460">La pornire, scorul este 0.</text><path d="M560 88Q560 84 564 84H576l8 8h16l8 -8H804.8910217285156Q808.8910217285156 84 808.8910217285156 88V120Q808.8910217285156 124 804.8910217285156 124H608l-8 8h-16l-8 -8H564Q560 124 560 120Z" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="570" y="109" font-size="15" font-weight="700" fill="#fff">modifică</text><rect x="64