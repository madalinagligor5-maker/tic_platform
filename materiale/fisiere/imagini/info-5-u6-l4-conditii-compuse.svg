  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
<text x="480" y="44" font-size="24" font-weight="800" text-anchor="middle">Condiții care nu au bloc propriu în Scratch</text><text x="480" y="72" font-size="15" fill="#6B6460" text-anchor="middle">Le construiești din blocurile &lt;, &gt;, =, sau, nu</text><rect x="30" y="92" width="900" height="150" rx="16" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><rect x="50" y="135" width="150" height="64" rx="12" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/><text x="125" y="175" font-size="22" font-weight="800" text-anchor="middle">a &gt;= b</text><path d="M212 167H252" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="268" y="122" font-size="15" font-weight="700" fill="#6B6460">a mai mare sau egal cu b:</text><path d="M268 156l22 -22h300.70558166503906l22 22l-22 22h-300.70558166503906z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><path d="M292 156l18 -18h92.59019470214844l18 18l-18 18h-92.59019470214844z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><rect x="312" y="142" width="33.25506591796875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="324" y="161" font-size="15" font-weight="700" fill="#fff">a</text><text x="351.25506591796875" y="161" font-size="15" font-weight="700" fill="#fff">&gt;</text><rect x="366.24012756347656" y="142" width="34.350067138671875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="378.24012756347656" y="161" font-size="15" font-weight="700" fill="#fff">b</text><text x="426.59019470214844" y="161" font-size="15" font-weight="700" fill="#fff">sau</text><path d="M460.1153869628906 156l18 -18h92.59019470214844l18 18l-18 18h-92.59019470214844z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><rect x="480.1153869628906" y="142" width="33.25506591796875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="492.1153869628906" y="161" font-size="15" font-weight="700" fill="#fff">a</text><text x="519.3704528808594" y="161" font-size="15" font-weight="700" fill="#fff">=</text><rect x="534.3555145263672" y="142" width="34.350067138671875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="546.3555145263672" y="161" font-size="15" font-weight="700" fill="#fff">b</text><text x="268" y="212" font-size="14" fill="#6B6460">sau, la fel de bine:</text><path d="M403.1014862060547 207l22 -22h159.2603302001953l22 22l-22 22h-159.2603302001953z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><text x="427.1014862060547" y="212" font-size="15" font-weight="700" fill="#fff">nu</text><path d="M453.77162170410156 207l18 -18h92.59019470214844l18 18l-18 18h-92.59019470214844z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><rect x="473.77162170410156" y="193" width="33.25506591796875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="485.77162170410156" y="212" font-size="15" font-weight="700" fill="#fff">a</text><text x="513.0266876220703" y="212" font-size="15" font-weight="700" fill="#fff">&lt;</text><rect x="528.0117492675781" y="193" width="34.350067138671875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="540.0117492675781" y="212" font-size="15" font-weight="700" fill="#fff">b</text><rect x="30" y="254" width="900" height="100" rx="16" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><rect x="50" y="272" width="150" height="64" rx="12" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/><text x="125" y="312" font-size="22" font-weight="800" text-anchor="middle">a &lt;= b</text><path d="M212 304H252" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="268" y="284" font-size="15" font-weight="700" fill="#6B6460">a mai mic sau egal cu b:</text><path d="M268 318l22 -22h159.2603302001953l22 22l-22 22h-159.2603302001953z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><text x="292" y="323" font-size="15" font-weight="700" fill="#fff">nu</text><path d="M318.6701354980469 318l18 -18h92.59019470214844l18 18l-18 18h-92.59019470214844z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><rect x="338.6701354980469" y="304" width="33.25506591796875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="350.6701354980469" y="323" font-size="15" font-weight="700" fill="#fff">a</text><text x="377.9252014160156" y="323" font-size="15" font-weight="700" fill="#fff">&gt;</text><rect x="392.91026306152344" y="304" width="34.350067138671875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="404.91026306152344" y="323" font-size="15" font-weight="700" fill="#fff">b</text><rect x="30" y="366" width="900" height="100" rx="16" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><rect x="50" y="384" width="150" height="64" rx="12" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/><text x="125" y="424" font-size="22" font-weight="800" text-anchor="middle">a &lt;&gt; b</text><path d="M212 416H252" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="268" y="396" font-size="15" font-weight="700" fill="#6B6460">a diferit de b:</text><path d="M268 430l22 -22h159.2603302001953l22 22l-22 22h-159.2603302001953z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><text x="292" y="435" font-size="15" font-weight="700" fill="#fff">nu</text><path d="M318.6701354980469 430l18 -18h92.59019470214844l18 18l-18 18h-92.59019470214844z" fill="#59C059" stroke="#389438" stroke-width="1.5"/><rect x="338.6701354980469" y="416" width="33.25506591796875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="350.6701354980469" y="435" font-size="15" font-weight="700" fill="#fff">a</text><text x="377.9252014160156" y="435" font-size="15" font-weight="700" fill="#fff">=</text><rect x="392.91026306152344" y="416" width="34.350067138671875" height="28" rx="14" fill="#FF8C1A" stroke="#DB6E00" stroke-width="1.5"/><text x="404.91026306152344" y="435" font-size="15" font-weight="700" fill="#fff">b</text><rect x="30" y="478" width="900" height="46" rx="14" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="480" y="507" font-size="15" font-weight="700" fill="#0B6F68" text-anchor="middle">Exemplu: a = 34, b = 34 → (a &gt; b) sau (a = b) = Fals sau Adevărat = Adevărat</text>
