<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Formele în Paint: cu tasta Shift elipsa devine cerc, dreptunghiul devine pătrat și linia devine dreaptă; conturul are Culoarea 1, iar umplerea are Culoarea 2</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6460"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Formele și tasta Shift</text>

    <!-- coloana Shift -->
    <rect x="40" y="76" width="540" height="438" rx="20" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="150" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#6B6460">fără Shift</text>
    <text x="460" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#0E7F96">cu Shift apăsat</text>
    <!-- tasta Shift -->
    <rect x="256" y="88" width="88" height="34" rx="8" fill="#FFFFFF" stroke="#171416" stroke-width="2.5"/>
    <text x="300" y="111" text-anchor="middle" font-size="15" font-weight="800">⇧ Shift</text>

    <!-- elipsa -->
    <ellipse cx="150" cy="190" rx="80" ry="44" fill="none" stroke="#171416" stroke-width="4"/>
    <path d="M250 190H350" stroke="#6B6460" stroke-width="3" marker-end="url(#a)"/>
    <circle cx="460" cy="190" r="50" fill="none" stroke="#0E7F96" stroke-width="5"/>
    <text x="150" y="258" text-anchor="middle" font-size="15">elipsă</text>
    <text x="460" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#0E7F96">cerc</text>

    <!-- dreptunghi -->
    <rect x="70" y="290" width="160" height="80" rx="2" fill="none" stroke="#171416" stroke-width="4"/>
    <path d="M250 330H350" stroke="#6B6460" stroke-width="3" marker-end="url(#a)"/>
    <rect x="415" y="285" width="90" height="90" rx="2" fill="none" stroke="#0E7F96" stroke-width="5"/>
    <text x="150" y="394" text-anchor="middle" font-size="15">dreptunghi</text>
    <text x="460" y="398" text-anchor="middle" font-size="15" font-weight="800" fill="#0E7F96">pătrat</text>

    <!-- linie -->
    <path d="M76 470C110 430 160 490 224 446" fill="none" stroke="#171416" stroke-width="4" stroke-linecap="round"/>
    <path d="M250 460H350" stroke="#6B6460" stroke-width="3" marker-end="url(#a)"/>
    <path d="M400 460H520" stroke="#0E7F96" stroke-width="5" stroke-linecap="round"/>
    <text x="150" y="500" text-anchor="middle" font-size="15">linie oarecare</text>
    <text x="460" y="492" text-anchor="middle" font-size="15" font-weight="800" fill="#0E7F96">linie dreaptă</text>

    <!-- contur si umplere -->
    <rect x="600" y="76" width="320" height="438" rx="20" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <text x="760" y="110" text-anchor="middle" font-size="18" font-weight="800">Contur și umplere</text>
    <rect x="660" y="134" width="200" height="110" rx="18" fill="#3EC6E0" stroke="#F21F4B" stroke-width="10"/>
    <g font-size="15">
      <rect x="624" y="270" width="26" height="26" rx="5" fill="#F21F4B" stroke="#171416" stroke-width="2"/>
      <text x="662" y="282" font-weight="800">Conturul</text>
      <text x="662" y="302">Culoarea 1, cu grosimea de</text>
      <text x="662" y="322">la Dimensiune</text>
      <rect x="624" y="346" width="26" height="26" rx="5" fill="#3EC6E0" stroke="#171416" stroke-width="2"/>
      <text x="662" y="358" font-weight="800">Umplerea</text>
      <text x="662" y="378">Culoarea 2: culoare unică,</text>
      <text x="662" y="398">creion cerat, acuarelă etc.</text>
    </g>
    <rect x="620" y="420" width="280" height="76" rx="14" fill="#FFF4D6"/>
    <text x="760" y="450" text-anchor="middle" font-size="14">Cât timp forma e selectată, o</text>
    <text x="760" y="472" text-anchor="middle" font-size="14">poți schimba. Un clic afară o fixează.</text>
  </g>
</svg>
