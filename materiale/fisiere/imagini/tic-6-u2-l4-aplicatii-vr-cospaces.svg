<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Cei șase pași ai unui proiect de realitate virtuală în CoSpaces Edu</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="52" text-anchor="middle" font-size="22" font-weight="800">Pașii unui proiect în CoSpaces Edu</text>

    <g fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3">
      <rect x="40" y="76" width="270" height="208" rx="16"/><rect x="345" y="76" width="270" height="208" rx="16"/><rect x="650" y="76" width="270" height="208" rx="16"/>
      <rect x="40" y="302" width="270" height="208" rx="16"/><rect x="345" y="302" width="270" height="208" rx="16"/><rect x="650" y="302" width="270" height="208" rx="16"/>
    </g>
    <path d="M314 180H338" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/><path d="M314 406H338" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/><path d="M619 180H643" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/><path d="M619 406H643" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="68" cy="104" r="15" fill="#171416"/><text x="68" y="109">1</text>
      <circle cx="373" cy="104" r="15" fill="#171416"/><text x="373" y="109">2</text>
      <circle cx="678" cy="104" r="15" fill="#171416"/><text x="678" y="109">3</text>
      <circle cx="68" cy="330" r="15" fill="#171416"/><text x="68" y="335">4</text>
      <circle cx="373" cy="330" r="15" fill="#171416"/><text x="373" y="335">5</text>
      <circle cx="678" cy="330" r="15" fill="#171416"/><text x="678" y="335">6</text>
    </g>

    <!-- 1 mediu -->
    <path d="M125 166A50 50 0 0 1 225 166Z" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <path d="M110 166H240" stroke="#14A39A" stroke-width="4" stroke-linecap="round"/>
    <rect x="163" y="140" width="24" height="16" rx="3" fill="#171416"/><circle cx="175" cy="148" r="4" fill="#3EC6E0"/>
    <text x="175" y="206" text-anchor="middle" font-size="16" font-weight="800">Mediul</text>
    <text x="175" y="230" text-anchor="middle" font-size="13" fill="#6B6460">Environment: mediu gata făcut</text>
    <text x="175" y="249" text-anchor="middle" font-size="13" fill="#6B6460">sau imagine 2D / 360°, sunet</text>

    <!-- 2 biblioteca -->
    <rect x="436" y="140" width="8" height="26" fill="#6B6460"/><circle cx="440" cy="130" r="18" fill="#14A39A"/>
    <circle cx="512" cy="126" r="10" fill="#F29A1F"/><rect x="500" y="138" width="24" height="28" rx="8" fill="#F21F4B"/>
    <path d="M415 166H545" stroke="#14A39A" stroke-width="4" stroke-linecap="round"/>
    <text x="480" y="206" text-anchor="middle" font-size="16" font-weight="800">Umplerea scenei</text>
    <text x="480" y="230" text-anchor="middle" font-size="13" fill="#6B6460">Library: tragi obiecte și</text>
    <text x="480" y="249" text-anchor="middle" font-size="13" fill="#6B6460">personaje 3D, cu animații</text>

    <!-- 3 obiecte proprii -->
    <rect x="752" y="136" width="30" height="30" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/>
    <rect x="786" y="136" width="30" height="30" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/>
    <path d="M769 132L784 110L799 132Z" fill="#F29A1F" stroke="#C8133A" stroke-width="3" stroke-linejoin="round"/>
    <text x="785" y="206" text-anchor="middle" font-size="16" font-weight="800">Obiecte proprii</text>
    <text x="785" y="230" text-anchor="middle" font-size="13" fill="#6B6460">imporți fișiere .stl, .obj sau</text>
    <text x="785" y="249" text-anchor="middle" font-size="13" fill="#6B6460">construiești din Building</text>

    <!-- 4 text -->
    <path d="M118 346h70a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8h-44l-14 12v-12h-12a8 8 0 0 1-8-8v-26a8 8 0 0 1 8-8z" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <rect x="124" y="358" width="54" height="6" rx="3" fill="#F29A1F"/><rect x="124" y="370" width="40" height="6" rx="3" fill="#F29A1F"/>
    <rect x="204" y="352" width="40" height="40" rx="6" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="224" y="379" text-anchor="middle" font-size="18" font-weight="800" fill="#0B6F68">i</text>
    <text x="175" y="432" text-anchor="middle" font-size="16" font-weight="800">Textul</text>
    <text x="175" y="456" text-anchor="middle" font-size="13" fill="#6B6460">marcaje, panouri de informații,</text>
    <text x="175" y="475" text-anchor="middle" font-size="13" fill="#6B6460">bule de vorbire, nume</text>

    <!-- 5 play -->
    <circle cx="444" cy="372" r="26" fill="#14A39A"/><path d="M436 358l22 14-22 14z" fill="#FFFFFF"/>
    <rect x="490" y="356" width="68" height="32" rx="12" fill="#171416"/>
    <circle cx="509" cy="372" r="8" fill="#3EC6E0"/><circle cx="539" cy="372" r="8" fill="#3EC6E0"/>
    <text x="480" y="432" text-anchor="middle" font-size="16" font-weight="800">Rularea: Play</text>
    <text x="480" y="456" text-anchor="middle" font-size="13" fill="#6B6460">intri în spațiul creat; pe telefon,</text>
    <text x="480" y="475" text-anchor="middle" font-size="13" fill="#6B6460">View in VR, cu ochelari VR</text>

    <!-- 6 share -->
    <rect x="736" y="344" width="56" height="56" rx="4" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <g fill="#171416">
      <rect x="742" y="350" width="14" height="14"/><rect x="772" y="350" width="14" height="14"/><rect x="742" y="380" width="14" height="14"/>
      <rect x="762" y="366" width="6" height="6"/><rect x="774" y="378" width="6" height="6"/><rect x="782" y="388" width="6" height="6"/><rect x="762" y="386" width="6" height="6"/>
    </g>
    <rect x="806" y="356" width="28" height="16" rx="8" fill="none" stroke="#C8133A" stroke-width="3"/>
    <rect x="822" y="372" width="28" height="16" rx="8" fill="none" stroke="#C8133A" stroke-width="3"/>
    <text x="785" y="432" text-anchor="middle" font-size="16" font-weight="800">Distribuirea: Share</text>
    <text x="785" y="456" text-anchor="middle" font-size="13" fill="#6B6460">se generează un cod QR și un</text>
    <text x="785" y="475" text-anchor="middle" font-size="13" fill="#6B6460">link pentru cei care îl văd</text>
  </g>
</svg>
