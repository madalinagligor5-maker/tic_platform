<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Codul HTML al unei pagini (corpul body cu un titlu, două paragrafe și o imagine) și pagina afișată de browser</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="800">Ce scrii în HTML și ce vede vizitatorul</text>
    <!-- Codul -->
    <rect x="30" y="66" width="440" height="440" rx="16" fill="#1F2430"/>
    <text x="52" y="94" font-size="14" font-weight="800" fill="#FFD166">pagina.html (editorul de text)</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#E8E8E8">
      <text x="52" y="128"><tspan fill="#7FD1F7">&lt;html&gt;</tspan></text>
      <text x="52" y="152"><tspan fill="#7FD1F7">&lt;head&gt;</tspan>&lt;title&gt;Delta&lt;/title&gt;<tspan fill="#7FD1F7">&lt;/head&gt;</tspan></text>
      <text x="52" y="182"><tspan fill="#9BE58C" font-weight="700">&lt;body</tspan> <tspan fill="#F7A072">style="background-color:#EAF6FF"</tspan><tspan fill="#9BE58C" font-weight="700">&gt;</tspan></text>
      <text x="72" y="210"><tspan fill="#FF9EB5">&lt;h1&gt;</tspan>Delta Dunării<tspan fill="#FF9EB5">&lt;/h1&gt;</tspan></text>
      <text x="72" y="238"><tspan fill="#FFD166">&lt;p&gt;</tspan>Aici trăiesc peste</text>
      <text x="72" y="258">300 de specii de <tspan fill="#C9A7FF">&lt;strong&gt;</tspan>păsări<tspan fill="#C9A7FF">&lt;/strong&gt;</tspan>.<tspan fill="#FFD166">&lt;/p&gt;</tspan></text>
      <text x="72" y="290"><tspan fill="#FFD166">&lt;p</tspan> <tspan fill="#F7A072">style="color:green"</tspan><tspan fill="#FFD166">&gt;</tspan></text>
      <text x="92" y="310">Este <tspan fill="#C9A7FF">&lt;em&gt;</tspan>rezervație<tspan fill="#C9A7FF">&lt;/em&gt;</tspan>.<tspan fill="#FFD166">&lt;/p&gt;</tspan></text>
      <text x="72" y="342"><tspan fill="#7FE0D0">&lt;img</tspan> <tspan fill="#F7A072">src="pelican.jpg"</tspan></text>
      <text x="92" y="362"><tspan fill="#F7A072">alt="Un pelican pe apă"</tspan></text>
      <text x="92" y="382"><tspan fill="#F7A072">width="200"</tspan><tspan fill="#7FE0D0">&gt;</tspan></text>
      <text x="52" y="412"><tspan fill="#9BE58C" font-weight="700">&lt;/body&gt;</tspan></text>
      <text x="52" y="436"><tspan fill="#7FD1F7">&lt;/html&gt;</tspan></text>
    </g>
    <text x="52" y="476" font-size="13" fill="#FFFFFF">Ce e între &lt;body&gt; și &lt;/body&gt; apare pe ecran.</text>
    <path d="M478 286 H516" stroke="#171416" stroke-width="3" marker-end="url(#sag)"/>
    <!-- Browserul -->
    <rect x="524" y="66" width="406" height="440" rx="16" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <rect x="524" y="66" width="406" height="40" rx="16" fill="#E2F6FA"/>
    <circle cx="548" cy="86" r="6" fill="#FF6B6B"/><circle cx="566" cy="86" r="6" fill="#F2C94C"/><circle cx="584" cy="86" r="6" fill="#27AE60"/>
    <rect x="604" y="76" width="300" height="20" rx="10" fill="#FFFFFF"/>
    <text x="616" y="91" font-size="12">pagina.html</text>
    <rect x="540" y="116" width="374" height="376" fill="#EAF6FF"/>
    <text x="556" y="156" font-size="26" font-weight="800">Delta Dunării</text>
    <text x="556" y="192" font-size="15">Aici trăiesc peste 300 de specii de <tspan font-weight="800">păsări</tspan>.</text>
    <text x="556" y="222" font-size="15" fill="#1E8E3E">Este <tspan font-style="italic">rezervație</tspan>.</text>
    <rect x="556" y="240" width="200" height="140" rx="6" fill="#BFE3F2"/>
    <ellipse cx="650" cy="340" rx="70" ry="14" fill="#8CC8E0"/>
    <ellipse cx="650" cy="312" rx="38" ry="20" fill="#FFFFFF" stroke="#171416" stroke-width="2"/>
    <circle cx="684" cy="282" r="12" fill="#FFFFFF" stroke="#171416" stroke-width="2"/>
    <path d="M694 284 L730 296 L694 292 Z" fill="#F29A1F" stroke="#171416" stroke-width="1.5"/>
    <path d="M676 296 Q672 304 668 300" stroke="#171416" stroke-width="2" fill="none"/>
    <text x="770" y="300" font-size="12">imaginea are</text>
    <text x="770" y="318" font-size="12" font-weight="800">200 px lățime</text>
    <text x="556" y="414" font-size="13">body: fundal albastru deschis</text>
    <text x="556" y="436" font-size="13">p: paragrafe · h1: titlu · img: imagine</text>
    <text x="556" y="458" font-size="13">strong: aldin · em: cursiv</text>
  </g>
</svg>
