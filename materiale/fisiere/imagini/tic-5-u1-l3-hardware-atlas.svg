<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">Cum circulă informația</title><desc id="desc">Intrare. Dispozitivele de intrare trimit date către calculator.. Tastatura trimite litera A. Prelucrare. Procesorul execută instrucțiuni folosind memoria de lucru.. Programul pregătește litera pentru afișare. Ieșire. Dispozitivele de ieșire prezintă rezultatul.. Monitorul afișează litera A.</desc><rect width="1080" height="640" rx="24" fill="#FFF7EE"/><g font-family="Arial, sans-serif"><text x="42" y="42" fill="#6B6460" font-size="14" letter-spacing="3">EDUDIGI / ATLAS VIZUAL / 01</text><text x="42" y="89" fill="#171416" font-size="32" font-weight="700"><tspan x="42" dy="0">Cum circulă informația</tspan></text><path d="M42 120H1038" stroke="#E8DFD3"/><rect x="42" y="150" width="316" height="438" rx="18" fill="#FDE7EC"/><circle cx="90" cy="202" r="25" fill="#C8133A"/><text x="90" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><path d="M326 202h42m-8-7 8 7-8 7" stroke="#C8133A" stroke-width="2" fill="none"/><text x="66" y="270" fill="#C8133A" font-size="25" font-weight="700"><tspan x="66" dy="0">Intrare</tspan></text><text x="66" y="337" fill="#171416" font-size="21" font-weight="400"><tspan x="66" dy="0">Dispozitivele de intrare</tspan><tspan x="66" dy="29.4">trimit date către</tspan><tspan x="66" dy="29.4">calculator.</tspan></text><path d="M66 438h268" stroke="#C8133A" opacity=".3"/><text x="66" y="466" font-size="13" fill="#C8133A" letter-spacing="2">ÎN PRACTICĂ</text><text x="66" y="498" fill="#171416" font-size="19" font-weight="400"><tspan x="66" dy="0">Tastatura trimite litera A.</tspan></text><rect x="382" y="150" width="316" height="438" rx="18" fill="#E2F6FA"/><circle cx="430" cy="202" r="25" fill="#0E7F96"/><text x="430" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><path d="M666 202h42m-8-7 8 7-8 7" stroke="#0E7F96" str