<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Calculul sumei, al sumei notelor de trecere, al contorului și al produsului pentru notele 8 4 10 7 3 10</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="800">Suma pornește de la 0, produsul de la 1</text>
    <text x="40" y="104" font-size="16" font-weight="800">nota</text>
    <text x="230" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#6B6460">start</text>
    <rect x="300" y="78" width="60" height="42" rx="10" fill="#F1E9DF"/><text x="330" y="106" text-anchor="middle" font-size="18" font-weight="800">8</text>
    <rect x="395" y="78" width="60" height="42" rx="10" fill="#F1E9DF"/><text x="425" y="106" text-anchor="middle" font-size="18" font-weight="800">4</text>
    <rect x="490" y="78" width="60" height="42" rx="10" fill="#F1E9DF"/><text x="520" y="106" text-anchor="middle" font-size="18" font-weight="800">10</text>
    <rect x="585" y="78" width="60" height="42" rx="10" fill="#F1E9DF"/><text x="615" y="106" text-anchor="middle" font-size="18" font-weight="800">7</text>
    <rect x="680" y="78" width="60" height="42" rx="10" fill="#F1E9DF"/><text x="710" y="106" text-anchor="middle" font-size="18" font-weight="800">3</text>
    <rect x="775" y="78" width="60" height="42" rx="10" fill="#F1E9DF"/><text x="805" y="106" text-anchor="middle" font-size="18" font-weight="800">10</text>
    <rect x="30" y="144" width="900" height="52" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="44" y="168" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">s</text><text x="44" y="186" font-size="13" fill="#6B6460">toate notele</text>
    <rect x="200" y="152" width="60" height="36" rx="10" fill="#3EC6E0"/><text x="230" y="176" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">0</text>
    <rect x="298" y="152" width="64" height="36" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="330" y="176" text-anchor="middle" font-size="16" font-weight="800">8</text>
    <rect x="393" y="152" width="64" height="36" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="425" y="176" text-anchor="middle" font-size="16" font-weight="800">12</text>
    <rect x="488" y="152" width="64" height="36" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="520" y="176" text-anchor="middle" font-size="16" font-weight="800">22</text>
    <rect x="583" y="152" width="64" height="36" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="615" y="176" text-anchor="middle" font-size="16" font-weight="800">29</text>
    <rect x="678" y="152" width="64" height="36" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="710" y="176" text-anchor="middle" font-size="16" font-weight="800">32</text>
    <rect x="773" y="152" width="64" height="36" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="805" y="176" text-anchor="middle" font-size="16" font-weight="800">42</text>
    <rect x="30" y="206" width="900" height="52" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="44" y="230" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">s5</text><text x="44" y="248" font-size="13" fill="#6B6460">note ≥ 5</text>
    <rect x="200" y="214" width="60" height="36" rx="10" fill="#14A39A"/><text x="230" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">0</text>
    <rect x="298" y="214" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="330" y="238" text-anchor="middle" font-size="16" font-weight="800">8</text>
    <text x="425" y="238" text-anchor="middle" font-size="16" fill="#6B6460">8</text>
    <rect x="488" y="214" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="520" y="238" text-anchor="middle" font-size="16" font-weight="800">18</text>
    <rect x="583" y="214" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="615" y="238" text-anchor="middle" font-size="16" font-weight="800">25</text>
    <text x="710" y="238" text-anchor="middle" font-size="16" fill="#6B6460">25</text>
    <rect x="773" y="214" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="805" y="238" text-anchor="middle" font-size="16" font-weight="800">35</text>
    <rect x="30" y="268" width="900" height="52" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="44" y="292" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">k5</text><text x="44" y="310" font-size="13" fill="#6B6460">câte note ≥ 5</text>
    <rect x="200" y="276" width="60" height="36" rx="10" fill="#14A39A"/><text x="230" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">0</text>
    <rect x="298" y="276" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="330" y="300" text-anchor="middle" font-size="16" font-weight="800">1</text>
    <text x="425" y="300" text-anchor="middle" font-size="16" fill="#6B6460">1</text>
    <rect x="488" y="276" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="520" y="300" text-anchor="middle" font-size="16" font-weight="800">2</text>
    <rect x="583" y="276" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="615" y="300" text-anchor="middle" font-size="16" font-weight="800">3</text>
    <text x="710" y="300" text-anchor="middle" font-size="16" fill="#6B6460">3</text>
    <rect x="773" y="276" width="64" height="36" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="805" y="300" text-anchor="middle" font-size="16" font-weight="800">4</text>
    <rect x="30" y="330" width="900" height="52" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="44" y="354" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">p10</text><text x="44" y="372" font-size="13" fill="#6B6460">produsul notelor de 10</text>
    <rect x="200" y="338" width="60" height="36" rx="10" fill="#F29A1F"/><text x="230" y="362" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
    <text x="330" y="362" text-anchor="middle" font-size="16" fill="#6B6460">1</text>
    <text x="425" y="362" text-anchor="middle" font-size="16" fill="#6B6460">1</text>
    <rect x="488" y="338" width="64" height="36" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="520" y="362" text-anchor="middle" font-size="16" font-weight="800">10</text>
    <text x="615" y="362" text-anchor="middle" font-size="16" fill="#6B6460">10</text>
    <text x="710" y="362" text-anchor="middle" font-size="16" fill="#6B6460">10</text>
    <rect x="773" y="338" width="64" height="36" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="805" y="362" text-anchor="middle" font-size="16" font-weight="800">100</text>
    <rect x="30" y="406" width="900" height="56" rx="12" fill="#E0F4F2"/>
    <text x="50" y="440" font-size="16" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">media = (double) s5 / k5 = 35 / 4 = 8.75</text>
    <text x="910" y="440" text-anchor="end" font-size="14" font-weight="700" fill="#0B6F68">împărțire reală, doar dacă k5 &gt; 0</text>
    <text x="480" y="496" text-anchor="middle" font-size="14" fill="#6B6460">Produsul crește foarte repede: folosește long long (int păstrează doar până la aproximativ 2 miliarde).</text>
  </g>
</svg>
