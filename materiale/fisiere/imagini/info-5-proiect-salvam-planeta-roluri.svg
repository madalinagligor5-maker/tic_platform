<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Cele patru roluri din echipă: scenarist, desenator, programator și sunetist și cei opt pași ai proiectului Salvăm planeta</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6460"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
<text x="480" y="44" font-size="24" font-weight="800" text-anchor="middle">Echipa și pașii proiectului</text><rect x="30" y="70" width="212" height="170" rx="16" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="3"/><g transform="translate(136 120) scale(1.1)"><circle cx="0" cy="-18" r="12" fill="#fff" stroke="#171416" stroke-width="2.5"/><path d="M-18 16v-6a18 16 0 0 1 36 0v6z" fill="#fff" stroke="#171416" stroke-width="2.5"/></g><text x="136" y="176" font-size="17" font-weight="800" fill="#7A3FB8" text-anchor="middle">Scenaristul</text><text x="136" y="200" font-size="14" text-anchor="middle">scrie povestea: personaje,</text><text x="136" y="220" font-size="14" text-anchor="middle">decoruri, replici, ordine</text><rect x="258" y="70" width="212" height="170" rx="16" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><g transform="translate(364 120) scale(1.1)"><circle cx="0" cy="-18" r="12" fill="#fff" stroke="#171416" stroke-width="2.5"/><path d="M-18 16v-6a18 16 0 0 1 36 0v6z" fill="#fff" stroke="#171416" stroke-width="2.5"/></g><text x="364" y="176" font-size="17" font-weight="800" fill="#F21F4B" text-anchor="middle">Desenatorul</text><text x="364" y="200" font-size="14" text-anchor="middle">desenează sau alege</text><text x="364" y="220" font-size="14" text-anchor="middle">personajele și decorurile</text><rect x="486" y="70" width="212" height="170" rx="16" fill="#FFF4D6" stroke="#CF8B17" stroke-width="3"/><g transform="translate(592 120) scale(1.1)"><circle cx="0" cy="-18" r="12" fill="#fff" stroke="#171416" stroke-width="2.5"/><path d="M-18 16v-6a18 16 0 0 1 36 0v6z" fill="#fff" stroke="#171416" stroke-width="2.5"/></g><text x="592" y="176" font-size="17" font-weight="800" fill="#CF8B17" text-anchor="middle">Programatorul</text><text x="592" y="200" font-size="14" text-anchor="middle">face scripturile</text><text x="592" y="220" font-size="14" text-anchor="middle">în Scratch</text><rect x="714" y="70" width="212" height="170" rx="16" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><g transform="translate(820 120) scale(1.1)"><circle cx="0" cy="-18" r="12" fill="#fff" stroke="#171416" stroke-width="2.5"/><path d="M-18 16v-6a18 16 0 0 1 36 0v6z" fill="#fff" stroke="#171416" stroke-width="2.5"/></g><text x="820" y="176" font-size="17" font-weight="800" fill="#0E7F96" text-anchor="middle">Sunetistul</text><text x="820" y="200" font-size="14" text-anchor="middle">alege sau înregistrează</text><text x="820" y="220" font-size="14" text-anchor="middle">sunetele</text><rect x="30" y="268" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="56" cy="300" r="14" fill="#14A39A"/><text x="56" y="305" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="80" y="305" font-size="14" font-weight="700">Planul de lucru</text><path d="M244 300H256" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="258" y="268" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="284" cy="300" r="14" fill="#14A39A"/><text x="284" y="305" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="308" y="305" font-size="14" font-weight="700">Ideile tuturor</text><path d="M472 300H484" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="486" y="268" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="512" cy="300" r="14" fill="#14A39A"/><text x="512" y="305" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="536" y="296" font-size="14" font-weight="700">Documentarea</text><text x="536" y="314" font-size="14" font-weight="700">(cu sursele!)</text><path d="M700 300H712" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="714" y="268" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="740" cy="300" r="14" fill="#14A39A"/><text x="740" y="305" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="764" y="296" font-size="14" font-weight="700">Împărțirea</text><text x="764" y="314" font-size="14" font-weight="700">rolurilor</text><rect x="30" y="350" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="56" cy="382" r="14" fill="#14A39A"/><text x="56" y="387" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="80" y="387" font-size="14" font-weight="700">Scenariul</text><path d="M244 382H256" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="258" y="350" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="284" cy="382" r="14" fill="#14A39A"/><text x="284" y="387" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="308" y="378" font-size="14" font-weight="700">Programul</text><text x="308" y="396" font-size="14" font-weight="700">în Scratch</text><path d="M472 382H484" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="486" y="350" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="512" cy="382" r="14" fill="#14A39A"/><text x="512" y="387" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="536" y="378" font-size="14" font-weight="700">Testare și</text><text x="536" y="396" font-size="14" font-weight="700">îmbunătățire</text><path d="M700 382H712" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="714" y="350" width="212" height="64" rx="14" fill="#fff" stroke="#E8DFD3" stroke-width="3"/><circle cx="740" cy="382" r="14" fill="#14A39A"/><text x="740" y="387" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="764" y="387" font-size="14" font-weight="700">Prezentarea</text><rect x="30" y="446" width="900" height="66" rx="14" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/><text x="50" y="474" font-size="15" font-weight="800">Drepturile de autor:</text><text x="50" y="496" font-size="14">folosiți imagini și texte doar cu respectarea lor și treceți mereu sursa la final.</text>
  </g>
</svg>
