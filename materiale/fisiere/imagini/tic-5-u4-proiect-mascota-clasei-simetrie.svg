<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Personaj simetric în Paint: desenezi o jumătate, o copiezi și o lipești, o răstorni orizontal, apoi o lipești lângă prima jumătate</title>
  <defs>
    <g id="half">
      <path d="M0 40H-36Q-50 100-32 112H0z" fill="#3EC6E0" stroke="#171416" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-34 60L-62 86" stroke="#171416" stroke-width="6" stroke-linecap="round"/>
      <path d="M-38 -40L-50 -86L-12 -58z" fill="#7A3FB8" stroke="#171416" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -62A52 52 0 0 0 0 42z" fill="#7A3FB8" stroke="#171416" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-22" cy="-16" r="11" fill="#FFFFFF" stroke="#171416" stroke-width="2.5"/>
      <circle cx="-19" cy="-14" r="5" fill="#171416"/>
      <circle cx="-32" cy="12" r="7" fill="#FDE7EC"/>
      <path d="M0 18Q-10 22-16 16" fill="none" stroke="#171416" stroke-width="3" stroke-linecap="round"/>
      <path d="M-20 112v14h-16" fill="none" stroke="#171416" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Un personaj simetric în 4 pași</text>

    <!-- panouri -->
    <g fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3">
      <rect x="30" y="72" width="210" height="442" rx="20"/>
      <rect x="260" y="72" width="210" height="442" rx="20"/>
      <rect x="490" y="72" width="210" height="442" rx="20"/>
      <rect x="720" y="72" width="210" height="442" rx="20"/>
    </g>
    <g font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      <circle cx="135" cy="104" r="18" fill="#F21F4B"/><text x="135" y="111">1</text>
      <circle cx="365" cy="104" r="18" fill="#FFC83D"/><text x="365" y="111" fill="#171416">2</text>
      <circle cx="595" cy="104" r="18" fill="#3EC6E0"/><text x="595" y="111">3</text>
      <circle cx="825" cy="104" r="18" fill="#14A39A"/><text x="825" y="111">4</text>
    </g>

    <!-- 1 jumatate -->
    <use href="#half" x="160" y="250"/>
    <path d="M160 150V390" stroke="#C8133A" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="135" y="430" text-anchor="middle" font-size="16" font-weight="800">Desenezi</text>
    <text x="135" y="452" text-anchor="middle" font-size="16" font-weight="800">o jumătate</text>
    <text x="135" y="480" text-anchor="middle" font-size="14" fill="#6B6460">forme, culori RGB</text>

    <!-- 2 selectezi copiezi -->
    <use href="#half" x="390" y="250"/>
    <rect x="316" y="152" width="84" height="238" fill="none" stroke="#171416" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="365" y="430" text-anchor="middle" font-size="16" font-weight="800">Selectezi,</text>
    <text x="365" y="452" text-anchor="middle" font-size="16" font-weight="800">copiezi, lipești</text>
    <g font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      <rect x="284" y="466" width="74" height="28" rx="8" fill="#171416"/><text x="321" y="485">Ctrl + C</text>
      <rect x="372" y="466" width="74" height="28" rx="8" fill="#171416"/><text x="409" y="485">Ctrl + V</text>
    </g>

    <!-- 3 rasturnare -->
    <use href="#half" transform="translate(570 250) scale(-1 1)"/>
    <path d="M540 150q55-30 110 0" fill="none" stroke="#0E7F96" stroke-width="3"/>
    <path d="M642 140l10 12l-14 4" fill="none" stroke="#0E7F96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="595" y="430" text-anchor="middle" font-size="16" font-weight="800">Rotire →</text>
    <text x="595" y="452" text-anchor="middle" font-size="16" font-weight="800">Răsturnare</text>
    <text x="595" y="474" text-anchor="middle" font-size="16" font-weight="800">orizontală</text>
    <text x="595" y="498" text-anchor="middle" font-size="14" fill="#6B6460">ca în oglindă</text>

    <!-- 4 personaj intreg -->
    <use href="#half" x="825" y="250"/>
    <use href="#half" transform="translate(825 250) scale(-1 1)"/>
    <text x="825" y="430" text-anchor="middle" font-size="16" font-weight="800">Le alipești:</text>
    <text x="825" y="452" text-anchor="middle" font-size="16" font-weight="800">mascota e gata!</text>
    <text x="825" y="480" text-anchor="middle" font-size="14" fill="#6B6460">adaugi și un text</text>
  </g>
</svg>
