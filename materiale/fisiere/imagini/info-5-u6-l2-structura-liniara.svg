<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Programul RoboTIC: două scripturi pornite de evenimente diferite, cu blocuri executate de sus în jos</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <g id="robot">
      <path d="M0 -8v-10" stroke="#171416" stroke-width="3"/><circle cx="0" cy="-20" r="4" fill="#F21F4B"/>
      <rect x="-22" y="-8" width="44" height="32" rx="8" fill="#3EC6E0" stroke="#171416" stroke-width="3"/>
      <circle cx="-9" cy="6" r="4" fill="#171416"/><circle cx="9" cy="6" r="4" fill="#171416"/>
      <rect x="-26" y="28" width="52" height="40" rx="8" fill="#0E7F96" stroke="#171416" stroke-width="3"/>
      <path d="M-12 68v16M12 68v16" stroke="#171416" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Structura liniară: blocurile se execută pe rând</text>

    <!-- script 1 -->
    <text x="40" y="96" font-size="15" font-weight="800">Scriptul 1 <tspan font-weight="400" fill="#6B6460">· pornește la steagul verde</tspan></text>
    <g font-size="14" font-weight="700" fill="#FFFFFF">
      <path d="M40 150v-28c18-20 64-20 82 0h268v28z" fill="#F29A1F"/>
      <text x="54" y="142">când se dă clic pe steagul verde</text>
      <rect x="40" y="150" width="350" height="34" rx="4" fill="#3EC6E0"/>
      <text x="54" y="172" fill="#171416">mergi la x: 24 y: 215</text>
    </g>

    <!-- script 2 -->
    <text x="40" y="232" font-size="15" font-weight="800">Scriptul 2 <tspan font-weight="400" fill="#6B6460">· pornește la tasta Spațiu</tspan></text>
    <g font-size="14" font-weight="700" fill="#FFFFFF">
      <path d="M40 286v-28c18-20 64-20 82 0h298v28z" fill="#F29A1F"/>
      <text x="54" y="278">când tasta spațiu este apăsată</text>
      <rect x="40" y="286" width="380" height="34" rx="4" fill="#3EC6E0"/>
      <text x="54" y="308" fill="#171416">alunecă în 1 secunde la x: 24 y: -51</text>
      <rect x="40" y="320" width="380" height="34" rx="4" fill="#0E7F96"/>
      <text x="54" y="342">spune „Bună! Sunt RoboTIC!” 2 secunde</text>
      <rect x="40" y="354" width="380" height="34" rx="4" fill="#F21F4B"/>
      <text x="54" y="376">pornește sunetul Alien Creak1</text>
    </g>
    <g font-size="14" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="446" cy="303" r="13" fill="#171416"/><text x="446" y="308">1</text>
      <circle cx="446" cy="337" r="13" fill="#171416"/><text x="446" y="342">2</text>
      <circle cx="446" cy="371" r="13" fill="#171416"/><text x="446" y="376">3</text>
    </g>
    <path d="M476 292V384" stroke="#171416" stroke-width="3" marker-end="url(#a)"/>
    <rect x="40" y="420" width="420" height="80" rx="14" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="60" y="452" font-size="15" font-weight="800" fill="#0B6F68">Fiecare script are evenimentul lui.</text>
    <text x="60" y="478" font-size="14">În script, blocurile merg de sus în jos.</text>

    <!-- scena -->
    <rect x="520" y="90" width="400" height="300" rx="8" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <path d="M523 330h394v57h-394z" fill="#E0F4F2"/>
    <g opacity="0.35"><use href="#robot" x="800" y="128"/></g>
    <use href="#robot" x="800" y="246"/>
    <path d="M846 150V262" stroke="#171416" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/>
    <text x="856" y="150" font-size="14" font-weight="700">y: 215</text>
    <text x="856" y="300" font-size="14" font-weight="700">y: -51</text>
    <text x="862" y="214" font-size="13" fill="#6B6460">alunecă</text>
    <path d="M560 222h170a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14h-120l-12 14l-2-14h-36a14 14 0 0 1-14-14v-26a14 14 0 0 1 14-14z" fill="#FFFFFF" stroke="#171416" stroke-width="2.5"/>
    <text x="645" y="254" text-anchor="middle" font-size="15" font-weight="700">Bună! Sunt RoboTIC!</text>
    <text x="720" y="420" text-anchor="middle" font-size="14" fill="#6B6460">Scena: RoboTIC coboară, apoi se prezintă.</text>
  </g>
</svg>
