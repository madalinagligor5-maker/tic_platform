<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Idei pentru exersare în Paint: omul de zăpadă din trei cercuri desenate cu Shift, robotul din dreptunghiuri și linii groase pe o foaie de 150 × 100 px și trei decoruri de 480 × 360 px pentru Scratch</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Cum construiești desenele din forme simple</text>

    <!-- om de zapada -->
    <rect x="30" y="72" width="290" height="442" rx="20" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <text x="175" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#0E7F96">Omul de zăpadă</text>
    <rect x="54" y="122" width="242" height="250" rx="10" fill="#E2F6FA"/>
    <path d="M54 330H296V372H54z" fill="#FFFFFF"/>
    <circle cx="175" cy="300" r="52" fill="#FFFFFF" stroke="#0E7F96" stroke-width="3"/>
    <circle cx="175" cy="220" r="38" fill="#FFFFFF" stroke="#0E7F96" stroke-width="3"/>
    <circle cx="175" cy="158" r="28" fill="#FFFFFF" stroke="#0E7F96" stroke-width="3"/>
    <circle cx="165" cy="152" r="3.5" fill="#171416"/><circle cx="185" cy="152" r="3.5" fill="#171416"/>
    <path d="M175 160l18 5l-18 4z" fill="#F21F4B"/>
    <circle cx="175" cy="208" r="4" fill="#171416"/><circle cx="175" cy="228" r="4" fill="#171416"/>
    <g font-size="14" font-weight="800" fill="#0E7F96">
      <text x="236" y="306">1</text><text x="220" y="214">2</text><text x="209" y="140">3</text>
    </g>
    <text x="175" y="404" text-anchor="middle" font-size="15">3 cercuri: elipsa</text>
    <text x="175" y="424" text-anchor="middle" font-size="15">cu <tspan font-weight="800">Shift</tspan> apăsat</text>
    <rect x="70" y="446" width="210" height="34" rx="10" fill="#E2F6FA"/>
    <text x="175" y="468" text-anchor="middle" font-size="14" font-weight="700">Om_de_zapada.jpg</text>

    <!-- robot -->
    <rect x="335" y="72" width="290" height="442" rx="20" fill="#FFFFFF" stroke="#7A3FB8" stroke-width="3"/>
    <text x="480" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#7A3FB8">Robotul</text>
    <rect x="359" y="122" width="242" height="250" rx="10" fill="#F0E8FA"/>
    <path d="M480 132v18" stroke="#171416" stroke-width="4"/><circle cx="480" cy="130" r="6" fill="#F21F4B"/>
    <rect x="440" y="150" width="80" height="60" rx="6" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <circle cx="462" cy="176" r="7" fill="#3EC6E0"/><circle cx="498" cy="176" r="7" fill="#3EC6E0"/>
    <path d="M464 196h32" stroke="#171416" stroke-width="3"/>
    <rect x="425" y="218" width="110" height="90" rx="6" fill="#7A3FB8"/>
    <rect x="455" y="238" width="50" height="30" rx="4" fill="#FFF4D6"/>
    <path d="M425 230L392 280M535 230L568 280M455 308v44M505 308v44" stroke="#171416" stroke-width="10" stroke-linecap="round"/>
    <text x="480" y="404" text-anchor="middle" font-size="15">dreptunghiuri + linii</text>
    <text x="480" y="424" text-anchor="middle" font-size="15">groase (Dimensiune)</text>
    <rect x="375" y="446" width="210" height="34" rx="10" fill="#F0E8FA"/>
    <text x="480" y="468" text-anchor="middle" font-size="14" font-weight="700">RoboTIC.jpg · 150 × 100 px</text>

    <!-- decoruri -->
    <rect x="640" y="72" width="290" height="442" rx="20" fill="#FFFFFF" stroke="#14A39A" stroke-width="3"/>
    <text x="785" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#0B6F68">Decoruri pentru Scratch</text>
    <!-- decor1 padure -->
    <rect x="664" y="124" width="116" height="87" rx="6" fill="#E0F4F2" stroke="#171416" stroke-width="2"/>
    <path d="M680 196l14-40l14 40zM706 196l14-50l14 50zM734 196l14-36l14 36z" fill="#14A39A"/>
    <!-- decor2 plaja -->
    <rect x="790" y="124" width="116" height="87" rx="6" fill="#E2F6FA" stroke="#171416" stroke-width="2"/>
    <path d="M791 180q28-10 57 0t57 0V210H791z" fill="#3EC6E0"/>
    <path d="M791 196H905V210H791z" fill="#FFF4D6"/>
    <circle cx="880" cy="146" r="12" fill="#FFC83D"/>
    <!-- decor3 oras -->
    <rect x="727" y="240" width="116" height="87" rx="6" fill="#FFF4D6" stroke="#171416" stroke-width="2"/>
    <rect x="740" y="268" width="22" height="58" fill="#6B6460"/>
    <rect x="768" y="254" width="26" height="72" fill="#0E7F96"/>
    <rect x="800" y="280" width="30" height="46" fill="#F21F4B"/>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="722" y="228">decor1</text>
      <text x="848" y="228">decor2</text>
    </g>
    <text x="785" y="346" text-anchor="middle" font-size="14" font-weight="700">decor3</text>
    <text x="785" y="380" text-anchor="middle" font-size="15">pădure, plajă, oraș</text>
    <text x="785" y="404" text-anchor="middle" font-size="15">fiecare de</text>
    <text x="785" y="424" text-anchor="middle" font-size="15" font-weight="800">480 × 360 px</text>
    <rect x="680" y="446" width="210" height="34" rx="10" fill="#E0F4F2"/>
    <text x="785" y="468" text-anchor="middle" font-size="14" font-weight="700">Fișier → Proprietăți</text>
  </g>
</svg>
