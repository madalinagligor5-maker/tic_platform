<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Redimensionarea unei ferestre: tragi de o margine sau de un colț, ținând apăsat butonul stâng al mouse-ului</title>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0E7F96"/></marker>
    <path id="dbl" d="M-20 0l9-8v5h22v-5l9 8l-9 8v-5h-22v5z" fill="#171416" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Cum redimensionezi o fereastră</text>

    <!-- margine -->
    <rect x="30" y="70" width="440" height="350" rx="18" fill="#fff" stroke="#3EC6E0" stroke-width="3"/>
    <rect x="70" y="110" width="330" height="170" rx="6" fill="none" stroke="#0E7F96" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="70" y="110" width="210" height="170" rx="6" fill="#E2F6FA" stroke="#171416" stroke-width="3"/>
    <path d="M71.5 134H278.5" stroke="#171416" stroke-width="3"/>
    <path d="M86 160h120M86 178h150M86 196h90" stroke="#3EC6E0" stroke-width="6" stroke-linecap="round"/>
    <use href="#dbl" transform="translate(280 200) scale(1.5)"/>
    <path d="M306 238H388" stroke="#0E7F96" stroke-width="4" marker-end="url(#s)"/>
    <text x="250" y="330" text-anchor="middle" font-size="18" font-weight="800" fill="#0E7F96">Tragi de o margine</text>
    <text x="250" y="356" text-anchor="middle" font-size="15" font-weight="700">se schimbă o singură dimensiune:</text>
    <text x="250" y="378" text-anchor="middle" font-size="15" font-weight="700">lățimea sau înălțimea</text>

    <!-- colt -->
    <rect x="490" y="70" width="440" height="350" rx="18" fill="#fff" stroke="#14A39A" stroke-width="3"/>
    <rect x="530" y="100" width="340" height="200" rx="6" fill="none" stroke="#0B6F68" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="530" y="100" width="200" height="130" rx="6" fill="#E0F4F2" stroke="#171416" stroke-width="3"/>
    <path d="M531.5 124H728.5" stroke="#171416" stroke-width="3"/>
    <path d="M546 150h110M546 168h140M546 186h80" stroke="#14A39A" stroke-width="6" stroke-linecap="round"/>
    <use href="#dbl" transform="translate(730 230) rotate(45) scale(1.5)"/>
    <path d="M752 252L846 286" stroke="#0E7F96" stroke-width="4" marker-end="url(#s)"/>
    <text x="710" y="330" text-anchor="middle" font-size="18" font-weight="800" fill="#0B6F68">Tragi de un colț</text>
    <text x="710" y="356" text-anchor="middle" font-size="15" font-weight="700">se schimbă ambele dimensiuni</text>
    <text x="710" y="378" text-anchor="middle" font-size="15" font-weight="700">deodată</text>

    <!-- pasi -->
    <rect x="30" y="436" width="900" height="76" rx="16" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/>
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#fff">
      <circle cx="62" cy="474" r="15" fill="#171416"/><text x="62" y="479">1</text>
      <circle cx="352" cy="474" r="15" fill="#171416"/><text x="352" y="479">2</text>
      <circle cx="632" cy="474" r="15" fill="#171416"/><text x="632" y="479">3</text>
    </g>
    <g font-size="15" font-weight="700">
      <text x="86" y="469">pui cursorul pe margine</text><text x="86" y="489">sau pe colț</text>
      <text x="376" y="469">cursorul își schimbă</text><text x="376" y="489">forma în săgeată dublă</text>
      <text x="656" y="469">tragi ținând apăsat</text><text x="656" y="489">butonul stâng al mouse-ului</text>
    </g>
  </g>
</svg>
