<circle cx="-9" cy="6" r="4" fill="#171416"/><circle cx="9" cy="6" r="4" fill="#171416"/>
<rect x="-26" y="28" width="52" height="40" rx="8" fill="#0E7F96" stroke="#171416" stroke-width="3"/>
<path d="M-12 68v16M12 68v16" stroke="#171416" stroke-width="5" stroke-linecap="round"/></g><text x="710" y="412" font-size="15" font-weight="700" text-anchor="middle">Se vede doar RoboTIC,</text><text x="710" y="434" font-size="15" font-weight="700" text-anchor="middle">pe cerul albastru.</text><rect x="50" y="460" width="860" height="54" rx="14" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/><text x="480" y="493" font-size="15" font-weight="700" text-anchor="middle">Un desen făcut în Paint pe fundal alb păstrează albul și pe scenă.</text>
