<rect x="-22" y="-8" width="44" height="32" rx="8" fill="#3EC6E0" stroke="#171416" stroke-width="3"/>
<circle cx="-9" cy="6" r="4" fill="#171416"/><circle cx="9" cy="6" r="4" fill="#171416"/>
<rect x="-26" y="28" width="52" height="40" rx="8" fill="#0E7F96" stroke="#171416" stroke-width="3"/>
<path d="M-12 68v16M12 68v16" stroke="#171416" stroke-width="5" stroke-linecap="round"/></g><text x="250" y="412" font-size="15" font-weight="700" text-anchor="middle">Se vede un dreptunghi alb</text><text x="250" y="434" font-size="15" font-weight="700" text-anchor="middle">în jurul lui RoboTIC.</text><circle cx="530" cy="84" r="16" fill="#14A39A"/><path d="M522 84l6 6l10 -12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="91" font-size="19" font-weight="800" fill="#0B6F68">Fundal transparent</text><rect x="510" y="110" width="400" height="270" rx="8" fill="#BFE9F3" stroke="#3EC6E0" stroke-width="3"/><rect x="512" y="310" width="396" height="68" rx="6" fill="#9ED9A6"/><circle cx="850" cy="160" r="26" fill="#FFC83D"/><g transform="translate(710 230) scale(1)"><path d="M0 -8v-10" stroke="#171416" stroke-width="3"/><circle cx="0" cy="-20" r="4" fill="#F21F4B"/>
