<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">Din celule în rezultat</title><desc id="desc">Date. Introdu valori numerice în celule.. A1 conține 12; B1 conține 8. Formulă. O formulă începe cu semnul egal.. În C1 scrii =A1+B1. Recalculare. Rezultatul se actualizează când datele se schimbă.. C1 este 20; dacă A1 devine 15, C1 este 23.</desc><rect width="1080" height="640" rx="24" fill="#FFF7EE"/><g font-family="Arial, sans-serif"><text x="42" y="42" fill="#6B6460" font-size="14" letter-spacing="3">EDUDIGI / ATLAS VIZUAL / 20</text><text x="42" y="89" fill="#171416" font-size="32" font-weight="700"><tspan x="42" dy="0">Din celule în rezultat</tspan></text><path d="M42 120H1038" stroke="#E8DFD3"/><rect x="42" y="150" width="316" height="438" rx="18" fill="#FDE7EC"/><circle cx="90" cy="202" r="25" fill="#C8133A"/><text x="90" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><path d="M326 202h42m-8-7 8 7-8 7" stroke="#C8133A" stroke-width="2" fill="none"/><text x="66" y="270" fill="#C8133A" font-size="25" font-weight="700"><tspan x="66" dy="0">Date</tspan></text><text x="66" y="337" fill="#171416" font-size="21" font-weight="400"><tspan x="66" dy="0">Introdu valori numerice</tspan><tspan x="66" dy="29.4">în celule.</tspan></text><path d="M66 438h268" stroke="#C8133A" opacity=".3"/><text x="66" y="466" font-size="13" fill="#C8133A" letter-spacing="2">ÎN PRACTICĂ</text><text x="66" y="498" fill="#171416" font-size="19" font-weight="400"><tspan x="66" dy="0">A1 conține 12; B1 conține</tspan><tspan x="66" dy="26.599999999999998">8.</tspan></text><rect x="382" y="150" width="316" height="438" rx="18" fill="#E2F6FA"/><circle cx="430" cy="202" r="25" fill="#0E7F96"/><text x="430" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><path d="M666 202h42m-8-7 8 7-8 7" stroke="#0E7F96" stroke-width="2" fill="none"/><text x="406" y="270" fill="#0E7F96" font-size="25" font-weight="700"><tspan x="406" dy="0">Formulă</tspan></text><text x="406" y="337" fill="#171416" font-size="21" font-weight="400"><tspan x="406" dy="0">O formulă începe cu</tspan><tspan x="406" dy="29.4">semnul egal.</tspan></text><path d="M406 438h268" stroke="#0E7F96" opacity=".3"/><text x="406" y="466" font-size="13" fill="#0E7F96" letter-spacing="2">ÎN PRACTICĂ</text><text x="406" y="498" fill="#171416" font-size="19" font-weight="400"><tspan x="406" dy="0">În C1 scrii =A1+B1.</tspan></text><rect x="722" y="150" width="316" height="438" rx="18" fill="#E0F4F2"/><circle cx="770" cy="202" r="25" fill="#0B6F68"/><text x="770" y="210" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="746" y="270" fill="#0B6F68" font-size="25" font-weight="700"><tspan x="746" dy="0">Recalculare</tspan></text><text x="746" y="337" fill="#171416" font-size="21" font-weight="400"><tspan x="746" dy="0">Rezultatul se</tspan><tspan x="746" dy="29.4">actualizează când datele</tspan><tspan x="746" dy="29.4">se schimbă.</tspan></text><path d="M746 438h268" stroke="#0B6F68" opacity=".3"/><text x="746" y="466" font-size="13" fill="#0B6F68" letter-spacing="2">ÎN PRACTICĂ</text><text x="746" y="498" fill="#171416" font-size="19" font-weight="400"><tspan x="746" dy="0">C1 este 20; dacă A1 devine</tspan><tspan x="746" dy="26.599999999999998">15, C1 este 23.</tspan></text><text x="42" y="620" fill="#6B6460" font-size="14">Observă. Înțelege. Aplică.</text></g></svg>