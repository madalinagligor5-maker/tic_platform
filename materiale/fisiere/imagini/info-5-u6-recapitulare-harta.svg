<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Harta recapitulativă a unității: interfața Scratch, structura liniară, variabile și operatori, structura de decizie și extensiile Muzică și Creion</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6460"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
<text x="480" y="44" font-size="24" font-weight="800" text-anchor="middle">Harta unității: primii pași în programare</text><path d="M480 290L320 200" fill="none" stroke="#C9C3BC" stroke-width="3" stroke-linecap="round"/><path d="M480 290L640 200" fill="none" stroke="#C9C3BC" stroke-width="3" stroke-linecap="round"/><path d="M480 290L320 380" fill="none" stroke="#C9C3BC" stroke-width="3" stroke-linecap="round"/><path d="M480 290L480 400" fill="none" stroke="#C9C3BC" stroke-width="3" stroke-linecap="round"/><path d="M480 290L640 380" fill="none" stroke="#C9C3BC" stroke-width="3" stroke-linecap="round"/><rect x="350" y="246" width="260" height="88" rx="20" fill="#171416"/><text x="480" y="282" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">Scratch</text><text x="480" y="310" font-size="14" fill="#fff" text-anchor="middle">limbaj de programare vizual</text><rect x="30" y="74" width="290" height="150" rx="16" fill="#fff" stroke="#4C97FF" stroke-width="3"/><rect x="30" y="74" width="290" height="40" rx="16" fill="#4C97FF"/><rect x="30" y="98" width="290" height="16" fill="#4C97FF"/><text x="46" y="101" font-size="17" font-weight="800" fill="#fff">Interfața Scratch</text><text x="46" y="138" font-size="14">paleta de blocuri, zona de program</text><text x="46" y="160" font-size="14">scena 480 × 360 px (x, y)</text><text x="46" y="182" font-size="14">personaje, costume, decoruri</text><text x="46" y="204" font-size="14">steagul verde / bulina roșie</text><rect x="640" y="74" width="290" height="150" rx="16" fill="#fff" stroke="#FFBF00" stroke-width="3"/><rect x="640" y="74" width="290" height="40" rx="16" fill="#FFBF00"/><rect x="640" y="98" width="290" height="16" fill="#FFBF00"/><text x="656" y="101" font-size="17" font-weight="800" fill="#fff">Structura liniară</text><text x="656" y="138" font-size="14">blocurile se execută pe rând,</text><text x="656" y="160" font-size="14">de sus în jos</text><text x="656" y="182" font-size="14">fiecare script pornește la</text><text x="656" y="204" font-size="14">un eveniment (steag, tastă, clic)</text><rect x="30" y="356" width="290" height="160" rx="16" fill="#fff" stroke="#FF8C1A" stroke-width="3"/><rect x="30" y="356" width="290" height="40" rx="16" fill="#FF8C1A"/><rect x="30" y="380" width="290" height="16" fill="#FF8C1A"/><text x="46" y="383" font-size="17" font-weight="800" fill="#fff">Variabile și operatori</text><text x="46" y="420" font-size="14">setează [a] la 10, modifică [a] cu 1</text><text x="46" y="442" font-size="14">+  -  *  /  mod</text><text x="46" y="464" font-size="14">&lt;  &gt;  =</text><text x="46" y="486" font-size="14">și, sau, nu</text><rect x="335" y="400" width="290" height="116" rx="16" fill="#fff" stroke="#FFAB19" stroke-width="3"/><rect x="335" y="400" width="290" height="40" rx="16" fill="#FFAB19"/><rect x="335" y="424" width="290" height="16" fill="#FFAB19"/><text x="351" y="427" font-size="17" font-weight="800" fill="#fff">Structura de decizie</text><text x="351" y="464" font-size="14">dacă … atunci</text><text x="351" y="486" font-size="14">dacă … atunci … altfel</text><text x="351" y="508" font-size="14">condiția: în spațiul hexagonal</text><rect x="640" y="356" width="290" height="160" rx="16" fill="#fff" stroke="#0FBD8C" stroke-width="3"/><rect x="640" y="356" width="290" height="40" rx="16" fill="#0FBD8C"/><rect x="640" y="380" width="290" height="16" fill="#0FBD8C"/><text x="656" y="383" font-size="17" font-weight="800" fill="#fff">Extensii</text><text x="656" y="420" font-size="14">Muzică: instrument, note</text><text x="656" y="442" font-size="14">(Do = 60 … Do = 72), bătăi</text><text x="656" y="464" font-size="14">Creion: pune creionul jos,</text><text x="656" y="486" font-size="14">ridică creionul</text>
  </g>
</svg>
