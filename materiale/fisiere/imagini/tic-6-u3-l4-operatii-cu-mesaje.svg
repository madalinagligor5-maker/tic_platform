<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Fereastra unui mesaj nou: antetul cu De la, Către, CC, CCI și Subiect, corpul mesajului, atașamentul și butonul Trimite</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <rect x="40" y="36" width="540" height="470" rx="14" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <rect x="40" y="36" width="540" height="40" rx="14" fill="#171416"/>
    <rect x="40" y="62" width="540" height="14" fill="#171416"/>
    <text x="60" y="62" font-size="15" font-weight="800" fill="#FFFFFF">Mesaj nou</text>
    <path d="M552 50l12 12M564 50l-12 12" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- antet -->
    <rect x="42" y="78" width="536" height="186" fill="#E2F6FA" opacity="0.45"/>
    <g font-size="14">
      <text x="60" y="104" font-weight="800" fill="#6B6460">De la</text><text x="140" y="104">vlad@scoala.ro</text>
      <path d="M42 116H578" stroke="#E8DFD3" stroke-width="2"/>
      <text x="60" y="140" font-weight="800" fill="#6B6460">Către</text><text x="140" y="140">ana@scoala.ro</text>
      <path d="M42 152H578" stroke="#E8DFD3" stroke-width="2"/>
      <text x="60" y="176" font-weight="800" fill="#6B6460">CC</text><text x="140" y="176">mihai@scoala.ro</text>
      <path d="M42 188H578" stroke="#E8DFD3" stroke-width="2"/>
      <text x="60" y="212" font-weight="800" fill="#6B6460">CCI</text><text x="140" y="212">ioana@scoala.ro; radu@scoala.ro</text>
      <path d="M42 224H578" stroke="#E8DFD3" stroke-width="2"/>
      <text x="60" y="248" font-weight="800" fill="#6B6460">Subiect</text><text x="140" y="248" font-weight="700">Proiectul despre apă</text>
      <path d="M42 262H578" stroke="#171416" stroke-width="2"/>
    </g>
    <!-- corp -->
    <g font-size="14">
      <text x="60" y="296">Bună, Ana!</text>
      <text x="60" y="322">Îți trimit prezentarea noastră despre apă.</text>
      <text x="60" y="348">Te salut! Vlad</text>
    </g>
    <rect x="60" y="374" width="230" height="36" rx="8" fill="#FFF0DB" stroke="#F29A1F" stroke-width="2"/>
    <path d="M80 384v14a5 5 0 0 0 10 0v-16a3 3 0 0 0-6 0v14" fill="none" stroke="#171416" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="397" font-size="13">Proiect_apa_6B.pptx</text>
    <path d="M42 430H578" stroke="#E8DFD3" stroke-width="2"/>
    <!-- bara de jos -->
    <rect x="60" y="446" width="110" height="40" rx="20" fill="#14A39A"/>
    <text x="115" y="471" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">Trimite</text>
    <path d="M196 452v20a7 7 0 0 0 14 0v-22a4 4 0 0 0-8 0v20" fill="none" stroke="#171416" stroke-width="2.5" stroke-linecap="round"/>

    <!-- adnotări -->
    <path d="M592 82h12V260h-12" fill="none" stroke="#0E7F96" stroke-width="3"/>
    <text x="618" y="104" font-size="17" font-weight="800" fill="#0E7F96">Antetul (header)</text>
    <text x="618" y="132" font-size="13"><tspan font-weight="800">Către:</tspan> cui îi scrii; mai multe</text>
    <text x="618" y="150" font-size="13">adrese se despart prin „;”</text>
    <text x="618" y="176" font-size="13"><tspan font-weight="800">CC:</tspan> primesc o copie, doar ca să afle</text>
    <text x="618" y="202" font-size="13"><tspan font-weight="800">CCI:</tspan> copie invizibilă; ceilalți</text>
    <text x="618" y="220" font-size="13">nu le văd adresele</text>
    <text x="618" y="248" font-size="13"><tspan font-weight="800">Subiect:</tspan> despre ce e mesajul</text>

    <path d="M592 270h12V420h-12" fill="none" stroke="#F29A1F" stroke-width="3"/>
    <text x="618" y="300" font-size="17" font-weight="800" fill="#F29A1F">Corpul (body)</text>
    <text x="618" y="324" font-size="13">textul mesajului</text>
    <text x="618" y="388" font-size="13"><tspan font-weight="800">atașamentul:</tspan> fișierul trimis</text>
    <text x="618" y="406" font-size="13">odată cu mesajul</text>

    <path d="M220 466H300" stroke="#6B6460" stroke-width="2"/>
    <text x="308" y="462" font-size="13">agrafa = Atașare fișier</text>
    <text x="308" y="480" font-size="13" fill="#6B6460">răspuns: „Re:” · redirecționare: „Fwd:”</text>
  </g>
</svg>
