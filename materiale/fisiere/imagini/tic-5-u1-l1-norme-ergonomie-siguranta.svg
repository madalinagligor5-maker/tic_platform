<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Poziția corectă la calculator: ecranul, distanța față de ochi, tastatura, spatele și picioarele</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C8133A"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Cum stai corect la calculator</text>

    <!-- lampa -->
    <path d="M120 64v26" stroke="#6B6460" stroke-width="3"/>
    <path d="M96 112a24 22 0 0 1 48 0z" fill="#F29A1F"/>
    <path d="M104 124l-10 18M120 126v20M136 124l10 18" stroke="#F29A1F" stroke-width="3" stroke-linecap="round"/>

    <!-- podea -->
    <path d="M50 482H600" stroke="#E8DFD3" stroke-width="6" stroke-linecap="round"/>

    <!-- scaun -->
    <rect x="196" y="190" width="16" height="150" rx="6" fill="#0E7F96"/>
    <rect x="196" y="328" width="150" height="16" rx="6" fill="#0E7F96"/>
    <path d="M270 344v80M230 470l40-46l40 46" stroke="#0E7F96" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- birou -->
    <rect x="370" y="296" width="230" height="14" rx="4" fill="#F1E9DF" stroke="#6B6460" stroke-width="2"/>
    <path d="M580 310v170" stroke="#6B6460" stroke-width="6" stroke-linecap="round"/>
    <!-- monitor -->
    <rect x="530" y="160" width="16" height="104" rx="4" fill="#171416"/>
    <path d="M538 264v32M516 296h44" stroke="#171416" stroke-width="5" stroke-linecap="round"/>
    <!-- tastatura -->
    <rect x="384" y="287" width="70" height="9" rx="3" fill="#171416"/>

    <!-- persoana -->
    <path d="M232 204L226 324" stroke="#F21F4B" stroke-width="30" stroke-linecap="round"/>
    <path d="M232 324H384" stroke="#171416" stroke-width="24" stroke-linecap="round"/>
    <path d="M388 330V462" stroke="#171416" stroke-width="20" stroke-linecap="round"/>
    <path d="M388 470H424" stroke="#171416" stroke-width="12" stroke-linecap="round"/>
    <path d="M240 216L262 284L380 284" stroke="#C8133A" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="246" cy="166" r="28" fill="#F1E9DF" stroke="#171416" stroke-width="3"/>
    <circle cx="262" cy="162" r="4" fill="#171416"/>

    <!-- linii ajutătoare -->
    <path d="M268 162H526" stroke="#C8133A" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M266 128H528" stroke="#C8133A" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="397" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#C8133A">45–70 cm</text>

    <!-- numere -->
    <g font-size="14" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="568" cy="160" r="13" fill="#171416"/><text x="568" y="165">1</text>
      <circle cx="470" cy="118" r="13" fill="#171416"/><text x="470" y="123">2</text>
      <circle cx="420" cy="262" r="13" fill="#171416"/><text x="420" y="267">3</text>
      <circle cx="174" cy="260" r="13" fill="#171416"/><text x="174" y="265">4</text>
      <circle cx="444" cy="450" r="13" fill="#171416"/><text x="444" y="455">5</text>
      <circle cx="170" cy="100" r="13" fill="#171416"/><text x="170" y="105">6</text>
    </g>

    <!-- legendă -->
    <rect x="630" y="76" width="300" height="420" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="14">
      <text x="650" y="110"><tspan font-weight="800">1</tspan>  Marginea de sus a ecranului</text>
      <text x="668" y="130">la nivelul ochilor</text>
      <text x="650" y="176"><tspan font-weight="800">2</tspan>  Ecranul la 45–70 cm</text>
      <text x="668" y="196">de ochi</text>
      <text x="650" y="242"><tspan font-weight="800">3</tspan>  Tastatura la nivelul cotului</text>
      <text x="650" y="300"><tspan font-weight="800">4</tspan>  Spatele drept, sprijinit</text>
      <text x="668" y="320">de spătar</text>
      <text x="650" y="366"><tspan font-weight="800">5</tspan>  Picioarele pe podea</text>
      <text x="668" y="386">(sau pe un suport)</text>
      <text x="650" y="432"><tspan font-weight="800">6</tspan>  Încăpere bine luminată</text>
    </g>
  </g>
</svg>
