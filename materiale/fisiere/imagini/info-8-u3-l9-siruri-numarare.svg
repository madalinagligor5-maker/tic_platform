<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Numărarea cu trei contoare pentru notele 10 7 4 9 10 8 3 6</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="50" text-anchor="middle" font-size="22" font-weight="800">Trei contoare, aceeași parcurgere</text>
    <text x="40" y="108" font-size="16" font-weight="800">notele</text>
    <rect x="262" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="290" y="109" text-anchor="middle" font-size="18" font-weight="800">10</text>
    <rect x="328" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="356" y="109" text-anchor="middle" font-size="18" font-weight="800">7</text>
    <rect x="394" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="422" y="109" text-anchor="middle" font-size="18" font-weight="800">4</text>
    <rect x="460" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="488" y="109" text-anchor="middle" font-size="18" font-weight="800">9</text>
    <rect x="526" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="554" y="109" text-anchor="middle" font-size="18" font-weight="800">10</text>
    <rect x="592" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="620" y="109" text-anchor="middle" font-size="18" font-weight="800">8</text>
    <rect x="658" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="686" y="109" text-anchor="middle" font-size="18" font-weight="800">3</text>
    <rect x="724" y="80" width="56" height="44" rx="10" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/><text x="752" y="109" text-anchor="middle" font-size="18" font-weight="800">6</text>
    <text x="862" y="108" text-anchor="middle" font-size="15" font-weight="800">contor</text>
    <rect x="30" y="152" width="900" height="56" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="44" y="185" font-size="15" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">if (nota == 10)</text>
    <circle cx="290" cy="180" r="18" fill="#3EC6E0"/><text x="290" y="185" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="356" cy="180" r="4" fill="#E8DFD3"/>
    <circle cx="422" cy="180" r="4" fill="#E8DFD3"/>
    <circle cx="488" cy="180" r="4" fill="#E8DFD3"/>
    <circle cx="554" cy="180" r="18" fill="#3EC6E0"/><text x="554" y="185" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="620" cy="180" r="4" fill="#E8DFD3"/>
    <circle cx="686" cy="180" r="4" fill="#E8DFD3"/>
    <circle cx="752" cy="180" r="4" fill="#E8DFD3"/>
    <rect x="806" y="160" width="112" height="40" rx="10" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/><text x="862" y="186" text-anchor="middle" font-size="15" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">zece=2</text>
    <rect x="30" y="218" width="900" height="56" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="44" y="251" font-size="15" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">if (nota &lt; 5)</text>
    <circle cx="290" cy="246" r="4" fill="#E8DFD3"/>
    <circle cx="356" cy="246" r="4" fill="#E8DFD3"/>
    <circle cx="422" cy="246" r="18" fill="#F21F4B"/><text x="422" y="251" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="488" cy="246" r="4" fill="#E8DFD3"/>
    <circle cx="554" cy="246" r="4" fill="#E8DFD3"/>
    <circle cx="620" cy="246" r="4" fill="#E8DFD3"/>
    <circle cx="686" cy="246" r="18" fill="#F21F4B"/><text x="686" y="251" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="752" cy="246" r="4" fill="#E8DFD3"/>
    <rect x="806" y="226" width="112" height="40" rx="10" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/><text x="862" y="252" text-anchor="middle" font-size="15" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">sub5=2</text>
    <rect x="30" y="284" width="900" height="56" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <text x="44" y="317" font-size="15" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">if (nota &gt;= 8)</text>
    <circle cx="290" cy="312" r="18" fill="#14A39A"/><text x="290" y="317" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="356" cy="312" r="4" fill="#E8DFD3"/>
    <circle cx="422" cy="312" r="4" fill="#E8DFD3"/>
    <circle cx="488" cy="312" r="18" fill="#14A39A"/><text x="488" y="317" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="554" cy="312" r="18" fill="#14A39A"/><text x="554" y="317" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="620" cy="312" r="18" fill="#14A39A"/><text x="620" y="317" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">+1</text>
    <circle cx="686" cy="312" r="4" fill="#E8DFD3"/>
    <circle cx="752" cy="312" r="4" fill="#E8DFD3"/>
    <rect x="806" y="292" width="112" height="40" rx="10" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/><text x="862" y="318" text-anchor="middle" font-size="15" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">peste8=4</text>
    <rect x="30" y="358" width="900" height="50" rx="12" fill="#E0F4F2"/>
    <text x="50" y="389" font-size="15" font-family="JetBrains Mono, Consolas, monospace">peste8 * 100.0 / n = 4 * 100.0 / 8 = 50.0%</text>
    <text x="910" y="389" text-anchor="end" font-size="14" font-weight="700" fill="#0B6F68">procent cu împărțire reală</text>
    <text x="480" y="446" text-anchor="middle" font-size="15" font-weight="700">Contorul pornește de la 0, crește cu 1 (k++) doar când condiția e adevărată</text>
    <text x="480" y="470" text-anchor="middle" font-size="15" font-weight="700">și se afișează după buclă.</text>
    <text x="480" y="502" text-anchor="middle" font-size="13" fill="#6B6460">If-uri separate: o notă de 10 se numără și la „cel puțin 8”.</text>
  </g>
</svg>
