<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Unitatea centrală și dispozitivele periferice de intrare, de ieșire și de intrare-ieșire</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- titluri coloane -->
    <text x="150" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#0E7F96">INTRARE</text>
    <text x="150" y="76" text-anchor="middle" font-size="14" fill="#6B6460">datele intră în calculator</text>
    <text x="810" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#C8133A">IEȘIRE</text>
    <text x="810" y="76" text-anchor="middle" font-size="14" fill="#6B6460">rezultatele ies din calculator</text>

    <!-- unitatea centrală -->
    <rect x="400" y="130" width="160" height="230" rx="16" fill="#171416"/>
    <rect x="422" y="154" width="116" height="10" rx="5" fill="#3B3638"/>
    <rect x="422" y="174" width="116" height="10" rx="5" fill="#3B3638"/>
    <circle cx="480" cy="300" r="18" fill="none" stroke="#F21F4B" stroke-width="5"/>
    <path d="M480 288v12" stroke="#F21F4B" stroke-width="5" stroke-linecap="round"/>
    <text x="480" y="114" text-anchor="middle" font-size="18" font-weight="800">Unitatea centrală</text>
    <text x="480" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF7EE">prelucrează</text>
    <text x="480" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF7EE">datele</text>

    <!-- intrare: tastatură -->
    <rect x="70" y="112" width="160" height="62" rx="10" fill="#fff" stroke="#3EC6E0" stroke-width="3"/>
    <g fill="#3EC6E0">
      <rect x="84" y="124" width="16" height="12" rx="2"/><rect x="104" y="124" width="16" height="12" rx="2"/><rect x="124" y="124" width="16" height="12" rx="2"/><rect x="144" y="124" width="16" height="12" rx="2"/><rect x="164" y="124" width="16" height="12" rx="2"/><rect x="184" y="124" width="16" height="12" rx="2"/><rect x="204" y="124" width="14" height="12" rx="2"/>
      <rect x="84" y="140" width="16" height="12" rx="2"/><rect x="104" y="140" width="16" height="12" rx="2"/><rect x="124" y="140" width="16" height="12" rx="2"/><rect x="144" y="140" width="16" height="12" rx="2"/><rect x="164" y="140" width="16" height="12" rx="2"/><rect x="184" y="140" width="34" height="12" rx="2"/>
      <rect x="108" y="156" width="84" height="10" rx="2"/>
    </g>
    <text x="150" y="196" text-anchor="middle" font-size="15" font-weight="700">tastatura</text>
    <!-- intrare: mouse -->
    <rect x="128" y="218" width="44" height="64" rx="22" fill="#fff" stroke="#3EC6E0" stroke-width="3"/>
    <path d="M150 218v24M128 242h44" stroke="#3EC6E0" stroke-width="3"/>
    <text x="150" y="304" text-anchor="middle" font-size="15" font-weight="700">mouse-ul</text>
    <!-- intrare: scaner -->
    <rect x="80" y="330" width="140" height="44" rx="8" fill="#fff" stroke="#3EC6E0" stroke-width="3"/>
    <rect x="94" y="340" width="112" height="10" rx="3" fill="#E2F6FA"/>
    <path d="M94 362h112" stroke="#3EC6E0" stroke-width="3" stroke-linecap="round"/>
    <text x="150" y="396" text-anchor="middle" font-size="15" font-weight="700">scanerul</text>

    <!-- ieșire: monitor -->
    <rect x="735" y="104" width="150" height="92" rx="8" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <rect x="747" y="116" width="126" height="66" rx="4" fill="#FDE7EC"/>
    <path d="M790 196h40l6 16h-52z" fill="#F21F4B"/>
    <text x="810" y="232" text-anchor="middle" font-size="15" font-weight="700">monitorul</text>
    <!-- ieșire: imprimantă -->
    <rect x="760" y="256" width="100" height="22" rx="3" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <rect x="740" y="276" width="140" height="44" rx="8" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <rect x="770" y="306" width="80" height="28" rx="2" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <text x="810" y="356" text-anchor="middle" font-size="15" font-weight="700">imprimanta</text>
    <!-- ieșire: boxe -->
    <rect x="768" y="378" width="34" height="50" rx="6" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <circle cx="785" cy="408" r="9" fill="none" stroke="#F21F4B" stroke-width="3"/>
    <rect x="818" y="378" width="34" height="50" rx="6" fill="#fff" stroke="#F21F4B" stroke-width="3"/>
    <circle cx="835" cy="408" r="9" fill="none" stroke="#F21F4B" stroke-width="3"/>
    <text x="810" y="450" text-anchor="middle" font-size="15" font-weight="700">boxele</text>

    <!-- săgeți -->
    <path d="M245 160 L392 205" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <path d="M190 250 L392 245" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <path d="M232 352 L392 290" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <path d="M568 205 L725 152" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <path d="M568 250 L730 295" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <path d="M568 295 L758 398" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>

    <!-- intrare-ieșire -->
    <rect x="270" y="448" width="420" height="70" rx="14" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <path d="M480 368 V440" stroke="#14A39A" stroke-width="3" fill="none" marker-start="url(#sag)" marker-end="url(#sag)"/>
    <text x="480" y="475" text-anchor="middle" font-size="17" font-weight="800" fill="#0B6F68">INTRARE-IEȘIRE</text>
    <text x="480" y="500" text-anchor="middle" font-size="14">ecranul tactil · căștile cu microfon · multifuncționalul</text>
  </g>
</svg>
