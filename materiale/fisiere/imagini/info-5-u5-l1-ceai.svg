<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Algoritmul pentru prepararea unui ceai: Start, patru pași făcuți în ordine și Stop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="50" text-anchor="middle" font-size="24" font-weight="800">Algoritmul pentru prepararea unui ceai</text>
    <text x="480" y="80" text-anchor="middle" font-size="15" fill="#6B6460">Pașii se fac unul după altul, în ordinea în care sunt scriși.</text>

    <!-- Start / Stop -->
    <rect x="20" y="242" width="72" height="36" rx="18" fill="#171416"/>
    <text x="56" y="265" text-anchor="middle" font-size="15" font-weight="800" fill="#FFF7EE">Start</text>
    <rect x="868" y="242" width="72" height="36" rx="18" fill="#171416"/>
    <text x="904" y="265" text-anchor="middle" font-size="15" font-weight="800" fill="#FFF7EE">Stop</text>

    <!-- cartonașe -->
    <g stroke-width="3">
      <rect x="118" y="116" width="160" height="290" rx="16" fill="#FFFFFF" stroke="#3EC6E0"/>
      <rect x="306" y="116" width="160" height="290" rx="16" fill="#FFFFFF" stroke="#FFC83D"/>
      <rect x="494" y="116" width="160" height="290" rx="16" fill="#FFFFFF" stroke="#14A39A"/>
      <rect x="682" y="116" width="160" height="290" rx="16" fill="#FFFFFF" stroke="#7A3FB8"/>
    </g>
    <circle cx="198" cy="146" r="18" fill="#3EC6E0"/>
    <text x="198" y="153" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
    <circle cx="386" cy="146" r="18" fill="#FFC83D"/>
    <text x="386" y="153" text-anchor="middle" font-size="18" font-weight="800">2</text>
    <circle cx="574" cy="146" r="18" fill="#14A39A"/>
    <text x="574" y="153" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
    <circle cx="762" cy="146" r="18" fill="#7A3FB8"/>
    <text x="762" y="153" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text>

    <!-- 1: ibric -->
    <path d="M150 196q-6-8 0-16q6-8 0-16M164 196q-6-8 0-16q6-8 0-16" stroke="#6B6460" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M168 222L146 206L151 200L172 212Z" fill="#3EC6E0"/>
    <path d="M232 214q24 0 24 20q0 20-24 20" stroke="#0E7F96" stroke-width="7" fill="none"/>
    <rect x="166" y="202" width="68" height="62" rx="16" fill="#3EC6E0"/>
    <rect x="184" y="192" width="32" height="13" rx="6" fill="#0E7F96"/>
    <text x="200" y="240" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">250 ml</text>

    <!-- 2: cană + plic de ceai + zahăr -->
    <rect x="318" y="226" width="30" height="40" rx="4" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="2"/>
    <text x="333" y="251" text-anchor="middle" font-size="14" font-weight="800" fill="#7A3FB8">Z</text>
    <path d="M410 226q20 0 20 15q0 15-20 15" stroke="#171416" stroke-width="3" fill="none"/>
    <path d="M358 214H410V250Q410 268 392 268H376Q358 268 358 250Z" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <path d="M380 240L398 190" stroke="#6B6460" stroke-width="2"/>
    <rect x="390" y="176" width="22" height="16" rx="2" fill="#FFC83D" stroke="#C88A00" stroke-width="1.5"/>
    <rect x="370" y="232" width="20" height="26" rx="3" fill="#E7C08A" opacity="0.8"/>

    <!-- 3: turnăm apa -->
    <g transform="translate(14 0) rotate(28 540 200)">
      <path d="M560 196L582 186L585 192L562 206Z" fill="#14A39A"/>
      <rect x="512" y="182" width="50" height="40" rx="12" fill="#14A39A"/>
      <rect x="524" y="174" width="24" height="10" rx="5" fill="#0B6F68"/>
    </g>
    <path d="M596 216Q590 228 588 246" stroke="#3EC6E0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M608 236q18 0 18 14q0 14-18 14" stroke="#171416" stroke-width="3" fill="none"/>
    <path d="M556 232H608V256Q608 274 590 274H574Q556 274 556 256Z" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <path d="M559 246H605V256Q605 271 590 271H574Q559 271 559 256Z" fill="#C98A4B"/>

    <!-- 4: amestecăm + ceas -->
    <path d="M714 210q-5-7 0-14q5-7 0-14M730 210q-5-7 0-14q5-7 0-14" stroke="#6B6460" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M752 232q18 0 18 14q0 14-18 14" stroke="#171416" stroke-width="3" fill="none"/>
    <path d="M700 228H752V254Q752 272 734 272H718Q700 272 700 254Z" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <path d="M703 240H749V254Q749 269 734 269H718Q703 269 703 254Z" fill="#C98A4B"/>
    <path d="M736 250L760 206" stroke="#6B6460" stroke-width="5" stroke-linecap="round"/>
    <circle cx="806" cy="222" r="24" fill="#F0E8FA" stroke="#7A3FB8" stroke-width="3"/>
    <path d="M806 222V206M806 222L818 230" stroke="#7A3FB8" stroke-width="3" stroke-linecap="round"/>

    <!-- texte -->
    <g font-size="15" text-anchor="middle">
      <text x="198" y="312" font-weight="700">Fierbem</text>
      <text x="198" y="334">250 ml de apă.</text>
      <text x="386" y="312" font-weight="700">Punem în cană</text>
      <text x="386" y="334">un plic de ceai</text>
      <text x="386" y="356">și un plic</text>
      <text x="386" y="378">de zahăr.</text>
      <text x="574" y="312" font-weight="700">Turnăm apa</text>
      <text x="574" y="334">fierbinte</text>
      <text x="574" y="356">în cană.</text>
      <text x="762" y="312" font-weight="700">Amestecăm și</text>
      <text x="762" y="334">așteptăm</text>
      <text x="762" y="356">patru minute.</text>
    </g>

    <!-- săgeți -->
    <g stroke="#171416" stroke-width="3" fill="none">
      <path d="M92 260H114" marker-end="url(#a)"/>
      <path d="M278 260H302" marker-end="url(#a)"/>
      <path d="M466 260H490" marker-end="url(#a)"/>
      <path d="M654 260H678" marker-end="url(#a)"/>
      <path d="M842 260H864" marker-end="url(#a)"/>
    </g>

    <!-- concluzii -->
    <rect x="118" y="432" width="350" height="70" rx="14" fill="#E2F6FA"/>
    <text x="293" y="462" text-anchor="middle" font-size="17" font-weight="800" fill="#0E7F96">Număr clar de pași</text>
    <text x="293" y="486" text-anchor="middle" font-size="15">patru pași, apoi algoritmul se oprește</text>
    <rect x="492" y="432" width="350" height="70" rx="14" fill="#E0F4F2"/>
    <text x="667" y="462" text-anchor="middle" font-size="17" font-weight="800" fill="#0B6F68">Ordine stabilită</text>
    <text x="667" y="486" text-anchor="middle" font-size="15">nu turnăm apa înainte să o fierbem</text>
  </g>
</svg>
