<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Desktopul cu pictograme, bara de activități, butonul Start și elementele unei ferestre</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Desktopul și elementele unei ferestre</text>

    <!-- ecran -->
    <rect x="30" y="70" width="660" height="430" rx="12" fill="#E2F6FA" stroke="#171416" stroke-width="3"/>

    <!-- pictograme -->
    <path d="M60 96h30l-4 40h-22z" fill="#FFFFFF" stroke="#0E7F96" stroke-width="3" stroke-linejoin="round"/>
    <path d="M56 96h38" stroke="#0E7F96" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="156" text-anchor="middle" font-size="13">Coș de</text>
    <text x="75" y="172" text-anchor="middle" font-size="13">reciclare</text>
    <path d="M56 204h16l5 6h22v32h-43z" fill="#F29A1F"/>
    <text x="77" y="262" text-anchor="middle" font-size="13">Lucru</text>

    <!-- fereastra -->
    <rect x="170" y="100" width="440" height="300" rx="8" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <path d="M172 102h436v34h-436z" fill="#F1E9DF"/>
    <rect x="182" y="110" width="18" height="18" rx="4" fill="#3EC6E0"/>
    <text x="212" y="124" font-size="14" font-weight="700">Fereastra mea</text>
    <path d="M500 126h16" stroke="#171416" stroke-width="3"/>
    <rect x="536" y="112" width="16" height="15" fill="none" stroke="#171416" stroke-width="3"/>
    <path d="M574 112l14 15M588 112l-14 15" stroke="#F21F4B" stroke-width="3"/>
    <path d="M172 136h436" stroke="#E8DFD3" stroke-width="2"/>
    <text x="184" y="158" font-size="13">Fișier</text>
    <text x="236" y="158" font-size="13">Editare</text>
    <text x="298" y="158" font-size="13">Vizualizare</text>
    <path d="M172 168h436" stroke="#E8DFD3" stroke-width="2"/>
    <g stroke="#E8DFD3" stroke-width="6" stroke-linecap="round">
      <path d="M192 196h300M192 220h340M192 244h260M192 268h320M192 292h280M192 316h200"/>
    </g>
    <rect x="586" y="170" width="20" height="208" fill="#F1E9DF"/>
    <rect x="589" y="184" width="14" height="60" rx="7" fill="#6B6460"/>
    <rect x="174" y="378" width="412" height="20" fill="#F1E9DF"/>
    <rect x="190" y="381" width="120" height="14" rx="7" fill="#6B6460"/>

    <!-- bara de activități -->
    <path d="M33 452h654v34a12 12 0 0 1-12 12h-630a12 12 0 0 1-12-12z" fill="#171416"/>
    <rect x="42" y="460" width="80" height="30" rx="8" fill="#F21F4B"/>
    <text x="82" y="480" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">Start</text>
    <rect x="140" y="462" width="26" height="26" rx="5" fill="#F29A1F"/>
    <rect x="178" y="462" width="26" height="26" rx="5" fill="#3EC6E0"/>
    <path d="M178 492h26" stroke="#3EC6E0" stroke-width="3"/>
    <text x="560" y="480" font-size="13" font-weight="700" fill="#FFF7EE">RO</text>
    <text x="610" y="480" font-size="13" font-weight="700" fill="#FFF7EE">10:30</text>

    <!-- numere -->
    <g font-size="14" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="122" cy="118" r="13" fill="#171416"/><text x="122" y="123">1</text>
      <circle cx="390" cy="119" r="13" fill="#171416"/><text x="390" y="124">2</text>
      <circle cx="191" cy="84" r="13" fill="#171416"/><text x="191" y="89">3</text>
      <circle cx="545" cy="84" r="13" fill="#171416"/><text x="545" y="89">4</text>
      <circle cx="420" cy="152" r="13" fill="#171416"/><text x="420" y="157">5</text>
      <circle cx="560" cy="300" r="13" fill="#171416"/><text x="560" y="305">6</text>
      <circle cx="250" cy="430" r="13" fill="#171416"/><text x="250" y="435">7</text>
      <circle cx="82" cy="430" r="13" fill="#171416"/><text x="82" y="435">8</text>
    </g>
    <path d="M191 97v12M545 97v12M250 443v12M82 443v14" stroke="#171416" stroke-width="2"/>

    <!-- legendă -->
    <rect x="710" y="70" width="220" height="430" rx="16" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="14">
      <text x="726" y="104"><tspan font-weight="800">1</tspan>  Pictogramele</text>
      <text x="744" y="124" font-size="13" fill="#6B6460">dublu clic le deschide</text>
      <text x="726" y="160"><tspan font-weight="800">2</tspan>  Bara de titlu</text>
      <text x="726" y="196"><tspan font-weight="800">3</tspan>  Butonul de control</text>
      <text x="726" y="232"><tspan font-weight="800">4</tspan>  Minimizare,</text>
      <text x="744" y="252">maximizare, închidere</text>
      <text x="726" y="288"><tspan font-weight="800">5</tspan>  Bara de meniuri</text>
      <text x="726" y="324"><tspan font-weight="800">6</tspan>  Barele de derulare</text>
      <text x="726" y="360"><tspan font-weight="800">7</tspan>  Bara de activități</text>
      <text x="744" y="380" font-size="13" fill="#6B6460">un clic pornește programul</text>
      <text x="726" y="416"><tspan font-weight="800">8</tspan>  Butonul Start</text>
      <text x="744" y="436" font-size="13" fill="#6B6460">deschide meniul Start</text>
    </g>
  </g>
</svg>
