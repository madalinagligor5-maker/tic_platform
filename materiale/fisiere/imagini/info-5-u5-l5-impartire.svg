<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Operatorii / și %: 15 bomboane împărțite la 2 copii, fiecare primește 7 și rămâne 1</title>
  <defs>
    <g id="b">
      <path d="M-20 -8L-11 0L-20 8Z" fill="#FFC83D"/>
      <path d="M20 -8L11 0L20 8Z" fill="#FFC83D"/>
      <circle r="12" fill="#F21F4B"/>
      <path d="M-5 -6Q0 0 -5 6M3 -7Q8 0 3 7" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
    </g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">15 bomboane, împărțite în mod egal la 2 copii</text>

    <!-- copilul 1 -->
    <rect x="40" y="76" width="320" height="230" rx="18" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <circle cx="80" cy="112" r="20" fill="#3EC6E0"/>
    <circle cx="73" cy="108" r="2.5" fill="#171416"/><circle cx="87" cy="108" r="2.5" fill="#171416"/>
    <path d="M72 117Q80 124 88 117" stroke="#171416" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="112" y="118" font-size="17" font-weight="800">primul copil</text>
    <use href="#b" x="100" y="180"/><use href="#b" x="160" y="180"/><use href="#b" x="220" y="180"/><use href="#b" x="280" y="180"/>
    <use href="#b" x="130" y="230"/><use href="#b" x="190" y="230"/><use href="#b" x="250" y="230"/>
    <text x="200" y="286" text-anchor="middle" font-size="17" font-weight="800" fill="#0E7F96">7 bomboane</text>

    <!-- copilul 2 -->
    <rect x="380" y="76" width="320" height="230" rx="18" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <circle cx="420" cy="112" r="20" fill="#7A3FB8"/>
    <circle cx="413" cy="108" r="2.5" fill="#fff"/><circle cx="427" cy="108" r="2.5" fill="#fff"/>
    <path d="M412 117Q420 124 428 117" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="452" y="118" font-size="17" font-weight="800">al doilea copil</text>
    <use href="#b" x="440" y="180"/><use href="#b" x="500" y="180"/><use href="#b" x="560" y="180"/><use href="#b" x="620" y="180"/>
    <use href="#b" x="470" y="230"/><use href="#b" x="530" y="230"/><use href="#b" x="590" y="230"/>
    <text x="540" y="286" text-anchor="middle" font-size="17" font-weight="800" fill="#0E7F96">7 bomboane</text>

    <!-- rest -->
    <rect x="720" y="76" width="200" height="230" rx="18" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="820" y="118" text-anchor="middle" font-size="17" font-weight="800">rămâne</text>
    <use href="#b" x="820" y="200"/>
    <text x="820" y="286" text-anchor="middle" font-size="17" font-weight="800" fill="#9A6B00">1 bomboană</text>

    <!-- operatori -->
    <rect x="40" y="330" width="430" height="176" rx="18" fill="#E2F6FA"/>
    <rect x="64" y="354" width="70" height="70" rx="14" fill="#3EC6E0"/>
    <text x="99" y="402" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">/</text>
    <text x="154" y="384" font-size="26" font-weight="800">15 / 2 = 7</text>
    <text x="154" y="412" font-size="15">câtul împărțirii întregi</text>
    <text x="64" y="460" font-size="15">„Câte primește fiecare copil?”</text>
    <text x="64" y="484" font-size="15" fill="#6B6460">Exemplu: 14 / 2 = 7</text>

    <rect x="490" y="330" width="430" height="176" rx="18" fill="#FFF4D6"/>
    <rect x="514" y="354" width="70" height="70" rx="14" fill="#FFC83D"/>
    <text x="549" y="402" text-anchor="middle" font-size="36" font-weight="800">%</text>
    <text x="604" y="384" font-size="26" font-weight="800">15 % 2 = 1</text>
    <text x="604" y="412" font-size="15">restul împărțirii întregi</text>
    <text x="514" y="460" font-size="15">„Câte bomboane rămân?”</text>
    <text x="514" y="484" font-size="15" fill="#6B6460">Exemplu: 14 % 2 = 0 (nu rămâne nimic)</text>
  </g>
</svg>
