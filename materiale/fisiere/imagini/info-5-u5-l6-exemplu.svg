<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Traseul datelor prin două decizii una în alta, pentru a = 3, b = 2 și c = 9: rezultatul este r = 2</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B5ACA5"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E7F96"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="40" y="44" font-size="24" font-weight="800">Urmărim drumul datelor: a = 3, b = 2, c = 9</text>

    <!-- schema -->
    <rect x="130" y="66" width="100" height="30" rx="15" fill="#171416"/>
    <text x="180" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF7EE">START</text>
    <path d="M100 112H274L260 148H86Z" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3" stroke-linejoin="round"/>
    <text x="180" y="136" text-anchor="middle" font-size="15" font-weight="700">citește a, b, c</text>

    <path d="M180 172L270 216L180 260L90 216Z" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3" stroke-linejoin="round"/>
    <text x="180" y="222" text-anchor="middle" font-size="17" font-weight="800">b &gt; 7 ?</text>
    <path d="M430 172L520 216L430 260L340 216Z" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3" stroke-linejoin="round"/>
    <text x="430" y="222" text-anchor="middle" font-size="17" font-weight="800">a &gt; 0 ?</text>

    <!-- ramura neparcursă -->
    <rect x="90" y="300" width="180" height="44" rx="6" fill="#F3EEE8" stroke="#B5ACA5" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="180" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#6B6460">r ← (a + b) * c</text>
    <path d="M534 286H664L650 344H520Z" fill="#F3EEE8" stroke="#B5ACA5" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="592" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6460">scrie „Nu avem</text>
    <text x="592" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6460">rezultat”</text>

    <!-- ramura parcursă -->
    <rect x="340" y="300" width="180" height="44" rx="6" fill="#E2F6FA" stroke="#0E7F96" stroke-width="4"/>
    <text x="430" y="328" text-anchor="middle" font-size="15" font-weight="800">r ← c % a + b</text>

    <g font-size="15" font-weight="800">
      <text x="190" y="284" fill="#6B6460">Da</text>
      <text x="280" y="204" fill="#0E7F96">Nu</text>
      <text x="440" y="284" fill="#0E7F96">Da</text>
      <text x="530" y="204" fill="#6B6460">Nu</text>
    </g>

    <rect x="255" y="440" width="100" height="30" rx="15" fill="#171416"/>
    <text x="305" y="460" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF7EE">STOP</text>

    <g stroke="#B5ACA5" stroke-width="2.5" fill="none" stroke-dasharray="6 5">
      <path d="M180 260V296" marker-end="url(#g)"/>
      <path d="M520 216H592V282" marker-end="url(#g)"/>
      <path d="M180 344V410H305M592 344V410H430"/>
    </g>
    <g stroke="#0E7F96" stroke-width="5" fill="none">
      <path d="M180 96V108" marker-end="url(#v)"/>
      <path d="M180 148V168" marker-end="url(#v)"/>
      <path d="M270 216H336" marker-end="url(#v)"/>
      <path d="M430 260V296" marker-end="url(#v)"/>
      <path d="M430 344V410H305V436" marker-end="url(#v)"/>
    </g>

    <!-- panou -->
    <rect x="670" y="66" width="250" height="440" rx="18" fill="#FFFFFF" stroke="#7A3FB8" stroke-width="3"/>
    <text x="795" y="96" text-anchor="middle" font-size="17" font-weight="800" fill="#7A3FB8">Cutiile variabilelor</text>
    <g font-size="14" font-weight="700" fill="#0E7F96">
      <rect x="688" y="110" width="50" height="54" rx="8" fill="#E2F6FA"/><text x="696" y="126">a</text>
      <rect x="746" y="110" width="50" height="54" rx="8" fill="#E2F6FA"/><text x="754" y="126">b</text>
      <rect x="804" y="110" width="50" height="54" rx="8" fill="#E2F6FA"/><text x="812" y="126">c</text>
      <rect x="862" y="110" width="44" height="54" rx="8" fill="#14A39A"/><text x="869" y="126" fill="#fff">r</text>
    </g>
    <g font-size="20" font-weight="800" text-anchor="middle">
      <text x="713" y="154">3</text><text x="771" y="154">2</text><text x="829" y="154">9</text><text x="884" y="154" fill="#fff">2</text>
    </g>

    <g font-size="15">
      <circle cx="702" cy="200" r="13" fill="#FFC83D"/><text x="702" y="205" text-anchor="middle" font-weight="800">1</text>
      <text x="724" y="205" font-weight="800">b &gt; 7 ?</text>
      <text x="724" y="228">2 &gt; 7 este <tspan font-weight="800" fill="#C8133A">Fals</tspan></text>
      <text x="724" y="250" fill="#6B6460">mergem pe Nu</text>

      <circle cx="702" cy="290" r="13" fill="#FFC83D"/><text x="702" y="295" text-anchor="middle" font-weight="800">2</text>
      <text x="724" y="295" font-weight="800">a &gt; 0 ?</text>
      <text x="724" y="318">3 &gt; 0 este <tspan font-weight="800" fill="#0B6F68">Adevărat</tspan></text>
      <text x="724" y="340" fill="#6B6460">mergem pe Da</text>

      <circle cx="702" cy="380" r="13" fill="#3EC6E0"/><text x="702" y="385" text-anchor="middle" font-weight="800" fill="#fff">3</text>
      <text x="724" y="385" font-weight="800">calculăm r</text>
      <text x="724" y="408">r ← 9 % 3 + 2</text>
      <text x="724" y="430">r ← 0 + 2</text>
      <text x="724" y="456" font-size="18" font-weight="800" fill="#0B6F68">r = 2</text>
    </g>
    <text x="355" y="500" text-anchor="middle" font-size="14" fill="#6B6460">Linia groasă arată drumul parcurs; liniile punctate nu se execută.</text>
  </g>
</svg>
