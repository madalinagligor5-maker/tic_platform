<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Un site web cu patru pagini legate prin hiperlinkuri și drumul cel mai scurt de la pagina de start A la pagina D</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6460"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F21F4B"/></marker>
    <g id="pg"><path d="M0 0h86l24 24v106h-110z" fill="#FFFFFF" stroke="#171416" stroke-width="3" stroke-linejoin="round"/><path d="M86 0v24h24" fill="none" stroke="#171416" stroke-width="3"/><path d="M16 80h70M16 94h78M16 108h56" stroke="#E8DFD3" stroke-width="5" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="800">Un site web: pagini legate prin hiperlinkuri</text>

    <rect x="40" y="70" width="880" height="344" rx="18" fill="#FFFFFF" fill-opacity="0.6" stroke="#E8DFD3" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="60" y="100" font-size="15" font-weight="800" fill="#6B6460">site-ul</text>

    <use href="#pg" x="80" y="190"/>
    <text x="135" y="238" text-anchor="middle" font-size="34" font-weight="800" fill="#C8133A">A</text>
    <text x="135" y="346" text-anchor="middle" font-size="13" font-weight="700">pagina de start</text>
    <use href="#pg" x="400" y="92"/>
    <text x="455" y="140" text-anchor="middle" font-size="34" font-weight="800">B</text>
    <use href="#pg" x="400" y="262"/>
    <text x="455" y="310" text-anchor="middle" font-size="34" font-weight="800" fill="#C8133A">C</text>
    <use href="#pg" x="720" y="262"/>
    <text x="775" y="310" text-anchor="middle" font-size="34" font-weight="800" fill="#C8133A">D</text>

    <g stroke-width="4" fill="none">
      <path d="M196 230L392 162" stroke="#6B6460" marker-end="url(#g)"/>
      <path d="M196 290L392 330" stroke="#F21F4B" marker-end="url(#r)"/>
      <path d="M516 330H712" stroke="#F21F4B" marker-end="url(#r)"/>
    </g>
    <text x="270" y="186" font-size="13" fill="#6B6460" font-weight="700" transform="rotate(-19 270 186)">hiperlink</text>
    <text x="262" y="292" font-size="13" fill="#C8133A" font-weight="700" transform="rotate(11 262 292)">hiperlink</text>
    <text x="614" y="318" text-anchor="middle" font-size="13" fill="#C8133A" font-weight="700">hiperlink</text>
    <text x="530" y="160" font-size="13" fill="#6B6460">din B nu există link spre D</text>

    <rect x="40" y="428" width="880" height="80" rx="16" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <text x="60" y="462" font-size="16" font-weight="800" fill="#C8133A">Drumul cel mai scurt spre D:</text>
    <text x="320" y="462" font-size="20" font-weight="800">A → C → D</text>
    <text x="60" y="490" font-size="14">Parcurgi 3 pagini, inclusiv pagina de start. Drumul prin B nu ajută.</text>
  </g>
</svg>
