<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t">
  <title id="t">Schema simplificată a interfeței Scratch, cu zonele numerotate de la 1 la 8</title>
  <defs>
    <g id="flag"><path d="M0 0v18" stroke="#0B6F68" stroke-width="3"/><path d="M1 1h14l-4 5l4 5h-14z" fill="#14A39A"/></g>
  </defs>
  <rect width="960" height="600" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="800">Interfața Scratch</text>

    <!-- fereastra -->
    <rect x="30" y="60" width="900" height="410" rx="12" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <path d="M33 63h894v32h-894z" fill="#0E7F96"/>
    <circle cx="56" cy="79" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M47 79h18M56 70c-5 6-5 12 0 18M56 70c5 6 5 12 0 18" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="80" y="85" font-size="14" font-weight="700" fill="#FFFFFF">Fișier</text>
    <text x="140" y="85" font-size="14" font-weight="700" fill="#FFFFFF">Editare</text>

    <!-- file -->
    <path d="M33 95h587v32h-587z" fill="#F1E9DF"/>
    <rect x="40" y="99" width="70" height="28" rx="6" fill="#FFFFFF"/>
    <text x="75" y="118" text-anchor="middle" font-size="14" font-weight="800">Cod</text>
    <text x="160" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6460">Costume</text>
    <text x="270" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6460">Sunete</text>

    <!-- categorii -->
    <path d="M33 127h97v340h-97z" fill="#FFF7EE"/>
    <g font-size="13" text-anchor="middle">
      <circle cx="81" cy="146" r="8" fill="#3EC6E0"/><text x="81" y="168">Mișcare</text>
      <circle cx="81" cy="186" r="8" fill="#0E7F96"/><text x="81" y="208">Aspect</text>
      <circle cx="81" cy="226" r="8" fill="#F21F4B"/><text x="81" y="248">Sunet</text>
      <circle cx="81" cy="266" r="8" fill="#F29A1F"/><text x="81" y="288">Evenimente</text>
      <circle cx="81" cy="306" r="8" fill="#C8133A"/><text x="81" y="328">Control</text>
      <circle cx="81" cy="346" r="8" fill="#14A39A"/><text x="81" y="368">Detectare</text>
      <circle cx="81" cy="386" r="8" fill="#0B6F68"/><text x="81" y="408">Operatori</text>
      <circle cx="81" cy="426" r="8" fill="#6B6460"/><text x="81" y="448">Variabile</text>
    </g>
    <!-- paleta -->
    <path d="M130 127v340" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="13" fill="#FFFFFF" font-weight="700">
      <rect x="142" y="150" width="146" height="30" rx="6" fill="#3EC6E0"/><text x="152" y="170">mergi 10 pași</text>
      <rect x="142" y="192" width="146" height="30" rx="6" fill="#3EC6E0"/><text x="152" y="212">rotește-te 15°</text>
      <rect x="142" y="234" width="146" height="30" rx="6" fill="#3EC6E0"/><text x="152" y="254">mergi la x: y:</text>
      <rect x="142" y="276" width="146" height="30" rx="6" fill="#3EC6E0"/><text x="152" y="296">alunecă la x: y:</text>
      <rect x="142" y="318" width="146" height="30" rx="6" fill="#3EC6E0"/><text x="152" y="338">schimbă x cu 10</text>
    </g>
    <!-- zona de program -->
    <path d="M300 127h320v340h-320z" fill="#FFFFFF"/>
    <path d="M300 127v340M620 95v372" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="13" font-weight="700" fill="#FFFFFF">
      <path d="M340 170c20-22 70-22 90 0h150v34h-240z" fill="#F29A1F"/>
      <text x="352" y="194">când se dă clic pe</text><use href="#flag" x="522" y="179"/>
      <rect x="340" y="204" width="240" height="32" rx="4" fill="#3EC6E0"/><text x="352" y="225">mergi la x: 150 y: 0</text>
      <rect x="340" y="236" width="240" height="32" rx="4" fill="#F21F4B"/><text x="352" y="257">pornește sunetul Miau</text>
    </g>
    <rect x="300" y="430" width="320" height="37" fill="#F1E9DF"/>
    <text x="460" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#6B6460">Rucsac</text>

    <!-- scena -->
    <use href="#flag" x="640" y="102"/>
    <circle cx="676" cy="111" r="9" fill="#F21F4B"/>
    <rect x="640" y="132" width="270" height="196" rx="6" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <path d="M643 290h264v35h-264z" fill="#E0F4F2"/>
    <circle cx="790" cy="246" r="26" fill="#F29A1F"/>
    <circle cx="781" cy="241" r="4" fill="#171416"/><circle cx="799" cy="241" r="4" fill="#171416"/>
    <path d="M780 256q10 8 20 0" stroke="#171416" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M772 270l-8 20M808 270l8 20" stroke="#F29A1F" stroke-width="6" stroke-linecap="round"/>

    <!-- personaje și decoruri -->
    <path d="M620 340h310M820 340v127" stroke="#E8DFD3" stroke-width="3"/>
    <text x="640" y="364" font-size="14" font-weight="700">Personaje</text>
    <rect x="640" y="376" width="64" height="64" rx="8" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <circle cx="672" cy="408" r="16" fill="#F29A1F"/>
    <text x="838" y="364" font-size="14" font-weight="700">Decoruri</text>
    <rect x="838" y="376" width="72" height="54" rx="6" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>

    <!-- numere -->
    <g font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      <circle cx="270" cy="378" r="14" fill="#171416"/><text x="270" y="383">1</text>
      <circle cx="596" cy="152" r="14" fill="#171416"/><text x="596" y="157">2</text>
      <circle cx="886" cy="156" r="14" fill="#171416"/><text x="886" y="161">3</text>
      <circle cx="790" cy="408" r="14" fill="#171416"/><text x="790" y="413">4</text>
      <circle cx="874" cy="450" r="14" fill="#171416"/><text x="874" y="455">5</text>
      <circle cx="222" cy="111" r="12" fill="#171416"/><text x="222" y="116" font-size="14">6</text>
      <circle cx="318" cy="111" r="12" fill="#171416"/><text x="318" y="116" font-size="14">7</text>
      <circle cx="400" cy="449" r="13" fill="#171416"/><text x="400" y="454" font-size="14">8</text>
    </g>

    <!-- legendă -->
    <g font-size="15">
      <text x="40" y="510"><tspan font-weight="800">1</tspan> Paleta de blocuri</text>
      <text x="270" y="510"><tspan font-weight="800">2</tspan> Zona de program</text>
      <text x="500" y="510"><tspan font-weight="800">3</tspan> Scena</text>
      <text x="700" y="510"><tspan font-weight="800">4</tspan> Zona personajelor</text>
      <text x="40" y="544"><tspan font-weight="800">5</tspan> Zona decorurilor</text>
      <text x="270" y="544"><tspan font-weight="800">6</tspan> Fila Costume</text>
      <text x="500" y="544"><tspan font-weight="800">7</tspan> Fila Sunete</text>
      <text x="700" y="544"><tspan font-weight="800">8</tspan> Rucsacul</text>
    </g>
  </g>
</svg>
