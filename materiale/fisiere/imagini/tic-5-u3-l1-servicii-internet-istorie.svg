<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Axa timpului: 1969 ARPANET, prima rețea; 1971 primul e-mail, trimis de Ray Tomlinson; anii '70 bazele internetului; 1989 apare WWW</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800">Câteva momente din istoria internetului</text>

    <!-- axa -->
    <path d="M60 300H880" stroke="#6B6460" stroke-width="6" stroke-linecap="round"/>
    <path d="M880 286l26 14l-26 14z" fill="#6B6460"/>

    <!-- 1969 -->
    <circle cx="150" cy="300" r="16" fill="#F21F4B" stroke="#FFFFFF" stroke-width="4"/>
    <text x="150" y="346" text-anchor="middle" font-size="26" font-weight="800" fill="#C8133A">1969</text>
    <path d="M150 284V250" stroke="#F21F4B" stroke-width="3"/>
    <rect x="50" y="90" width="200" height="160" rx="16" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <g stroke="#C8133A" stroke-width="3" fill="#FFFFFF">
      <circle cx="110" cy="130" r="10"/><circle cx="150" cy="116" r="10"/><circle cx="190" cy="130" r="10"/>
      <path d="M120 128l20-8M160 120l20 8M118 136l64 0" fill="none"/>
    </g>
    <text x="150" y="176" text-anchor="middle" font-size="18" font-weight="800">ARPANET</text>
    <text x="150" y="200" text-anchor="middle" font-size="14">prima rețea</text>
    <text x="150" y="220" text-anchor="middle" font-size="14">de calculatoare</text>
    <text x="150" y="240" text-anchor="middle" font-size="14">(SUA, ARPA)</text>

    <!-- 1971 -->
    <circle cx="370" cy="300" r="16" fill="#FFC83D" stroke="#FFFFFF" stroke-width="4"/>
    <text x="370" y="346" text-anchor="middle" font-size="26" font-weight="800" fill="#171416">1971</text>
    <path d="M370 362V384" stroke="#FFC83D" stroke-width="3"/>
    <rect x="270" y="384" width="200" height="130" rx="16" fill="#FFF4D6" stroke="#FFC83D" stroke-width="3"/>
    <rect x="350" y="398" width="40" height="28" rx="4" fill="#FFFFFF" stroke="#171416" stroke-width="2.5"/>
    <path d="M350 400l20 14l20-14" fill="none" stroke="#171416" stroke-width="2.5"/>
    <text x="370" y="452" text-anchor="middle" font-size="16" font-weight="800">primul e-mail</text>
    <text x="370" y="474" text-anchor="middle" font-size="14">trimis de</text>
    <text x="370" y="494" text-anchor="middle" font-size="14" font-weight="700">Ray Tomlinson</text>

    <!-- anii 70 -->
    <circle cx="590" cy="300" r="16" fill="#14A39A" stroke="#FFFFFF" stroke-width="4"/>
    <text x="590" y="346" text-anchor="middle" font-size="26" font-weight="800" fill="#0B6F68">anii '70</text>
    <path d="M590 284V250" stroke="#14A39A" stroke-width="3"/>
    <rect x="490" y="90" width="200" height="160" rx="16" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <circle cx="590" cy="132" r="24" fill="#FFFFFF" stroke="#0B6F68" stroke-width="3"/>
    <ellipse cx="590" cy="132" rx="10" ry="24" fill="none" stroke="#0B6F68" stroke-width="2"/>
    <path d="M566 132h48" stroke="#0B6F68" stroke-width="2"/>
    <text x="590" y="182" text-anchor="middle" font-size="16" font-weight="800">bazele internetului</text>
    <text x="590" y="206" text-anchor="middle" font-size="14">un proiect ARPA pentru</text>
    <text x="590" y="226" text-anchor="middle" font-size="14">o rețea cât mai sigură</text>

    <!-- 1989 -->
    <circle cx="800" cy="300" r="16" fill="#3EC6E0" stroke="#FFFFFF" stroke-width="4"/>
    <text x="800" y="346" text-anchor="middle" font-size="26" font-weight="800" fill="#0E7F96">1989</text>
    <path d="M800 362V384" stroke="#3EC6E0" stroke-width="3"/>
    <rect x="700" y="384" width="200" height="130" rx="16" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <text x="800" y="420" text-anchor="middle" font-size="20" font-weight="800" fill="#0E7F96">WWW</text>
    <text x="800" y="448" text-anchor="middle" font-size="14">inventat de</text>
    <text x="800" y="468" text-anchor="middle" font-size="14" font-weight="700">Tim Berners-Lee</text>
    <text x="800" y="490" text-anchor="middle" font-size="14">la CERN</text>

    <text x="800" y="150" text-anchor="middle" font-size="14" fill="#6B6460">Despre web afli</text>
    <text x="800" y="170" text-anchor="middle" font-size="14" fill="#6B6460">în lecția următoare.</text>
  </g>
</svg>
