    <path d="M114 54h-14M114 54l-5-5M114 54l-5 5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M124 47l12 7-12 7z" fill="#FFFFFF"/>
    <text x="270" y="59" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Prezentare1</text>
    <rect x="360" y="44" width="150" height="20" rx="10" fill="#FDE7EC"/>
    <text x="376" y="58" font-size="13" fill="#C8133A">Căutare</text>
    <path d="M560 54h12M592 48h10v10h-10zM620 48l10 10M630 48l-10 10" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <!-- file -->
