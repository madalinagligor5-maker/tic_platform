    <rect x="38" y="100" width="604" height="54" fill="#F1E9DF"/>
    <g fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2">
      <rect x="50" y="106" width="30" height="28" rx="4"/><rect x="86" y="106" width="22" height="13" rx="3"/><rect x="86" y="121" width="22" height="13" rx="3"/>
      <rect x="130" y="106" width="36" height="28" rx="4"/><rect x="172" y="106" width="36" height="28" rx="4"/>
      <rect x="230" y="106" width="110" height="13" rx="3"/><rect x="230" y="121" width="24" height="13" rx="3"/><rect x="258" y="121" width="24" height="13" rx="3"/><rect x="286" y="121" width="24" height="13" rx="3"/>
      <rect x="362" y="106" width="90" height="13" rx="3"/><rect x="362" y="121" width="90" height="13" rx="3"/>
    </g>
    <path d="M120 106v40M220 106v40M352 106v40M462 106v40" stroke="#E8DFD3" stroke-width="2"/>
