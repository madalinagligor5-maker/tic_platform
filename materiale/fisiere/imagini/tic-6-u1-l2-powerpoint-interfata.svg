      <circle cx="620" cy="127" r="13" fill="#171416"/><text x="620" y="132" fill="#FFFFFF">2</text>
      <circle cx="320" cy="486" r="13" fill="#171416"/><text x="320" y="491" fill="#FFFFFF">3</text>
      <circle cx="93" cy="440" r="13" fill="#171416"/><text x="93" y="445" fill="#FFFFFF">4</text>
      <circle cx="616" cy="428" r="13" fill="#171416"/><text x="616" y="433" fill="#FFFFFF">5</text>
      <circle cx="610" cy="184" r="13" fill="#171416"/><text x="610" y="189" fill="#FFFFFF">6</text>
    </g>

    <!-- legendă -->
    <g font-size="15">
      <circle cx="686" cy="64" r="14" fill="#C8133A"/><text x="686" y="69" text-anchor="middle" font-weight="800" fill="#FFFFFF">1</text>
      <text x="710" y="62" font-weight="800">Bara de titlu</text><text x="710" y="82" font-size="13" fill="#6B6460">cu Bara de acces rapid</text>
      <circle cx="686" cy="136" r="14" fill="#C8133A"/><text x="686" y="141" text-anchor="middle" font-weight="800" fill="#FFFFFF">2</text>
      <text x="710" y="134" font-weight="800">Panglica</text><text x="710" y="154" font-size="13" fill="#6B6460">comenzile, grupate pe file</text>
      <circle cx="686" cy="208" r="14" fill="#C8133A"/><text x="686" y="213" text-anchor="middle" font-weight="800" fill="#FFFFFF">3</text>
      <text x="710" y="206" font-weight="800">Bara de status</text><text x="710" y="226" font-size="13" fill="#6B6460">nr. diapozitivului, Note, zoom</text>
      <circle cx="686" cy="280" r="14" fill="#C8133A"/><text x="686" y="285" text-anchor="middle" font-weight="800" fill="#FFFFFF">4</text>
      <text x="710" y="278" font-weight="800">Panoul de miniaturi</text><text x="710" y="298" font-size="13" fill="#6B6460">câte o imagine mică pe diapozitiv</text>
      <circle cx="686" cy="352" r="14" fill="#C8133A"/><text x="686" y="357" text-anchor="middle" font-weight="800" fill="#FFFFFF">5</text>
      <text x="710" y="350" font-weight="800">Panoul de note</text><text x="710" y="370" font-size="13" fill="#6B6460">publicul nu vede notele</text>
      <circle cx="686" cy="424" r="14" fill="#C8133A"/><text x="686" y="429" text-anchor="middle" font-weight="800" fill="#FFFFFF">6</text>
      <text x="710" y="422" font-weight="800">Panoul diapozitiv</text><text x="710" y="442" font-size="13" fill="#6B6460">zona în care lucrezi</text>
    </g>
    <text x="672" y="490" font-size="13" fill="#6B6460">Fișierul se salvează ca .pptx</text>
