    <rect x="268" y="276" width="254" height="40" rx="4" fill="none" stroke="#6B6460" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="395" y="301" text-anchor="middle" font-size="13" fill="#6B6460">Subtitlu</text>
    <!-- note -->
    <path d="M150 388H642" stroke="#E8DFD3" stroke-width="2"/>
    <text x="166" y="414" font-size="13" fill="#6B6460">Faceți clic pentru a adăuga note</text>
