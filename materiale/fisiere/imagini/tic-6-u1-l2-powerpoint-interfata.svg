      <text x="106" y="91" font-weight="800" fill="#C8133A">Pornire</text>
      <text x="172" y="91">Inserare</text>
      <text x="246" y="91">Proiectare</text>
      <text x="334" y="91">Tranziții</text>
      <text x="408" y="91">Animații</text>
    </g>
    <path d="M106 97h52" stroke="#C8133A" stroke-width="3"/>
