<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Fereastra unei aplicații de prezentare: bara de titlu, panglica, bara de status, panoul de miniaturi, panoul de note și panoul diapozitiv</title>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- fereastra -->
    <rect x="36" y="36" width="608" height="468" rx="12" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="3"/>
