    <rect x="38" y="154" width="110" height="316" fill="#FFF7EE"/>
    <text x="50" y="176" font-size="13" fill="#6B6460">1</text>
    <rect x="64" y="164" width="72" height="42" rx="3" fill="#FFFFFF" stroke="#C8133A" stroke-width="3"/>
    <rect x="72" y="178" width="56" height="8" rx="4" fill="#E8DFD3"/>
    <text x="50" y="232" font-size="13" fill="#6B6460">2</text>
    <rect x="64" y="220" width="72" height="42" rx="3" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <rect x="72" y="228" width="40" height="6" rx="3" fill="#E8DFD3"/><rect x="72" y="240" width="54" height="5" rx="2" fill="#F1E9DF"/><rect x="72" y="250" width="48" height="5" rx="2" fill="#F1E9DF"/>
    <text x="50" y="288" font-size="13" fill="#6B6460">3</text>
    <rect x="64" y="276" width="72" height="42" rx="3" fill="#FFFFFF" stroke="#E8DFD3" stroke-width="2"/>
    <rect x="72" y="284" width="26" height="26" rx="2" fill="#E2F6FA"/><rect x="104" y="288" width="24" height="5" rx="2" fill="#F1E9DF"/>
    <path d="M148 154V470" stroke="#E8DFD3" stroke-width="2"/>
