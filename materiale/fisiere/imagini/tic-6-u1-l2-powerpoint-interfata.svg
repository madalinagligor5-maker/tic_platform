    <text x="400" y="491" font-size="13">Note</text>
    <rect x="446" y="480" width="14" height="12" rx="2" fill="none" stroke="#171416" stroke-width="2"/>
    <rect x="466" y="480" width="14" height="12" rx="2" fill="none" stroke="#171416" stroke-width="2"/>
    <path d="M500 486H600" stroke="#6B6460" stroke-width="2"/><circle cx="560" cy="486" r="5" fill="#171416"/>

    <!-- numere -->
    <g font-size="14" font-weight="800" text-anchor="middle">
