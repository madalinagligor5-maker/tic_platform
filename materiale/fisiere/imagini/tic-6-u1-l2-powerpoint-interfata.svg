    <rect x="36" y="36" width="608" height="36" rx="12" fill="#C8133A"/>
    <rect x="36" y="60" width="608" height="12" fill="#C8133A"/>
    <rect x="52" y="46" width="16" height="16" rx="3" fill="#FFFFFF"/>
