<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Fișierul din cloud deschis de mai multe persoane, de pe dispozitive diferite, și cele trei drepturi de partajare: vizualizator, comentator, editor</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <!-- nor -->
    <path d="M382 200a50 50 0 0 1 10-98a70 70 0 0 1 132-22a56 56 0 0 1 64 58a40 40 0 0 1-6 62z" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <rect x="452" y="104" width="56" height="70" rx="6" fill="#FFFFFF" stroke="#0E7F96" stroke-width="3"/>
    <path d="M462 122h36M462 136h36M462 150h24" stroke="#0E7F96" stroke-width="3" stroke-linecap="round"/>
    <text x="480" y="228" text-anchor="middle" font-size="15" font-weight="800">fișierul stă în cloud</text>
    <text x="480" y="248" text-anchor="middle" font-size="13" fill="#6B6460">salvare automată și istoricul versiunilor</text>
    <!-- laptop -->
    <rect x="80" y="96" width="140" height="88" rx="8" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <rect x="92" y="108" width="116" height="64" rx="3" fill="#FFF0DB"/>
    <path d="M60 184h180l-12 14H72z" fill="#171416"/>
    <text x="150" y="226" text-anchor="middle" font-size="14" font-weight="700">Ana (laptop)</text>
    <!-- tabletă -->
    <rect x="700" y="80" width="90" height="120" rx="12" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <rect x="710" y="94" width="70" height="92" rx="3" fill="#E0F4F2"/>
    <text x="745" y="226" text-anchor="middle" font-size="14" font-weight="700">Mihai (tabletă)</text>
    <!-- telefon -->
    <rect x="845" y="104" width="50" height="86" rx="10" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <rect x="852" y="116" width="36" height="60" rx="3" fill="#FDE7EC"/>
    <text x="870" y="226" text-anchor="middle" font-size="14" font-weight="700">Ioana (telefon)</text>
    <g stroke="#171416" stroke-width="3" fill="none" stroke-dasharray="7 5">
      <path d="M246 140H366" marker-start="url(#sag)" marker-end="url(#sag)"/>
      <path d="M598 140H692" marker-start="url(#sag)" marker-end="url(#sag)"/>
      <path d="M566 76Q720 30 862 96" marker-start="url(#sag)" marker-end="url(#sag)"/>
    </g>
    <text x="306" y="128" text-anchor="middle" font-size="13" fill="#6B6460">internet</text>

    <!-- drepturi -->
    <path d="M40 304H920" stroke="#E8DFD3" stroke-width="3"/>
    <text x="40" y="338" font-size="18" font-weight="800">Partajare: ce drept primește fiecare?</text>
    <rect x="40" y="356" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <path d="M64 394q22-22 44 0q-22 22-44 0z" fill="#E2F6FA" stroke="#0E7F96" stroke-width="3"/><circle cx="86" cy="394" r="6" fill="#0E7F96"/>
    <text x="124" y="392" font-size="17" font-weight="800" fill="#0E7F96">Vizualizator</text>
    <text x="124" y="414" font-size="14">doar citește</text>
    <rect x="345" y="356" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#F29A1F" stroke-width="3"/>
    <path d="M368 380h44a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6h-28l-12 10v-10h-4a6 6 0 0 1-6-6v-18a6 6 0 0 1 6-6z" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="430" y="392" font-size="17" font-weight="800">Comentator</text>
    <text x="430" y="414" font-size="14">citește și lasă</text>
    <text x="430" y="434" font-size="14">comentarii, sugestii</text>
    <rect x="650" y="356" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#F21F4B" stroke-width="3"/>
    <path d="M676 414l30-30 10 10-30 30h-10z" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="734" y="392" font-size="17" font-weight="800" fill="#C8133A">Editor</text>
    <text x="734" y="414" font-size="14">poate modifica tot</text>
    <path d="M100 486H860" stroke="#6B6460" stroke-width="3" marker-end="url(#sag)"/>
    <rect x="300" y="474" width="360" height="26" rx="13" fill="#FFF7EE"/>
    <text x="480" y="492" text-anchor="middle" font-size="14" font-weight="700">tot mai multe drepturi: dă-l pe cel mai mic necesar</text>
  </g>
</svg>
