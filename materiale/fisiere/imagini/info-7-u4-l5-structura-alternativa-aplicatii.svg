<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Lanțul if … else if … else pentru calificative: condițiile se verifică de sus în jos și se execută doar prima ramură adevărată</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="50" text-anchor="middle" font-size="24" font-weight="800">Lanțul if … else if … else</text>

    <!-- romb 1 -->
    <path d="M230 90L340 132L230 174L120 132Z" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="230" y="138" text-anchor="middle" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">nota &gt;= 9</text>
    <path d="M340 132H428" stroke="#0B6F68" stroke-width="3" marker-end="url(#sag)"/>
    <text x="384" y="122" text-anchor="middle" font-size="14" font-weight="800" fill="#0B6F68">DA</text>
    <rect x="436" y="108" width="190" height="48" rx="12" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="531" y="138" text-anchor="middle" font-size="16" font-weight="800">Foarte bine</text>
    <path d="M230 174V206" stroke="#C8133A" stroke-width="3" marker-end="url(#sag)"/>
    <text x="244" y="196" font-size="14" font-weight="800" fill="#C8133A">NU</text>

    <!-- romb 2 -->
    <path d="M230 212L340 254L230 296L120 254Z" fill="#FFF0DB" stroke="#F29A1F" stroke-width="5"/>
    <text x="230" y="260" text-anchor="middle" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">nota &gt;= 7</text>
    <path d="M340 254H428" stroke="#0B6F68" stroke-width="3" marker-end="url(#sag)"/>
    <text x="384" y="244" text-anchor="middle" font-size="14" font-weight="800" fill="#0B6F68">DA</text>
    <rect x="436" y="230" width="190" height="48" rx="12" fill="#14A39A" stroke="#0B6F68" stroke-width="3"/>
    <text x="531" y="260" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">Bine</text>
    <path d="M230 296V328" stroke="#C8133A" stroke-width="3" marker-end="url(#sag)"/>
    <text x="244" y="318" font-size="14" font-weight="800" fill="#C8133A">NU</text>

    <!-- romb 3 -->
    <path d="M230 334L340 376L230 418L120 376Z" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="230" y="382" text-anchor="middle" font-size="16" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">nota &gt;= 5</text>
    <path d="M340 376H428" stroke="#0B6F68" stroke-width="3" marker-end="url(#sag)"/>
    <text x="384" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#0B6F68">DA</text>
    <rect x="436" y="352" width="190" height="48" rx="12" fill="#E0F4F2" stroke="#14A39A" stroke-width="3"/>
    <text x="531" y="382" text-anchor="middle" font-size="16" font-weight="800">Suficient</text>
    <path d="M230 418V450" stroke="#C8133A" stroke-width="3" marker-end="url(#sag)"/>
    <text x="244" y="440" font-size="14" font-weight="800" fill="#C8133A">NU (else)</text>
    <rect x="135" y="456" width="190" height="48" rx="12" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <text x="230" y="486" text-anchor="middle" font-size="16" font-weight="800">Insuficient</text>

                <path d="M56 110V400" stroke="#E8DFD3" stroke-width="3" marker-end="url(#sag)"/>
    <text x="56" y="430" text-anchor="middle" font-size="13" fill="#6B6460">de sus</text>
    <text x="56" y="448" text-anchor="middle" font-size="13" fill="#6B6460">în jos</text>

    <!-- exemplu -->
    <rect x="670" y="96" width="250" height="300" rx="16" fill="#FFFFFF" stroke="#3EC6E0" stroke-width="3"/>
    <text x="690" y="128" font-size="17" font-weight="800" fill="#0E7F96">Exemplu: nota = 8</text>
    <g font-size="15">
      <text x="690" y="166" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">8 &gt;= 9 ?</text>
      <text x="800" y="166" font-weight="800" fill="#C8133A">NU</text>
      <text x="690" y="200" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">8 &gt;= 7 ?</text>
      <text x="800" y="200" font-weight="800" fill="#0B6F68">DA</text>
      <text x="690" y="234">se afișează „Bine”</text>
    </g>
    <path d="M690 256H900" stroke="#E8DFD3" stroke-width="3"/>
    <g font-size="14">
      <text x="690" y="284">Condiția „nota &gt;= 5” nu se</text>
      <text x="690" y="304">mai verifică: se execută</text>
      <text x="690" y="324">doar prima ramură</text>
      <text x="690" y="344">cu condiția adevărată.</text>
    </g>
    <rect x="670" y="420" width="250" height="84" rx="16" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="690" y="450" font-size="14">La „Bine” nu mai scrii</text>
    <text x="690" y="474" font-size="14">și <tspan font-family="JetBrains Mono, Consolas, monospace" font-weight="700">nota &lt; 9</tspan>: e deja</text>
    <text x="690" y="494" font-size="14">sigur, din ramura de sus.</text>
  </g>
</svg>
