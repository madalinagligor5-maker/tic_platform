<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">Transformarea vitezei din km/h în m/s și invers și pașii rezolvării unei probleme de fizică în C++</title>
  <defs>
    <marker id="sag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171416"/></marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFF7EE"/>
  <g font-family="Montserrat, Arial, sans-serif" fill="#171416">
    <text x="480" y="50" text-anchor="middle" font-size="24" font-weight="800">Viteza: km/h și m/s</text>

    <rect x="140" y="110" width="200" height="90" rx="45" fill="#E2F6FA" stroke="#3EC6E0" stroke-width="3"/>
    <text x="240" y="152" text-anchor="middle" font-size="26" font-weight="800" fill="#0E7F96">72 km/h</text>
    <text x="240" y="180" text-anchor="middle" font-size="13" fill="#6B6460">kilometri pe oră</text>
    <rect x="620" y="110" width="200" height="90" rx="45" fill="#FDE7EC" stroke="#F21F4B" stroke-width="3"/>
    <text x="720" y="152" text-anchor="middle" font-size="26" font-weight="800" fill="#C8133A">20 m/s</text>
    <text x="720" y="180" text-anchor="middle" font-size="13" fill="#6B6460">metri pe secundă</text>

    <path d="M346 132C430 92 530 92 612 132" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <rect x="430" y="80" width="100" height="34" rx="17" fill="#171416"/>
    <text x="480" y="103" text-anchor="middle" font-size="17" font-weight="800" fill="#FFF7EE">÷ 3,6</text>
    <path d="M612 180C530 220 430 220 346 180" stroke="#171416" stroke-width="3" fill="none" marker-end="url(#sag)"/>
    <rect x="430" y="196" width="100" height="34" rx="17" fill="#FFFFFF" stroke="#171416" stroke-width="3"/>
    <text x="480" y="219" text-anchor="middle" font-size="17" font-weight="800">× 3,6</text>
    <text x="480" y="266" text-anchor="middle" font-size="15">De ce 3,6? 1 km = 1000 m și 1 h = 3600 s, iar 3600 : 1000 = 3,6.</text>

    <path d="M40 292H920" stroke="#E8DFD3" stroke-width="3"/>
    <text x="40" y="324" font-size="17" font-weight="800">Pașii unei probleme de fizică</text>
    <g stroke-width="3">
      <rect x="40" y="342" width="132" height="76" rx="12" fill="#FFFFFF" stroke="#3EC6E0"/>
      <rect x="190" y="342" width="132" height="76" rx="12" fill="#FFFFFF" stroke="#3EC6E0"/>
      <rect x="340" y="342" width="132" height="76" rx="12" fill="#FFFFFF" stroke="#14A39A"/>
      <rect x="490" y="342" width="132" height="76" rx="12" fill="#FFFFFF" stroke="#14A39A"/>
      <rect x="640" y="342" width="132" height="76" rx="12" fill="#FFFFFF" stroke="#F29A1F"/>
      <rect x="790" y="342" width="130" height="76" rx="12" fill="#FFFFFF" stroke="#F21F4B"/>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="106" y="372" font-weight="800">1. date</text><text x="106" y="394">ce se dă,</text><text x="106" y="410">ce se cere</text>
      <text x="256" y="372" font-weight="800">2. formula</text><text x="256" y="398" font-family="JetBrains Mono, Consolas, monospace">v = d / t</text>
      <text x="406" y="372" font-weight="800">3. unitățile</text><text x="406" y="394">în același</text><text x="406" y="410">sistem</text>
      <text x="556" y="372" font-weight="800">4. tipul</text><text x="556" y="398" font-family="JetBrains Mono, Consolas, monospace">double</text>
      <text x="706" y="372" font-weight="800">5. programul</text><text x="706" y="394">citire, calcul,</text><text x="706" y="410">afișare</text>
      <text x="855" y="372" font-weight="800">6. testare</text><text x="855" y="394">cu valori</text><text x="855" y="410">cunoscute</text>
    </g>
    <g stroke="#171416" stroke-width="3" fill="none">
      <path d="M174 380H186"/><path d="M324 380H336"/><path d="M474 380H486"/><path d="M624 380H636"/><path d="M774 380H786"/>
    </g>

    <rect x="40" y="446" width="880" height="62" rx="14" fill="#FFF0DB" stroke="#F29A1F" stroke-width="3"/>
    <text x="480" y="473" text-anchor="middle" font-size="15"><tspan font-weight="800">Atenție:</tspan> între numere int, <tspan font-family="JetBrains Mono, Consolas, monospace" font-weight="700">7 / 2</tspan> dă 3.</text>
    <text x="480" y="495" text-anchor="middle" font-size="15">Cu double (sau <tspan font-family="JetBrains Mono, Consolas, monospace" font-weight="700">7.0 / 2</tspan>) obții 3.5.</text>
  </g>
</svg>
